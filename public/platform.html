/* ════════════════════════════════════════════════════════════════════
   TOKAI Platform — Módulo KYC Dual (views_kyc.js)
   DOS MODOS POR PROYECTO:
   MODO A (psav):   tokens transferibles con régimen CNV → Ripio API + Sumsub
   MODO B (issuer): soulbound sin régimen CNV → emisor verifica directamente
   MODO C (demo):   desarrollo y testing
   ════════════════════════════════════════════════════════════════════ */

var KYC_MODES = {
  psav:        { label: 'PSAV', color: '#4DA8FF', desc: 'Verificacion por PSAV registrado UIF' },
  issuer:      { label: 'Emisor', color: '#00D67E', desc: 'Verificacion directa del emisor · Solo soulbound sin CNV' },
  unavailable: { label: 'No disponible', color: '#888', desc: 'Falta el proyecto asociado para iniciar KYC' },
};
/* Devuelve el label del modo con el nombre del PSAV activo si aplica */
function kycModeLabel(project) {
  var mode = resolveKycMode(project);
  if (mode === 'psav') {
    var psav = getActivePsav ? getActivePsav(project) : null;
    return psav && psav.id !== 'none' ? 'PSAV · ' + psav.name : 'PSAV';
  }
  return KYC_MODES[mode] ? KYC_MODES[mode].label : mode;
}

function resolveKycMode(project) {
  if (!project) return 'unavailable';
  if (project.kycMode) return project.kycMode;
  if (project.soulbound && !/RG 106[89]|RG 1088/i.test(project.regime||'')) return 'issuer';
  if (/RG 106[89]|RG 1088/i.test(project.regime||'')) return 'psav';
  return 'psav';
}

function buildClaimHash(walletAddr, legalName, docNumber, kycMode) {
  const data = walletAddr + '|' + legalName + '|' + docNumber + '|' + kycMode + '|' + Date.now();
  var hash = 0;
  for (var i = 0; i < data.length; i++) { hash = ((hash << 5) - hash + data.charCodeAt(i)) | 0; }
  return '0x' + Math.abs(hash).toString(16).padStart(64, '0');
}

/* ─── KycGate: router principal ───────────────────────────────────── */
function KycGate({ project, walletAddr, chain, toast, onComplete }) {
  var mode = resolveKycMode(project);
  var modeInfo = KYC_MODES[mode];
  var already = chain && chain.identities && chain.identities[walletAddr];
  var [error, setError] = useState(null);
  var [submitted, setSubmitted] = useState(false);

  async function handleComplete(kycData) {
    var API = (typeof window !== 'undefined') && window.__API_URL__;
    if (!API) {
      /* Modo demo: sin backend, TOKAI no puede aprobar del otro lado — simular el
         registro on-chain localmente (mismo patrón que ensureKyc()/DEMO_WALLETS,
         L2545) en vez de dejar al inversor en un callejón sin salida. Ver hallazgo
         de QA en .context/tasks.md #48 — antes esto bloqueaba fondeo/suscripción/
         claims/OTC de punta a punta en cualquier sesión sin backend real. */
      if (chain && chain.registerIdentity) {
        chain.registerIdentity(walletAddr, kycData.jurisdiction || 32, kycData.category || 2);
      }
      setSubmitted(true);
      toast && toast({ title: 'KYC simulado (demo)', msg: 'Sin backend conectado: se registró tu identidad localmente para poder seguir probando el flujo.' });
      return;
    }
    // El KYC es 100% administrado por TOKAI. El inversor nunca puede
    // registrar su propia identidad on-chain (IdentityRegistry.sol exige
    // COMPLIANCE_ROLE, que solo tiene la wallet de TOKAI). Acá solo se envía la
    // solicitud; el registro on-chain lo dispara TOKAI al aprobar en el panel
    // (AdminAccesos → tab KYC → identityRegistryRegisterOnChain).
    try {
      var res = await fetch(API + '/kyc', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: walletAddr.toLowerCase() + '@wallet.tokai',
          wallet_address: walletAddr,
          jurisdiction: kycData.jurisdiction,
          provider: kycData.provider,
        }),
      });
      var data = await res.json();
      if (!res.ok) { setError(data.error || 'No se pudo enviar la solicitud.'); return; }
      setSubmitted(true);
      toast && toast({ title: 'KYC enviado a TOKAI', msg: 'Tu identidad quedó en revisión. Te avisamos cuando TOKAI la verifique on-chain.' });
    } catch (e) { setError(e.message || 'No se pudo enviar la solicitud.'); }
  }

  function handleError(msg) { setError(msg); toast && toast({ type: 'err', title: 'Error KYC', msg: msg }); }

  if (already && already.verified) return h('div', { style: { padding: '12px 16px', borderRadius: 10, background: 'rgba(0,214,126,.06)', border: '1px solid rgba(0,214,126,.2)', display: 'flex', gap: 10, alignItems: 'center' } },
    h('div', { style: { fontSize: 18 } }, '✅'),
    h('div', {},
      h('div', { style: { fontWeight: 700, fontSize: 13, color: 'var(--emerald)' } }, 'Identidad verificada'),
      h('div', { style: { fontSize: 11, color: 'var(--txt-mute)', marginTop: 2 } }, 'Via ' + modeInfo.label + ' · 0x..' + walletAddr.slice(-6))));

  if (submitted) return h('div', { style: { padding: '12px 16px', borderRadius: 10, background: 'rgba(255,178,62,.06)', border: '1px solid rgba(255,178,62,.2)', display: 'flex', gap: 10, alignItems: 'center' } },
    h('div', { style: { fontSize: 18 } }, '⏳'),
    h('div', {},
      h('div', { style: { fontWeight: 700, fontSize: 13, color: '#FFB23E' } }, 'KYC en revisión por TOKAI'),
      h('div', { style: { fontSize: 11, color: 'var(--txt-mute)', marginTop: 2 } }, 'TOKAI verifica y registra tu identidad on-chain — no hace falta que hagas nada más.')));

  return h('div', {},
    h('div', { style: { display: 'flex', gap: 8, alignItems: 'center', marginBottom: 14 } },
      h('span', { style: { padding: '3px 10px', borderRadius: 20, fontSize: 11, fontWeight: 700, background: modeInfo.color+'18', color: modeInfo.color, border: '1px solid '+modeInfo.color+'40' } }, modeInfo.label),
      h('span', { style: { fontSize: 11, color: 'var(--txt-mute)' } }, modeInfo.desc)),
    error ? h('div', { role: 'alert', 'aria-live': 'polite', style: { padding: '10px 12px', borderRadius: 8, background: 'rgba(255,92,92,.08)', border: '1px solid rgba(255,92,92,.25)', color: '#FF5C5C', fontSize: 12, marginBottom: 12 } }, error) : null,
    mode === 'psav'        ? h(KycPsavFlow,   { project: project, walletAddr: walletAddr, onComplete: handleComplete, onError: handleError }) : null,
    mode === 'issuer'      ? h(KycIssuerFlow, { project: project, walletAddr: walletAddr, chain: chain, onComplete: handleComplete, onError: handleError }) : null,
    mode === 'unavailable' ? h('div', { className: 'card', style: { color: 'var(--txt-mute)', fontSize: 12.5 } }, 'No se puede iniciar la verificación de identidad: falta el proyecto asociado a esta operación.') : null);
}

/* ─── AdminKycDual: panel del emisor para gestionar identidades (aislado por proyecto) ─────── */
function AdminKycDual({ chain, toast }) {

/* ─── Helpers del catálogo ─────────────────────────────────────────── */
function getPsavById(id) {
  return PSAV_CATALOG.find(function(p){ return p.id === id; }) || null;
}

function getActivePsav(project) {
  if (!project) return null;
  var id = project.psavId || (project.psav === 'Ripio' ? 'ripio' : null);
  if (id) return getPsavById(id);
  if (resolveKycMode(project) === 'issuer') return getPsavById('none');
  return getPsavById('ripio'); // default
}

function isPsavActive(project) {
  var psav = getActivePsav(project);
  return !!(psav && psav.id !== 'none' && project.psavActivated === true);
}

  var projects = chain.projects || [];
  var [pid, setPid] = useState(0);
  var p = projects[pid] || {};

  var [testResult, setTestResult] = useState(null);

  var selectedPsav = getPsavById(selectedPsavId) || PSAV_CATALOG[0];
  var currentPsav  = getActivePsav(p);
  var isActivated  = isPsavActive(p);

  var canActivate = kycMode === 'psav' && selectedPsavId !== 'none' && !activating;

  /* Cambio de proyecto */
  function switchProject(i) {
    var pr = projects[i] || {};
    setPid(i);
    setSelectedPsavId(pr.psavId || 'ripio');
    setShowConfirm(false);
    setTestResult(null);
  }

  /* Test de conectividad con el PSAV (simula ping a la API) */
  async function testConnection() {
    setTestResult('testing');
    await new Promise(function(r){ setTimeout(r, 1400); });
    var ok = selectedPsavId !== 'none';
    setTestResult(ok ? 'ok' : 'error');
    toast && toast({
      title: ok ? 'Conexion OK' : 'Sin conexion',
      msg: ok ? selectedPsav.name + ' responde correctamente' : 'No se pudo conectar con ' + selectedPsav.name,
      type: ok ? undefined : 'err',
    });
  }

  /* Activar el PSAV para el proyecto */
  async function activatePsav() {
    setActivating(true);
    await new Promise(function(r){ setTimeout(r, 1200); });
    if (chain.updateProject) {
      chain.updateProject(pid, {
        psavId: selectedPsavId,
        psav: selectedPsav.name,
        psavActivated: true,
        psavActivatedAt: new Date().toISOString(),
        psavCategories: selectedPsav.categories,
        psavKycProvider: selectedPsav.kycProvider,
        kycMode: selectedPsavId === 'none' ? 'issuer' : 'psav',

function RoleChoiceGate({ auth, onChosen, toast }) {
  var [busy, setBusy]   = useState(null);   /* 'investor' | 'issuer' mientras se guarda */
  var [error, setError] = useState('');

  ];
  async function choose(id) {
    if (busy) return;
    setBusy(id); setError('');
    try {
      var res = await fetch(window.__API_URL__ + '/auth/role-choice', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': 'application/json' },

      var data = await res.json().catch(function(){ return {}; });
      if (res.status === 409) {

        var me = await fetch(window.__API_URL__ + '/auth/me', { credentials: 'include' }).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });

    fetch(API + '/admin/users?role=investor&limit=200', { credentials: 'include' })
      .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })

    issuer_has_projects: 'Es un emisor con proyectos: pasarlo a inversor le quitaría el acceso a ellos.',
  };

  async function enable(e){
    if (e) e.preventDefault();
    var v = email.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { setFormErr(ERRORS.invalid_email); return; }
    setBusy(true); setFormErr('');

      h('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap' } },
        h('label', { htmlFor: 'tk-inv-email', className: 'sr-only', style: { position: 'absolute', width: 1, height: 1, overflow: 'hidden', clip: 'rect(0 0 0 0)' } }, 'Email del inversor'),
        h('input', { id: 'tk-inv-email', type: 'email', value: email, placeholder: 'inversor@email.com', autoComplete: 'off',
          'aria-invalid': !!formErr, 'aria-describedby': formErr ? 'tk-inv-err' : undefined,
          onChange: function(e){ setEmail(e.target.value); setFormErr(''); }, style: inp }),
        h('button', { type: 'submit', className: 'btn btn-primary btn-sm', disabled: busy || !email.trim() },
          busy ? 'Habilitando…' : 'Habilitar como inversor')),
      formErr && h('div', { id: 'tk-inv-err', role: 'alert', style: { color: '#FF5C5C', fontSize: 12, marginTop: 8 } }, formErr)),

    loadErr && h('div', { role: 'alert', className: 'card', style: { padding: '10px 12px', marginBottom: 12, color: '#FFB23E', fontSize: 12, display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
      loadErr, h('button', { className: 'btn btn-ghost btn-sm', onClick: load }, 'Reintentar')),

    rows === null
      ? h('div', { className: 'card', style: { padding: 24, textAlign: 'center', color: 'var(--txt-mute)', fontSize: 12.5 } }, 'Cargando inversores…')
      : rows.length === 0
        ? h('div', { className: 'card', style: { padding: 32, textAlign: 'center', color: 'var(--txt-mute)', fontSize: 13 } }, 'Todavía no hay cuentas de inversor. Habilitá la primera con el formulario.')
        : h('div', { className: 'card', style: { padding: 0, overflowX: 'auto' } },
            h('table', { style: { width: '100%', borderCollapse: 'collapse' } },

                return h('th', { key: t, scope: 'col', style: Object.assign({}, cell, { textAlign: 'left', fontSize: 11, color: 'var(--txt-mute)', textTransform: 'uppercase', letterSpacing: '.06em' }) }, t);
              }))),
              h('tbody', {}, rows.map(function(u){
                return h('tr', { key: u.id },
                  h('td', { style: Object.assign({}, cell, { color: 'var(--txt)' }) }, u.email),
                  h('td', { style: cell }, h('span', { className: 'badge ' + (u.status === 'approved' ? 'green' : 'gray') }, u.status === 'approved' ? 'Aprobado' : u.status)),
                  h('td', { style: Object.assign({}, cell, { fontFamily: 'var(--mono)' }) }, u.wallet_address ? short(u.wallet_address) : '—'),
                  h('td', { style: cell }, u.approved_at ? new Date(u.approved_at).toLocaleDateString('es-AR') : '—'),
                  h('td', { style: cell }, u.last_login ? new Date(u.last_login).toLocaleDateString('es-AR') : 'Nunca'));
              })))));

  function reviewKycEntry(id, action) {

    if (action === 'approve' && ![1, 2, 3].includes(Number(category))) {

      return;

            .catch(function(e){ toast && toast({ type: 'warn', title: 'Registro on-chain pendiente', msg: ((e && e.message) || 'No se pudo firmar.') + ' El KYC quedó aprobado en TOKAI; reintentá el registro on-chain cuando tengas la wallet de TOKAI conectada.' }); });
        }

/* ABI mínimo para leer el estado del instrumento sin depender de window.__ABIS__ */
var PREGAT_READ_ABI = [
  "function instrumentStatus() view returns (uint256,uint256,uint256,uint256,uint256,bool,uint256)",
  "function isQualifiedInvestor(address) view returns (bool)",
  "function investorBalance(address) view returns (uint256)",
  "function phase2Active() view returns (bool)",
  "function balanceOf(address) view returns (uint256)"
];

/* ── Automatización KYC por la factory TOKAI ──
   Al aprobar un KYC en el panel, la wallet se registra directamente en el
   contrato (GATCertificate.addQualifiedInvestor / IdentityRegistry) firmando
   con la wallet COMPLIANCE_ROLE del admin via MetaMask. Sin proveedor externo:
   la capa de enforcement es la propia factory de TOKAI. */
async function preGATWhitelistOnChain(addr){
  var cfg = (typeof window !== 'undefined') && window.__PREGAT__;
  if (!window.ethereum || !cfg || !window.__TOKAI_ENABLE_LIVE_MODE__) {
    // Fallback/mock de demo para operabilidad fluida sin MetaMask
    if (cfg && cfg.snapshot) {
      cfg.snapshot.totalInvestors = (cfg.snapshot.totalInvestors || 0) + 1;
      cfg.snapshot.remainingInvestorSlots = Math.max(0, (cfg.snapshot.remainingInvestorSlots || 50) - 1);
    }
    return '0x' + Array.from({length:32}, () => Math.floor(Math.random()*16).toString(16)).join('') + ' (demo)';
  }
  if(!cfg || !window.ethers) throw new Error('Config PRE-GAT o ethers no disponibles');
  var mm = Array.isArray(window.ethereum.providers)
    ? (window.ethereum.providers.find(function(p){ return p.isMetaMask; }) || null)
    : (window.ethereum.isMetaMask ? window.ethereum : null);
  if(!mm) throw new Error('MetaMask no encontrado');
  var currentChain = await mm.request({ method: 'eth_chainId' });
  if (parseInt(currentChain, 16) !== cfg.chainId) {
    try {
      await mm.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x89' }] });
    } catch(swErr) {
      if (swErr.code === 4902) {
        await mm.request({ method: 'wallet_addEthereumChain', params: [{ chainId: '0x89', chainName: 'Polygon PoS', nativeCurrency: { name: 'POL', symbol: 'POL', decimals: 18 }, rpcUrls: [cfg.rpc, cfg.rpcFallback || cfg.rpc], blockExplorerUrls: [cfg.explorer] }] });
      } else throw swErr;
    }
  }
  var provider = new ethers.BrowserProvider(mm);
  var signer = await provider.getSigner();
  var abi = (window.__ABIS__ && window.__ABIS__.GATCertificate) || PREGAT_READ_ABI;
  var contract = new ethers.Contract(cfg.address, abi, signer);
  var tx = await contract.addQualifiedInvestor(addr);
  await tx.wait();
  return tx.hash;
}

/* ── Registro de identidad KYC en el IdentityRegistry de la factory TOKAI ──
   Camino real y único para verificar inversores: TOKAI aprueba en el panel
   ("KYC 100% administrado por TOKAI") y firma con su propia wallet, que tiene
   COMPLIANCE_ROLE en el contrato — no hay proveedor externo. El inversor
   nunca puede llamar esto: IdentityRegistry.sol solo acepta COMPLIANCE_ROLE
   (ver constructor), por eso el intento de auto-registro del inversor se
   quitó de KycGate y esta es la única vía. */
async function identityRegistryRegisterOnChain(wallet, jurisdiction, category){
  var dep = (typeof window !== 'undefined') && window.__DEPLOYMENT__;
  if (!window.ethereum || !dep || !dep.identityRegistry || !window.__TOKAI_ENABLE_LIVE_MODE__) {
    // Fallback demo: sin wallet/deployment real conectado todavía
    return '0x' + Array.from({length:32}, () => Math.floor(Math.random()*16).toString(16)).join('') + ' (demo)';
  }
  if (!window.ethers) throw new Error('ethers no disponible');
  var mm = Array.isArray(window.ethereum.providers)
    ? (window.ethereum.providers.find(function(p){ return p.isMetaMask; }) || null)
    : (window.ethereum.isMetaMask ? window.ethereum : null);
  if (!mm) throw new Error('MetaMask no encontrado');
  var currentChain = await mm.request({ method: 'eth_chainId' });
  if (parseInt(currentChain, 16) !== dep.chainId) {
    throw new Error('Tu wallet está en la red equivocada. Cambiá a ' + (dep.network || dep.chainId) + ' desde el botón de red en la barra superior y reintentá.');
  }
  var provider = new ethers.BrowserProvider(mm);
  var signer = await provider.getSigner();
  var abi = ['function registerIdentity(address investor, uint16 jurisdiction, uint8 category)'];
  var contract = new ethers.Contract(dep.identityRegistry, abi, signer);
  var tx = await contract.registerIdentity(wallet, jurisdiction, category);
  await tx.wait();
  return tx.hash;
}

function usePreGAT(walletAddr) {
  var cfg = (typeof window !== 'undefined') && window.__PREGAT__;
  var [status, setStatus] = useState(null);
  var [loading, setLoading] = useState(false);
  var [error, setError] = useState(null);
  var [investorInfo, setInvestorInfo] = useState(null);

  function normalizeStatus(s) {
    return {
      totalMinted:            Number(s[0]),
      totalRedeemed:          Number(s[1]),
      totalInvestors:         Number(s[2]),
      remainingSupply:        Number(s[3]),
      remainingInvestorSlots: Number(s[4]),
      phase2Active:           s[5],
      capitalRaisedUSD:       Number(s[6]),
    };
  }

  function snapshotStatus() {
    if (!cfg || !cfg.snapshot) return null;
    return Object.assign({
      totalMinted: 0,
      totalRedeemed: 0,
      totalInvestors: 0,
      remainingSupply: 500,
      remainingInvestorSlots: 50,
      phase2Active: false,
      capitalRaisedUSD: 0,
    }, cfg.snapshot);
  }

  async function loadStatus() {
    if (!cfg || !window.ethers || !window.__TOKAI_ENABLE_LIVE_MODE__) {
      var snap = snapshotStatus();
      if (snap) setStatus(snap);
      return;
    }
    setLoading(true);
    setError(null);
    try {
      var provider = new ethers.JsonRpcProvider(cfg.rpc);
      var contract = new ethers.Contract(cfg.address, PREGAT_READ_ABI, provider);
      var s = await contract.instrumentStatus();
      setStatus(normalizeStatus(s));
    } catch(e) {
      // Intentar RPC fallback
      try {
        var p2 = new ethers.JsonRpcProvider(cfg.rpcFallback || cfg.rpc);
        var c2 = new ethers.Contract(cfg.address, PREGAT_READ_ABI, p2);
        var s2 = await c2.instrumentStatus();
        setStatus(normalizeStatus(s2));
      } catch(e2) {
        var snap2 = snapshotStatus();
        if (snap2) {
          setStatus(snap2);
          setError('Mostrando snapshot local; RPC Polygon no disponible');
        } else {
          setError('No se pudo conectar a Polygon PoS mainnet');
        }
      }
    } finally {
      setLoading(false);
    }
  }

  async function loadInvestorInfo(addr) {
    if (!window.ethereum || !cfg || !window.__TOKAI_ENABLE_LIVE_MODE__) {
      // Fallback/mock de demo para operabilidad local fluida sin MetaMask
      const isQualified = true;
      let balance = 0;
      if (addr && typeof addr === 'string' && DEMO_WALLETS[1] && addr.toLowerCase() === DEMO_WALLETS[1].addr.toLowerCase()) {
        balance = 2; // El inversor demo calificado · ARG arranca con 2 certificados
      }
      setInvestorInfo({ isQualified, balance });
      return;
    }
    if (!cfg || !window.ethers || !addr) return;
    try {
      var provider = new ethers.JsonRpcProvider(cfg.rpc);
      var contract = new ethers.Contract(cfg.address, PREGAT_READ_ABI, provider);
      var [isQual, balance] = await Promise.all([
        contract.isQualifiedInvestor(addr),
        contract.investorBalance(addr)
      ]);
      setInvestorInfo({ isQualified: isQual, balance: Number(balance) });
    } catch(e) {
      // Fallback si falla el RPC en caliente
      const isQualified = true;
      let balance = 0;
      if (addr && typeof addr === 'string' && DEMO_WALLETS[1] && addr.toLowerCase() === DEMO_WALLETS[1].addr.toLowerCase()) {
        balance = 2;
      }
      setInvestorInfo({ isQualified, balance });
    }
  }

  /* Cambia la red de MetaMask a Polygon PoS mainnet y devuelve el signer */
  async function getPreGATSigner() {
    if (!window.ethereum || !cfg) throw new Error('MetaMask no disponible');
    var mm = (function(){
      if (Array.isArray(window.ethereum.providers))
        return window.ethereum.providers.find(function(p){ return p.isMetaMask; }) || null;
      return window.ethereum.isMetaMask ? window.ethereum : null;
    })();
    if (!mm) throw new Error('MetaMask no encontrado');
    var currentChain = await mm.request({ method: 'eth_chainId' });
    if (parseInt(currentChain, 16) !== cfg.chainId) {
      try {
        await mm.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x89' }] });
      } catch(swErr) {
        if (swErr.code === 4902) {
          await mm.request({ method: 'wallet_addEthereumChain', params: [{ chainId: '0x89', chainName: 'Polygon PoS', nativeCurrency: { name: 'POL', symbol: 'POL', decimals: 18 }, rpcUrls: [cfg.rpc, cfg.rpcFallback || cfg.rpc], blockExplorerUrls: [cfg.explorer] }] });
        } else throw swErr;
      }
    }
    var provider = new ethers.BrowserProvider(mm);
    return provider.getSigner();
  }

  async function whitelistInvestor(addr) {
    if (!window.ethereum || !cfg || !window.__TOKAI_ENABLE_LIVE_MODE__) {
      if (cfg && cfg.snapshot) {
        cfg.snapshot.totalInvestors = (cfg.snapshot.totalInvestors || 0) + 1;
        cfg.snapshot.remainingInvestorSlots = Math.max(0, (cfg.snapshot.remainingInvestorSlots || 50) - 1);
      }
      return '0x' + Array.from({length:32}, () => Math.floor(Math.random()*16).toString(16)).join('') + ' (demo)';
    }
    var signer = await getPreGATSigner();
    var abi = (window.__ABIS__ && window.__ABIS__.GATCertificate) || PREGAT_READ_ABI;
    var contract = new ethers.Contract(cfg.address, abi, signer);
    var tx = await contract.addQualifiedInvestor(addr);
    await tx.wait();
    return tx.hash;
  }

  async function removeInvestor(addr) {
    if (!window.ethereum || !cfg || !window.__TOKAI_ENABLE_LIVE_MODE__) {
      if (cfg && cfg.snapshot) {
        cfg.snapshot.totalInvestors = Math.max(0, (cfg.snapshot.totalInvestors || 1) - 1);
        cfg.snapshot.remainingInvestorSlots = Math.min(50, (cfg.snapshot.remainingInvestorSlots || 49) + 1);
      }
      return '0x' + Array.from({length:32}, () => Math.floor(Math.random()*16).toString(16)).join('') + ' (demo)';
    }
    var signer = await getPreGATSigner();
    var abi = (window.__ABIS__ && window.__ABIS__.GATCertificate) || PREGAT_READ_ABI;
    var contract = new ethers.Contract(cfg.address, abi, signer);
    var tx = await contract.removeQualifiedInvestor(addr);
    await tx.wait();
    return tx.hash;
  }

  async function mintTo(addr, qty) {
    if (!window.ethereum || !cfg || !window.__TOKAI_ENABLE_LIVE_MODE__) {
      if (cfg && cfg.snapshot) {
        cfg.snapshot.totalMinted = (cfg.snapshot.totalMinted || 0) + qty;
        cfg.snapshot.remainingSupply = Math.max(0, (cfg.snapshot.remainingSupply || 500) - qty);
        cfg.snapshot.capitalRaisedUSD = (cfg.snapshot.capitalRaisedUSD || 0) + qty * 3000;
      }
      return '0x' + Array.from({length:32}, () => Math.floor(Math.random()*16).toString(16)).join('') + ' (demo)';
    }
    var signer = await getPreGATSigner();
    var abi = (window.__ABIS__ && window.__ABIS__.GATCertificate) || PREGAT_READ_ABI;
    var contract = new ethers.Contract(cfg.address, abi, signer);
    var tx = qty > 1 ? await contract.batchMint(addr, qty) : await contract.mint(addr);
    await tx.wait();
    return tx.hash;
  }

  async function togglePhase2(activate) {
    if (!window.ethereum || !cfg || !window.__TOKAI_ENABLE_LIVE_MODE__) {
      if (cfg && cfg.snapshot) {
        cfg.snapshot.phase2Active = activate;
      }
      return '0x' + Array.from({length:32}, () => Math.floor(Math.random()*16).toString(16)).join('') + ' (demo)';
    }
    var signer = await getPreGATSigner();
    var abi = (window.__ABIS__ && window.__ABIS__.GATCertificate) || PREGAT_READ_ABI;
    var contract = new ethers.Contract(cfg.address, abi, signer);
    var tx = activate ? await contract.activatePhase2() : await contract.deactivatePhase2();
    await tx.wait();
    return tx.hash;
  }

  useEffect(function(){ loadStatus(); }, []);
  useEffect(function(){ if (walletAddr) loadInvestorInfo(walletAddr); }, [walletAddr]);

  return { cfg, status, loading, error, investorInfo, loadStatus, loadInvestorInfo, whitelistInvestor, removeInvestor, mintTo, togglePhase2 };
}

/* ── Confirmación de seguridad antes de pasar a modo Real ──
   Reemplaza un simple toggle de un click: a partir de acá las acciones
   (invertir, reclamar renta, OTC, deploy) firman transacciones con fondos y
   gas reales. Requiere confirmación explícita — ver punto 4 de la auditoría
   de flujo (tasks.md #33/agent_sync). */
function RealModeConfirmModal({onCancel,onConfirm}){
  var cancelRef = useRef(null);
  useEffect(function(){
    cancelRef.current && cancelRef.current.focus();
    function onKeyDown(e){ if(e.key === 'Escape') onCancel(); }
    document.addEventListener('keydown', onKeyDown);
    return function(){ document.removeEventListener('keydown', onKeyDown); };
  }, []);
  return h('div',{style:{position:'fixed',inset:0,background:'rgba(0,0,0,.72)',backdropFilter:'blur(10px)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:20}},
    h('div',{role:'alertdialog','aria-modal':'true','aria-labelledby':'real-mode-title','aria-describedby':'real-mode-desc',style:{maxWidth:440,width:'100%',background:'linear-gradient(145deg,rgba(16,20,32,.97),rgba(10,14,24,.99))',border:'1px solid rgba(255,178,62,.25)',boxShadow:'0 0 0 1px rgba(255,255,255,.04),0 32px 80px rgba(0,0,0,.7)',borderRadius:20,padding:28}},
      h('div',{'aria-hidden':'true',style:{fontSize:28,marginBottom:10}},'⚠️'),
      h('div',{id:'real-mode-title',style:{fontWeight:800,fontSize:16,marginBottom:8}},'Vas a pasar a modo On-Chain'),
      h('p',{id:'real-mode-desc',style:{fontSize:13,color:'var(--txt-dim)',lineHeight:1.6,marginBottom:18}},
        'A partir de acá, invertir, reclamar renta, operar en el mercado OTC o desplegar un token va a firmar transacciones con fondos y gas reales en la red conectada. No es una simulación y no siempre es reversible.'),
      h('div',{style:{display:'flex',gap:10,justifyContent:'flex-end'}},
        h('button',{ref:cancelRef,className:'btn btn-ghost',onClick:onCancel},'Cancelar'),
        h('button',{className:'btn btn-primary',style:{background:'#FFB23E',borderColor:'#FFB23E',color:'#0A0A0A'},onClick:onConfirm},'Sí, operar on-chain'))));
}

function App(){
  const [auth,setAuth] = useState(null);
  const [paid,setPaid] = useState(false); // retainer de estructuración pagado
  const [view,setView] = useState('home');
  const ISSUER_ONLY_VIEWS = ['home','wizard','pagos'];
  const [activeProject,setActiveProject] = useState(null);
  const [role,setRole] = useState('issuer');
  const [subView,setSubView] = useState('projects');
  const [walletIdx,setWalletIdx] = useState(1);
  const [sidebarOpen,setSidebarOpen] = useState(false);
  const [liveMode,setLiveMode] = useState(function(){
    if(typeof window === 'undefined' || window.__TOKAI_ENABLE_LIVE_MODE__ === false) return 'demo';
    return localStorage.getItem('tokai_live_mode') || 'demo';
  });

  const [deployment, setDeployment] = useState(function(){
    return (typeof window !== 'undefined') ? window.__DEPLOYMENT__ : null;
  });

  const apiUrl = window.__API_URL__ || '';

  useEffect(function() {
    if (apiUrl) {
      fetch(apiUrl + '/contracts')
        .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function(data) {
          if (data && data.configured && data.deployment) {
            window.__DEPLOYMENT__ = data.deployment;
            setDeployment(data.deployment);
          }
        })
        .catch(function() {});
    }
  }, [apiUrl]);

  const sim = useChain({apiUrl, loggedIn: !!auth});
  // useWeb3/useChainWeb3 vienen de tokai-web3.js (script global, puede no cargar en demo).
  // La selección de implementación no puede resolverse dentro del call de un hook
  // (viola react-hooks/rules-of-hooks) — se elige la referencia de función antes,
  // y el hook se llama siempre sin condicional, preservando el mismo fallback.
  const useWeb3Impl = typeof useWeb3 === 'function' ? useWeb3 : function(){ return { available:false }; };
  const useChainWeb3Impl = typeof useChainWeb3 === 'function' ? useChainWeb3 : function(){ return null; };
  const web3 = useWeb3Impl();
  const live = useChainWeb3Impl(web3.account);
  const liveModeEnabled = (typeof window !== 'undefined') && window.__TOKAI_ENABLE_LIVE_MODE__ !== false;
  const isDemoInvestor = !!(auth && auth.method === 'wallet' && auth.id === '0xDEMO');
  const realRequested = liveModeEnabled && liveMode === 'real' && !isDemoInvestor;
  const isLive = !!(realRequested && web3.account && web3.chainOk && (typeof window!=='undefined') && window.__DEPLOYMENT__ && live);
  const isReal = realRequested;
  const chain = isLive ? live : sim;
  const toast = useToast();

  const wallet = role==='investor' ? DEMO_WALLETS[walletIdx] : DEMO_WALLETS[0];
  const liveWalletAddr = web3.account || (role==='investor' ? wallet.addr : null);
  function setMode(nextMode){
    if(!liveModeEnabled) return;
    setLiveMode(nextMode);
    try{ localStorage.setItem('tokai_live_mode', nextMode); }catch(e){}
  }
  // Seguridad: pasar a "Real" activa transacciones con fondos y gas reales de
  // forma inmediata (invertir, reclamar renta, OTC, deploy). Requiere
  // confirmación explícita en vez de un solo click para evitar operar en real
  // por accidente. Real → Demo no necesita confirmación (siempre es seguro).
  const [showRealConfirm,setShowRealConfirm] = useState(false);
  function requestRealMode(){
    if(!liveModeEnabled) return;
    if(liveMode==='real') return;
    setShowRealConfirm(true);
  }
  function confirmRealMode(){ setShowRealConfirm(false); setMode('real'); }

  function canAccessRole(targetRole){
    if(!auth) return false;
    if(auth.isAdmin || auth.role==='admin' || auth.role==='tokai') return true;
    if(targetRole==='investor') return true;
    /* Un inversor (email o wallet) no accede a la vista de emisor aunque esté aprobado:
       "approved" habilita al emisor, no convierte a un inversor en emisor. */
    if(targetRole==='issuer') return auth.role!=='investor' && !!(auth.approved || auth.role==='issuer');
    if(targetRole==='tokai') return false;
    return false;
  }

  function denyRole(targetRole){
    toast&&toast({type:'err',title:'Acceso denegado',msg:'No tenés permisos para acceder a '+targetRole});
  }

  function activateRole(targetRole){
    if(!canAccessRole(targetRole)){
      denyRole(targetRole);
      return false;
    }
    setRole(targetRole);
    return true;
  }

  function doLogout(){
    localStorage.removeItem('tokai_jwt');
    if(window.__API_URL__){
      fetch(window.__API_URL__ + '/auth/logout', { method: 'POST', credentials: 'include' }).catch(function(){});
    }
    setAuth(null);
    setRole('issuer');
    setView('home');
    setPaid(false);
  }

  /* go() actualiza React state directamente + sincroniza el hash.
     Esto evita dependencia en el evento nativo 'hashchange', que el
     navegador no dispara cuando la URL destino es idéntica a la actual
     (p.ej.: clic en "Administración" cuando el hash ya es #/admin). */
  function go(v, pid, sub) {
    /* 1. Construir el hash destino */
    let path = v;
    if (['admin','tokai'].includes(v)) {
      const resolvedSub = sub != null ? sub : (v === 'admin' ? 'projects' : 'dashboard');
      path += `/${resolvedSub}`;
      if (pid != null) path += `/${pid}`;
    } else {
      if (pid != null) path += `/${pid}`;
      if (sub != null) path += `/${sub}`;
    }

    /* 2. Actualizar React state INMEDIATAMENTE (no esperar evento del DOM) */
    const resolvedSub = ['admin','tokai'].includes(v)
      ? (sub != null ? sub : (v === 'admin' ? 'projects' : 'dashboard'))
      : (sub || null);

    if ((v === 'tokai' && !canAccessRole('tokai')) || (v === 'admin' && !canAccessRole('issuer'))) {
      denyRole(v === 'tokai' ? 'tokai' : 'issuer');
      return;
    }

    setView(v);
    if (resolvedSub !== null) setSubView(resolvedSub);
    if (pid !== null && pid !== undefined) setActiveProject(pid);

    /* 3. Sincronizar la URL (puede no disparar hashchange si es idéntica, pero el state ya está correcto) */
    const targetHash = `/${path}`;
    if (window.location.hash !== targetHash && window.location.hash !== `#${targetHash}`) {
      window.location.hash = targetHash;
    }

    setSidebarOpen(false);
  }
  window.go = go;

  /* Efecto de sincronización al inicio y cuando cambia el rol/auth.
     Permite que un deeplink o la recarga de la página restaure la vista correcta. */
  useEffect(() => {
    const hash = window.location.hash.replace(/^#\/?/, '');
    if (!hash) return; /* go() ya estableció la vista por defecto en el login */
    const parts = hash.split('/');
    const v = parts[0];
    const knownSubs = ['dashboard','psav','kyc','checklist','geofencing','accesos','captable','contracts','infra','instrumentos','thesis-editor','report-gen','emission-engine','projects','pitch','emission','mint','yield'];
    let sub = null;
    let pid = null;
    if (['admin','tokai'].includes(v)) {
      const p1 = parts[1]; const p2 = parts[2];
      if (p1 && knownSubs.includes(p1)) { sub = p1; if (p2) pid = /^\d+$/.test(p2) ? Number(p2) : p2; }
      else if (p1) { pid = /^\d+$/.test(p1) ? Number(p1) : p1; if (p2 && knownSubs.includes(p2)) sub = p2; }
      if (!sub) sub = v === 'admin' ? 'projects' : 'dashboard';
    } else {
      const raw = parts[1];
      pid = raw ? (/^\d+$/.test(raw) ? Number(raw) : raw) : null;
      sub = parts[2] || null;
    }
    if ((v==='tokai' && !canAccessRole('tokai')) || (v==='admin' && !canAccessRole('issuer'))) return;
    /* Vistas que solo existen para el emisor: con otro rol (p. ej. un inversor que entra con el
       hash #/home que dejó otra sesión) no se dibuja nada; se manda a la vista inicial de su rol. */
    if (ISSUER_ONLY_VIEWS.includes(v) && role !== 'issuer') { go(role === 'tokai' ? 'tokai' : 'dash'); return; }
    setView(v);
    if (sub) setSubView(sub);
    if (pid !== null) setActiveProject(pid);
  }, [role, auth, paid]);

  /* ── Restore de sesión desde cookie HttpOnly ── */
  useEffect(()=>{
    if(!window.__API_URL__) return;
    fetch(window.__API_URL__ + '/auth/me', { credentials: 'include' })
    .then(r => r.ok ? r.json() : Promise.reject()).then(data => {
      if(!data.id) return;
      const backendRole = data.role;
      const frontRole = backendRole === 'admin' ? 'tokai' : backendRole;
      const isAdmin = backendRole === 'admin';
      const approved = data.status === 'approved';
      setAuth({ method:'email', id:data.email, label: isAdmin ? 'TOKAI Admin' : data.email.split('@')[0], role:frontRole, isAdmin, approved, needsRoleChoice: !!data.needs_role_choice });
      /* Mismo ruteo que onLogin: un inversor que recarga vuelve a su vista, no a la del emisor */
      if(isAdmin){ setRole('tokai'); setView('tokai'); }
      else if(backendRole === 'investor'){ setRole('investor'); setView('dash'); }
      else if(approved){ setRole('issuer'); setView('home'); setPaid(true); }
      else { setRole('issuer'); setView('home'); setPaid(false); }
    }).catch(()=>{
      localStorage.removeItem('tokai_jwt');
    });
  },[]);

  if(!auth) return h(LoginGate,{onLogin:(a)=>{
    setAuth(a);
    setPaid(false);
    if(a.isAdmin || a.role==='tokai'){
      /* TOKAI admin: acceso total, panel laboratorio directo */
      setRole('tokai'); setView('tokai');
    } else if(a.method === 'wallet' || a.role === 'investor'){
      /* Login con wallet: modo inversor */
      setRole('investor'); setView('dash');
    } else if(a.approved){
      /* Emisor aprobado por TOKAI: entra directo al wizard */
      setRole('issuer'); setView('home'); setPaid(true);
    } else {
      /* Emisor no aprobado: ve el ContactGate */
      setRole('issuer'); setView('home'); setPaid(false);
    }
  }, web3, toast});

  /* ── Guarda de rutas por rol y estado ──
     El emisor no aprobado queda en el ContactGate hasta que TOKAI apruebe su solicitud
     (backend: status='approved' en la sesión; demo: localStorage tokai_approved_emitters).
     Enviar el formulario NO desbloquea el acceso: el gate lo controla TOKAI. */
  /* ADR-027: la cuenta nueva elige UNA vez si viene a tokenizar o a invertir (antes del ContactGate) */
  if(auth.needsRoleChoice && !auth.isAdmin && window.__API_URL__) return h(RoleChoiceGate,{auth, toast, onChosen:(u)=>{
    setAuth(a=>Object.assign({}, a, { role:u.role, approved:u.status==='approved', needsRoleChoice:false }));
    if(u.role==='investor'){ setRole('investor'); setView('dash'); }
  }});
  if(role==='issuer' && !paid && !auth.isAdmin) return h(ContactGate,{auth, toast});



  const nav = {
