  var [adminAddress, setAdminAddress] = useState(infraAdminOf('polygonAmoy'));
  var [deployLogs, setDeployLogs] = useState([]);
  var [addresses, setAddresses] = useState(null);
  var [deployTxHash, setDeployTxHash] = useState(null);
  var [deployBlockNumber, setDeployBlockNumber] = useState(null);
  var [loading, setLoading] = useState(false);
  var [currentInfra, setCurrentInfra] = useState(null);
  var [checking, setChecking] = useState(false);

  function loadActiveInfra() {
    if (!API) return;
    setLoading(true);
    fetch(API + '/contracts/admin/config', { credentials: 'include' })
      .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function(data) {
        if (data && data.configured && data.deployment) {
          setCurrentInfra(data.deployment);
        } else {
          setCurrentInfra(null);
        }
      })
      .catch(function() {
        setCurrentInfra(null);
      })
      .finally(function() {
        setLoading(false);
      });
  }

  useEffect(function() {
    loadActiveInfra();
  }, []);

  function loadDefaults(net) {
    if (net === 'polygonAmoy') {
      setNetwork('polygonAmoy');
      setChainId(80002);
      setUsdcAddress('0x41E94Eb019C0762f9Bfcf9Fb1E58725BfB0e7582');
      setAdminAddress(infraAdminOf('polygonAmoy'));
      toast && toast({ title: 'Defaults cargados', msg: 'Amoy (Testnet) configurado para deploy.' });
    } else if (net === 'polygon') {
      setNetwork('polygon');
      setChainId(137);
      setUsdcAddress('0x3c499c542cEF5E3811e1192ce70d8cC03d5c3359');
      setAdminAddress(infraAdminOf('polygon'));
      toast && toast({ title: 'Defaults cargados', msg: 'Polygon Mainnet configurado para deploy.' + (infraAdminOf('polygon') ? '' : ' Cargá la wallet admin: no hay registro de deploy en mainnet.') });
    }
  }

  async function handleVerify() {
    if (!currentInfra || !currentInfra.tokenFactory || !window.ethers) return;
    setChecking(true);
    try {
      var mm = window.ethereum;
      if (!mm) throw new Error('MetaMask no disponible');
      var provider = new ethers.BrowserProvider(mm);
      var factoryContract = new ethers.Contract(
        currentInfra.tokenFactory,
        ['function usdc() view returns (address)'],
        provider
      );
      var usdcOnChain = await factoryContract.usdc();
      toast && toast({ title: 'Infraestructura Online', msg: 'La fábrica respondió correctamente. USDC asociada: ' + usdcOnChain.slice(0, 10) + '…' });
    } catch (err) {
      console.error(err);
      toast && toast({ type: 'err', title: 'Fallo de verificación', msg: 'No se pudo conectar a la fábrica en la red actual.' });
    } finally {
      setChecking(false);
    }
  }

  async function startDeploy() {
    if (!window.TOKAI_WEB3) {
      toast && toast({ type: 'err', title: 'Capa Web3 faltante', msg: 'window.TOKAI_WEB3 no disponible.' });
      return;
    }
    if (!window.ethereum) {
      toast && toast({ type: 'err', title: 'MetaMask requerido', msg: 'Por favor conecta tu wallet MetaMask.' });
      return;
    }

    setLoading(true);
    setStep(2);
    setDeployLogs([]);

    // Custom logger listener for Web3 deploy console logs
    var originalLog = console.log;
    console.log = function(msg) {
      originalLog.apply(console, arguments);
      if (typeof msg === 'string' && msg.startsWith('[TOKAI_WEB3 deployInfra]')) {
        var logClean = msg.replace('[TOKAI_WEB3 deployInfra] ', '');
        setDeployLogs(function(prev) { return prev.concat([logClean]); });
      }
    };

    try {
      var mm = Array.isArray(window.ethereum.providers)
        ? (window.ethereum.providers.find(function(p){ return p.isMetaMask; }) || window.ethereum)
        : window.ethereum;
      var provider = new ethers.BrowserProvider(mm);
      var signer = await provider.getSigner();

      // Check ChainId match
      var netHex = '0x' + Number(chainId).toString(16);
      var currentChain = await mm.request({ method: 'eth_chainId' });
      if (parseInt(currentChain, 16) !== Number(chainId)) {
        try {
          await mm.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: netHex }] });
        } catch (swErr) {
          if (swErr.code === 4902) {
            var netName = network === 'polygon' ? 'Polygon PoS' : 'Polygon Amoy';
            var rpcs = network === 'polygon' ? ['https://polygon-rpc.com'] : ['https://rpc-amoy.polygon.technology'];
            var explorer = network === 'polygon' ? 'https://polygonscan.com/' : 'https://amoy.polygonscan.com/';
            await mm.request({
              method: 'wallet_addEthereumChain',
              params: [{
                chainId: netHex,
                chainName: netName,
                nativeCurrency: { name: 'POL', symbol: 'POL', decimals: 18 },
                rpcUrls: rpcs,
                blockExplorerUrls: [explorer]
              }]
            });
          } else throw swErr;
        }
        // Re-instantiate provider after network switch
        provider = new ethers.BrowserProvider(mm);
        signer = await provider.getSigner();
      }

      var res = await TOKAI_WEB3.deployInfrastructure({
        usdcAddress: usdcAddress,
        adminAddress: adminAddress,
        network: network,
        chainId: Number(chainId)
      }, signer);

      if (res.ok) {
        setAddresses(res.addresses);
        setDeployTxHash(res.deployTxHash);
        setDeployBlockNumber(res.deployBlockNumber);
        setStep(3);
        toast && toast({ title: 'Deploy Completado', msg: 'Infraestructura desplegada exitosamente.' });
      } else {
        setStep(1);
        toast && toast({ type: 'err', title: 'Fallo en deploy', msg: res.reason || 'Ocurrió un error en MetaMask.' });
      }
    } catch (err) {
      console.error(err);
      setStep(1);
      toast && toast({ type: 'err', title: 'Error', msg: err.message || 'Error durante el deploy.' });
    } finally {
      console.log = originalLog; // Restore original console.log
      setLoading(false);
    }
  }

  async function handleActivate() {
    if (!API || !addresses) return;
    setLoading(true);
    try {
      var body = {
        network: network,
        chainId: Number(chainId),
        tokenFactory: addresses.tokenFactory,
        factories: {
          erc3643: addresses.erc3643,
          erc4626: addresses.erc4626,
          erc7540: addresses.erc7540,
          erc1155: addresses.erc1155,
          erc5192: addresses.erc5192
        },
        usdc: usdcAddress,
        deployTxHash: deployTxHash,
        deployBlockNumber: deployBlockNumber,
        deployedBy: adminAddress
      };

      var res = await fetch(API + '/contracts/admin/config', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      if (!res.ok) {
        var errData = await res.json();
        throw new Error(errData.error || 'Error al persistir infraestructura.');
      }

      toast && toast({ title: 'Infraestructura Activada', msg: 'Fábrica e inyectores actualizados en el sistema.' });
      loadActiveInfra();
      setStep(1);
    } catch (err) {
      console.error(err);
      toast && toast({ type: 'err', title: 'Error', msg: err.message || 'Error de red.' });
    } finally {
      setLoading(false);
    }
  }

  var inp = { width: '100%', padding: '8px 10px', borderRadius: 8, border: '1px solid var(--line-solid)', background: 'var(--black)', color: 'var(--txt)', fontSize: 12, fontFamily: 'var(--mono)' };
  var labelStyle = { display: 'block', fontSize: 11, color: 'var(--txt-dim)', marginBottom: 4, fontWeight: 600 };
  var logStyle = { background: 'var(--black)', padding: '12px', borderRadius: 8, fontSize: 11.5, fontFamily: 'var(--mono)', color: '#10B981', maxHeight: '180px', overflowY: 'auto', border: '1px solid var(--line-solid)' };

  return h('div', { className: 'card' },
    h('div', { className: 'between', style: { marginBottom: 16 } },
      h('div', {},
        h('h3', { style: { fontSize: 15, fontWeight: 700, margin: 0 } }, 'Configuración de Infraestructura TOKAI'),
        h('div', { style: { fontSize: 12, color: 'var(--txt-mute)', marginTop: 3 } }, 'Despliega o vincula el TokenFactory y las fábricas de estándares RWA directamente desde la plataforma.')
      )
    ),

    // Active Infrastructure Card
    currentInfra && step === 1 && h('div', { style: { background: 'rgba(16,185,129,0.03)', border: '1px solid rgba(16,185,129,0.15)', padding: '16px', borderRadius: 10, marginBottom: 20 } },
      h('div', { className: 'between', style: { marginBottom: 12 } },
        h('div', { style: { display: 'flex', alignItems: 'center', gap: 6 } },
          h('span', { style: { width: 8, height: 8, borderRadius: '50%', background: '#10B981' } }),
          h('span', { style: { fontSize: 13, fontWeight: 700, color: 'var(--txt)' } }, 'Activa on-chain en ' + (currentInfra.network === 'polygon' ? 'Polygon Mainnet' : currentInfra.network === 'polygonAmoy' ? 'Polygon Amoy (Testnet)' : 'Hardhat Local'))
        ),
        h('div', { style: { display: 'flex', gap: 6 } },
          h('button', { className: 'btn btn-ghost btn-sm', style: { fontSize: 11 }, onClick: handleVerify, disabled: checking }, checking ? 'Verificando…' : '✓ Verificar On-Chain'),
          h('button', { className: 'btn btn-danger btn-sm', style: { fontSize: 11, background: 'rgba(255,92,92,0.1)', color: '#FF5C5C', border: 'none' }, onClick: function() { setCurrentInfra(null); } }, 'Reconfigurar')
        )
      ),
      h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, fontSize: 12 } },
        h('div', {},
          h('span', { style: { color: 'var(--txt-mute)' } }, 'TokenFactory (Orquestador): '),
          h('code', { style: { color: 'var(--emerald)' } }, currentInfra.tokenFactory)
        ),
        h('div', {},
          h('span', { style: { color: 'var(--txt-mute)' } }, 'USDC Token: '),
          h('code', {}, currentInfra.usdc)
        ),
        h('div', {},
          h('span', { style: { color: 'var(--txt-mute)' } }, 'ERC-3643 Factory: '),
          h('code', {}, (currentInfra.factories && currentInfra.factories.erc3643) || '—')
        ),
        h('div', {},
          h('span', { style: { color: 'var(--txt-mute)' } }, 'ERC-5192 Factory: '),
          h('code', {}, (currentInfra.factories && currentInfra.factories.erc5192) || '—')
        )
      )
    ),

    // Wizard Step 1: Params Form
    !currentInfra && step === 1 && h('div', {},
      h('div', { style: { background: 'rgba(255,178,62,0.04)', border: '1px solid rgba(255,178,62,0.15)', padding: '12px 14px', borderRadius: 8, marginBottom: 16, fontSize: 12.5, color: '#FFB23E', display: 'flex', gap: 8, alignItems: 'center' } },
        h('span', {}, '⚠️ No se detecta infraestructura activa en la plataforma. Configura los parámetros y firma con MetaMask para realizar el deploy.')
      ),
      h('div', { className: 'between', style: { marginBottom: 14 } },
        h('label', { style: { fontSize: 12, fontWeight: 700 } }, 'Preconfigurar Red'),
        h('div', { style: { display: 'flex', gap: 6 } },
          h('button', { className: 'btn btn-ghost btn-sm', onClick: function() { loadDefaults('polygonAmoy'); } }, 'Polygon Amoy (Testnet)'),
          h('button', { className: 'btn btn-ghost btn-sm', onClick: function() { loadDefaults('polygon'); } }, 'Polygon Mainnet (Circle USDC)')
        )
      ),
      h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginBottom: 14 } },
        h('div', {},
          h('label', { style: labelStyle }, 'Identificador de Red'),
          h('select', { style: inp, value: network, onChange: function(e) { setNetwork(e.target.value); setChainId(e.target.value === 'polygon' ? 137 : e.target.value === 'polygonAmoy' ? 80002 : 31337); } },
            h('option', { value: 'polygonAmoy' }, 'Polygon Amoy (Testnet)'),
            h('option', { value: 'polygon' }, 'Polygon Mainnet'),
            h('option', { value: 'hardhat' }, 'Hardhat Local')
          )
        ),
        h('div', {},
          h('label', { style: labelStyle }, 'Chain ID (Número)'),
          h('input', { type: 'number', style: inp, value: chainId, readOnly: true })
        )
      ),
      h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginBottom: 20 } },
        h('div', {},
          h('label', { style: labelStyle }, 'Dirección USDC de la Red'),
          h('input', { style: inp, value: usdcAddress, onChange: function(e) { setUsdcAddress(e.target.value); } })
        ),
        h('div', {},
          h('label', { style: labelStyle }, 'Admin Address (Sujeta a DEFAULT_ADMIN_ROLE)'),
          h('input', { style: inp, value: adminAddress, onChange: function(e) { setAdminAddress(e.target.value); } })
        )
      ),
      h('button', { className: 'btn btn-primary', onClick: startDeploy, disabled: loading }, '🚀 Firmar Deploy con MetaMask')
    ),

    // Wizard Step 2: Deploying
    step === 2 && h('div', {},
      h('h4', { style: { fontSize: 13, fontWeight: 700, marginBottom: 10 } }, 'Firmando transacciones con MetaMask…'),
      h('p', { className: 'muted', style: { fontSize: 12, marginBottom: 14 } }, 'Por favor, confirma cada una de las transacciones en MetaMask. El costo estimado es de ~2-3 POL.'),
      h('div', { style: logStyle },
        deployLogs.length === 0 ? 'Iniciando conexión con MetaMask…' : deployLogs.map(function(lg, i) { return h('div', { key: i, style: { marginBottom: 4 } }, '✓ ' + lg); }),
        loading && h('div', { style: { marginTop: 6, color: '#FFB23E' } }, '● Esperando firma/confirmación en MetaMask…')
      )
    ),

    // Wizard Step 3: Deployment Results
    step === 3 && addresses && h('div', {},
      h('div', { style: { background: 'rgba(16,185,129,0.06)', border: '1px solid #10B981', padding: '12px 14px', borderRadius: 8, marginBottom: 16, fontSize: 12.5, color: 'var(--emerald)', display: 'flex', gap: 8, alignItems: 'center' } },
        h('span', {}, '¡Infraestructura desplegada exitosamente! Guarda y activa la fábrica para habilitar el motor en el sistema.')
      ),
      h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, fontSize: 12, marginBottom: 20 } },
        h('div', {},
          h('span', { style: { color: 'var(--txt-mute)' } }, 'TokenFactory (Orquestador): '),
          h('code', { style: { color: 'var(--emerald)' } }, addresses.tokenFactory)
        ),
        h('div', {},
          h('span', { style: { color: 'var(--txt-mute)' } }, 'ERC-3643 Factory: '),
          h('code', {}, addresses.erc3643)
        ),
        h('div', {},
          h('span', { style: { color: 'var(--txt-mute)' } }, 'ERC-4626 Factory: '),
          h('code', {}, addresses.erc4626)
        ),
        h('div', {},
          h('span', { style: { color: 'var(--txt-mute)' } }, 'ERC-7540 Factory: '),
          h('code', {}, addresses.erc7540)
        ),
        h('div', {},
          h('span', { style: { color: 'var(--txt-mute)' } }, 'ERC-1155 Factory: '),
          h('code', {}, addresses.erc1155)
        ),
        h('div', {},
          h('span', { style: { color: 'var(--txt-mute)' } }, 'ERC-5192 Factory: '),
          h('code', {}, addresses.erc5192)
        )
      ),
      h('div', { style: { display: 'flex', gap: 10 } },
        h('button', { className: 'btn btn-primary', onClick: handleActivate, disabled: loading }, loading ? 'Guardando…' : '✓ Guardar y Activar en Plataforma'),
        h('button', { className: 'btn btn-ghost', onClick: function() { setStep(1); setAddresses(null); } }, 'Volver')
      )
    )
  );
}

/* ════════════════════════════════════════════════════════════════════
   CapTableView — Registro real de tenedores (cap table on-chain)
   Derivado de los eventos indexados del contrato PRE-GAT por el backend.
   ════════════════════════════════════════════════════════════════════ */
function AdminContractsConfig({toast}) {
  var API = window.__API_URL__ || '';
  var [cfg, setCfg] = useState({
    network: 'amoy',
    chainId: 80002,
    usdc: '',
    identityRegistry: '',
    priceOracle: '',
    otcMarket: '',
    tokenFactory: '',
    timelockController: '',
    factories: {
      erc3643: '',
      erc4626: '',
      erc7540: '',
      erc1155: '',
      erc5192: ''
    }
  });
  var [loading, setLoading] = useState(false);
  var [saving, setSaving] = useState(false);

  function load() {
    if (!API) return;
    setLoading(true);
    fetch(API + '/admin/contracts-config', { credentials: 'include' })
      .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
      .then(function(data) {
        if (data && data.config) {
          setCfg(data.config);
        }
      })
      .catch(function() {
        toast && toast({ type: 'warn', title: 'Sin configuración', msg: 'No se encontró configuración previa en la base de datos.' });
      })
      .finally(function(){ setLoading(false); });
  }

  useEffect(function() {
    load();
  }, []);

  function save() {
    if (!API) return;
    if (!cfg.network || !cfg.tokenFactory) {
      toast && toast({ type: 'err', title: 'Error', msg: 'Red y TokenFactory son requeridos.' });
      return;
    }
    setSaving(true);
    fetch(API + '/admin/contracts-config', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cfg)
    })
      .then(function(r){ return r.ok ? r.json() : r.json().catch(function(){ return {}; }).then(function(e){ return Promise.reject(e); }); })
      .then(function() {
        toast && toast({ title: 'Configuración guardada', msg: 'Los contratos inteligentes se actualizaron en la plataforma.' });
      })
      .catch(function(e) {
        var missing = e && e.details && Array.isArray(e.details.missing) ? e.details.missing.map(function(m){ return m.field; }).join(', ') : '';
        toast && toast({ type: 'err', title: e && e.code === 'contracts_without_code' ? 'Contratos inexistentes en esa red' : 'Error al guardar',
          msg: (e && e.error) || 'No se pudo guardar la configuración.' + (missing ? ' Sin código: ' + missing : '') });
      })
      .finally(function(){ setSaving(false); });
  }

  /* Presets desde el REGISTRO REAL de deploy (tokai-contracts/deployments/<red>.json), inyectado por
     build-front.js en window.__TOKAI_DEPLOYMENT_RECORDS__. Sin direcciones hardcodeadas: el preset
     anterior de "Amoy" traía las de un deploy local de Hardhat (sin código en Amoy) y quedó activo
     en producción. El backend además rechaza guardar contratos sin bytecode en la red. */
  function loadDefaults(preset) {
    var RECORD_KEY = { amoy: 'polygonAmoy', mainnet: 'polygon' };
    var CHAIN = { amoy: 80002, mainnet: 137 };
    var records = (typeof window !== 'undefined' && window.__TOKAI_DEPLOYMENT_RECORDS__) || {};
    var rec = records[RECORD_KEY[preset]];
    if (!rec || !rec.tokenFactory) {
      toast && toast({ type: 'warn', title: 'Sin registro de deploy', msg: 'No hay un deploy registrado para ' + preset + ' en tokai-contracts/deployments. Cargá las direcciones a mano o desplegá la infraestructura primero.' });
      return;
    }
    var f = rec.factories || {};
    setCfg({
      network: preset,
      chainId: CHAIN[preset],
      usdc: rec.usdc || '',
      identityRegistry: rec.identityRegistry || '',
      priceOracle: rec.priceOracle || '',
      otcMarket: rec.otcMarket || '',
      tokenFactory: rec.tokenFactory,
      timelockController: rec.timelockController || '',
      factories: {
        erc3643: f.erc3643 || '', erc4626: f.erc4626 || '', erc7540: f.erc7540 || '',
        erc1155: f.erc1155 || '', erc5192: f.erc5192 || ''
      }
    });
    toast && toast({ title: 'Valores cargados', msg: 'Registro de deploy de ' + preset + (rec.deployedAt ? ' (' + String(rec.deployedAt).slice(0, 10) + ')' : '') + '. Guardalos para aplicar: el backend verifica que existan on-chain.' });
  }

  var inp = { width: '100%', padding: '8px 10px', borderRadius: 8, border: '1px solid var(--line-solid)', background: 'var(--black)', color: 'var(--txt)', fontSize: 12, fontFamily: 'var(--mono)' };
  var labelStyle = { display: 'block', fontSize: 11, color: 'var(--txt-dim)', marginBottom: 4, fontWeight: 600 };

  return h('div', { className: 'card' },
    h('div', { className: 'between', style: { marginBottom: 16 } },
      h('div', {},
        h('h3', { style: { fontSize: 15, fontWeight: 700, margin: 0 } }, 'Gestión de Contratos Inteligentes'),
        h('div', { style: { fontSize: 12, color: 'var(--txt-mute)', marginTop: 3 } }, 'Configurá los contratos del protocolo para operar en vivo (Polygon mainnet o testnet) sin tocar el código.')
      ),
      h('div', { style: { display: 'flex', gap: 6 } },
        h('button', { className: 'btn btn-ghost btn-sm', onClick: function(){ loadDefaults('amoy'); } }, 'Cargar Amoy (Testnet)'),
        h('button', { className: 'btn btn-ghost btn-sm', onClick: function(){ loadDefaults('mainnet'); } }, 'Cargar Mainnet Base')
      )
    ),
    h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginBottom: 14 } },
      h('div', {},
        h('label', { style: labelStyle }, 'Nombre de Red'),
        h('input', { style: inp, value: cfg.network, onChange: function(e){ setCfg(Object.assign({}, cfg, { network: e.target.value })); } })),
      h('div', {},
        h('label', { style: labelStyle }, 'Chain ID (Número)'),
        h('input', { type: 'number', style: inp, value: cfg.chainId, onChange: function(e){ setCfg(Object.assign({}, cfg, { chainId: Number(e.target.value) })); } }))
    ),
    h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginBottom: 14 } },
      h('div', {},
        h('label', { style: labelStyle }, 'USDC Token Address'),
        h('input', { style: inp, value: cfg.usdc || '', onChange: function(e){ setCfg(Object.assign({}, cfg, { usdc: e.target.value })); } })),
      h('div', {},
        h('label', { style: labelStyle }, 'IdentityRegistry Address'),
        h('input', { style: inp, value: cfg.identityRegistry || '', onChange: function(e){ setCfg(Object.assign({}, cfg, { identityRegistry: e.target.value })); } }))
    ),
    h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginBottom: 14 } },
      h('div', {},
        h('label', { style: labelStyle }, 'PriceOracle Address'),
        h('input', { style: inp, value: cfg.priceOracle || '', onChange: function(e){ setCfg(Object.assign({}, cfg, { priceOracle: e.target.value })); } })),
      h('div', {},
        h('label', { style: labelStyle }, 'OTCMarket Address'),
        h('input', { style: inp, value: cfg.otcMarket || '', onChange: function(e){ setCfg(Object.assign({}, cfg, { otcMarket: e.target.value })); } }))
    ),
    h('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14, marginBottom: 14 } },
      h('div', {},
        h('label', { style: labelStyle }, 'TokenFactory Address'),
        h('input', { style: inp, value: cfg.tokenFactory || '', onChange: function(e){ setCfg(Object.assign({}, cfg, { tokenFactory: e.target.value })); } })),

/* Guías en PDF (portada y marca TOKAI). El backend filtra por rol: inversor → su guía;
   emisor → emisor + inversor; admin → también la del laboratorio. Fuente: docs/guias/. */
function GuideDownloads(){
  const API = window.__API_URL__ || '';
  const [items,setItems] = useState(API ? null : []);
  const [busy,setBusy] = useState('');
  const [err,setErr] = useState('');
  useEffect(function(){
    if(!API) return;
    fetch(API + '/guides', { credentials:'include' })
      .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function(d){ setItems(d.data || []); })
      .catch(function(){ setItems([]); });
  },[]);
  async function download(g){
    setBusy(g.slug); setErr('');
    try{
      const r = await fetch(API + '/guides/' + encodeURIComponent(g.slug) + '/pdf', { credentials:'include' });
      if(!r.ok) throw new Error(String(r.status));
      const url = URL.createObjectURL(await r.blob());
      const a = document.createElement('a'); a.href = url; a.download = g.file;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    }catch(e){ setErr('No se pudo descargar «'+g.short+'». Revisá tu sesión e intentá de nuevo.'); }
    setBusy('');
  }
  if(items && items.length===0) return null;   // modo demo o sin guías para el rol
  return h('section',{className:'card',style:{marginBottom:22},'aria-label':'Guías en PDF'},
    h('div',{className:'between',style:{gap:12,flexWrap:'wrap',marginBottom:items?12:0}},
      h('div',{},
        h('div',{className:'gate-title',style:{marginBottom:4}},h(Icon,{d:I.doc,style:{width:14,height:14}}),'Guías en PDF'),
        h('div',{className:'muted',style:{fontSize:12.5}},'Paso a paso con capturas de la plataforma, para leer o compartir con tu equipo.'))),
    !items && h('div',{className:'muted',style:{fontSize:12.5},role:'status'},h('span',{className:'spinner',style:{display:'inline-block',verticalAlign:'-2px',marginRight:8}}),'Cargando guías…'),
    items && h('div',{style:{display:'flex',gap:10,flexWrap:'wrap'}},
      items.map(function(g){
        const loading = busy===g.slug;
        return h('button',{key:g.slug,className:'btn btn-ghost btn-sm',disabled:!!busy,'aria-busy':loading,
            onClick:function(){ download(g); },title:'Descargar '+g.file},
          loading ? h('span',{className:'spinner'}) : h(Icon,{d:I.doc,style:{width:13,height:13}}),
          g.short,
          h('span',{className:'mono',style:{fontSize:10,color:'var(--txt-mute)'}},'PDF · '+g.updated));
      })),
    err && h('div',{role:'alert',style:{marginTop:10,fontSize:12.5,color:'var(--red)'}},err));
}

function GuideView({chain, role, go, setRole, canAccess}){
  /* Un inversor no ve los manuales de emisor ni de TOKAI (mismo criterio que las guías PDF, ADR-025) */
  const guideEntries = Object.entries(GUIDES).filter(([k])=>!canAccess || canAccess(k));
  const [guideRole, setGuideRole] = useState(role && GUIDES[role] && (!canAccess || canAccess(role)) ? role : (guideEntries[0] ? guideEntries[0][0] : 'investor'));
  const [step, setStep] = useState(0);
  const g = GUIDES[guideRole];
  const steps = g.steps;
  const s = steps[step];
  const pct = Math.round(((step+1)/steps.length)*100);

  function pick(r){ setGuideRole(r); setStep(0); }
  function tryIt(){
    const v = s.action.view;
    // la vista real puede exigir un rol específico
    if(['invest','portfolio'].includes(v) && setRole) setRole('investor');
    else if(v==='admin' && setRole) setRole('issuer');
    else if(v==='tokai' && setRole) setRole('tokai');
    go(v);
  }

  return h('div',{},
    h('div',{className:'eyebrow'},'Manual interactivo'),
    h('h1',{className:'page'},'Guía de uso de la plataforma'),
    h('p',{className:'page-sub'},'Aprendé a usar TOKAI según tu rol. Elegí abajo y seguí los pasos — desde cada paso podés saltar a la vista real para probarlo.'),
    h(GuideDownloads),

/* ════════════════════════════════════════════════════════════════════
   TOKAI Platform — Modo simple + login dual (views5)
   LoginGate (email o wallet) · HomeEmisor · WizardCrear
   Capa de presentación: reusa toda la lógica validada (useChain, compliance).
   ════════════════════════════════════════════════════════════════════ */

/* ---------- LoginGate: email (Web2) o wallet ---------- */
/* ── Admin role asignado por el backend según JWT (no hardcodeado en frontend) ── */
var TOKAI_ADMIN_EMAILS = [];

/* ── Emails de emisores aprobados (persistidos en localStorage por TOKAI) ── */
function getApprovedEmitters() {
  try {
    var raw = localStorage.getItem('tokai_approved_emitters');
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}
function saveApprovedEmitter(email, data) {
  try {
    var list = getApprovedEmitters();
    var exists = list.find(function(e){ return e.email === email; });
    if (!exists) list.push(Object.assign({ email: email, approvedAt: Date.now() }, data || {}));
    localStorage.setItem('tokai_approved_emitters', JSON.stringify(list));
  } catch(e) {}
}
function removeApprovedEmitter(email) {
  try {
    var list = getApprovedEmitters().filter(function(e){ return e.email !== email; });
    localStorage.setItem('tokai_approved_emitters', JSON.stringify(list));
  } catch(e) {}
}

/* ── Sesión y wallet (ADR-026) ────────────────────────────────────────────────
   Una persona = una cuenta (email). El rol sale SIEMPRE de la cuenta en el backend; el método de
   ingreso (email o wallet vinculada) no cambia el rol. Estos helpers los comparten el login y la
   card «Wallet de acceso» de «Mi cartera». */
function tokaiAuthFromAccount(user, method){
  const isAdmin = user.role === 'admin';
  return {
    method, id: user.email,
    label: isAdmin ? 'TOKAI Admin' : user.email.split('@')[0],
    role: isAdmin ? 'tokai' : user.role,
    isAdmin,
    approved: user.status === 'approved',
    /* ADR-027: cuenta nueva que todavía no eligió si viene a tokenizar o a invertir */
    needsRoleChoice: !!user.needs_role_choice,
  };
}

function tokaiWalletErrMsg(e){
  const code = e && (e.code || (e.info && e.info.error && e.info.error.code));
  if (code === 4001 || code === 'ACTION_REJECTED') return 'Cancelaste la firma en tu wallet. No se hizo ningún cambio.';
  if (e && e.message === 'no_wallet') return 'No detectamos una wallet en este navegador (MetaMask u otra compatible).';
  return 'La wallet no pudo completar la firma. Intentá de nuevo.';
}

/* Pide la cuenta activa de la wallet del navegador. */
async function tokaiWalletAccount(){
  if (!window.ethereum) throw new Error('no_wallet');
  const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
  if (!accs || !accs[0]) throw new Error('no_wallet');
  return accs[0];
}

/* Firma (personal_sign / EIP-191) un desafío del backend con la wallet indicada. */
async function tokaiWalletSign(address, message){
  const provider = new window.ethers.BrowserProvider(window.ethereum);
  const signer = await provider.getSigner(address);
  return signer.signMessage(message);
}

/* Desafío → firma → POST. Devuelve {ok, status, data}. Lo usan el login y la vinculación. */
async function tokaiWalletSignedPost(address, challengePath, submitPath, extraHeaders){
  const API = window.__API_URL__;
  const ch = await fetch(API + challengePath, {
    method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ address }),
  });
  const chData = await ch.json().catch(() => ({}));
  if (!ch.ok) return { ok: false, status: ch.status, data: chData };
  const signature = await tokaiWalletSign(address, chData.message);
  const res = await fetch(API + submitPath, {
    method: 'POST', credentials: 'include',
    headers: Object.assign({ 'Content-Type': 'application/json' }, extraHeaders || {}),
    body: JSON.stringify({ address, nonce: chData.nonce, signature }),
  });
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}

function LoginGate({onLogin, web3, toast}){
  const [email,setEmail]     = useState('');
  const [tab,setTab]         = useState('email');
  const [phase,setPhase]     = useState('input');   // input | otp | signing
  const [otp,setOtp]         = useState('');
  const [generatedOtp,setGeneratedOtp] = useState('');
  const [sending,setSending] = useState(false);
  const [error,setError]     = useState('');
  const [unlinkedWallet,setUnlinkedWallet] = useState(''); // wallet firmada pero sin cuenta vinculada
  const [walletChoices,setWalletChoices] = useState(null); // varias cuentas compartidas: elegir con cuál firmar

  /* ── Generar OTP de 6 dígitos y "enviarlo" ──────────────────────
     En producción: POST /api/auth/send-otp → backend envía email real.
     En demo: el código aparece en pantalla (tooltip dorado) para testing.
     La lógica es idéntica — solo cambia si el código se muestra o se envía.   */
  async function sendOtp() {
    const v = email.trim().toLowerCase();
    if(!/^[^@]+@[^@]+\.[^@]+$/.test(v)){
      setError('Ingresá un email válido.'); return;
    }
    setError('');
    setSending(true);

    if(window.__API_URL__) {
      try {
        const res = await fetch(window.__API_URL__ + '/auth/otp/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: v }),
        });
        if(res.status === 429) {
          const errData = await res.json().catch(()=>({}));
          const msg = errData.error || 'Demasiados intentos.';
          setError(msg + ' Hacé clic en "Enviar código" de nuevo cuando estés listo.');
          setSending(false); return;
        }
        if(!res.ok) { setError('Error al enviar. Intentá de nuevo.'); setSending(false); return; }
        setSending(false);
        setPhase('otp');
        toast&&toast({ title: 'Código enviado', msg: 'Revisá tu bandeja de ' + v + '.' });
      } catch(e) {
        setError('No se pudo conectar con el servidor.'); setSending(false);
      }
      return;
    }

    /* Modo demo: mostrar código en pantalla */
    await new Promise(r=>setTimeout(r,900));
    const code = String(Math.floor(100000 + Math.random() * 900000));
    setGeneratedOtp(code);
    setSending(false);
    setPhase('otp');
    toast&&toast({
      title: 'Código enviado',
      msg: 'Demo: el código aparece en pantalla.',
    });
  }

  /* ── Verificar OTP ─────────────────────────────────────────────── */
  async function verifyOtp() {
    const v = email.trim().toLowerCase();

    if(window.__API_URL__) {
      setSending(true);
      try {
        const res = await fetch(window.__API_URL__ + '/auth/otp/verify', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'X-Auth-Fallback': 'true'
          },
          body: JSON.stringify({ email: v, code: otp.trim() }),
        });
        const data = await res.json();
        if(!res.ok) { setError(data.message || 'Código incorrecto.'); setSending(false); return; }
        if (data.token) {
          localStorage.setItem('tokai_jwt', data.token);
        }
        setSending(false);
        setError('');
        onLogin(tokaiAuthFromAccount(data.user, 'email'));
      } catch(e) {
        setError('Error de conexión. Intentá de nuevo.'); setSending(false);
      }
      return;
    }

    /* Modo demo */
    if(otp.trim() !== generatedOtp){
      setError('Código incorrecto. Revisá el email o solicitá uno nuevo.'); return;
    }
    setError('');
    if(TOKAI_ADMIN_EMAILS.indexOf(v) !== -1 || v.includes('tokai') || v.startsWith('admin@')){
      onLogin({method:'email', id:v, label:'TOKAI Admin', role:'tokai', isAdmin:true});
      return;
    }
    const approved = getApprovedEmitters().find(function(e){ return e.email===v; });
    if(approved){
      onLogin({method:'email', id:v, label:v.split('@')[0], role:'issuer', approved:true, approvalData:approved});
      return;
    }
    onLogin({method:'email', id:v, label:v.split('@')[0], role:'issuer', approved:false});
  }

  function resetToInput() { setPhase('input'); setOtp(''); setGeneratedOtp(''); setError(''); }

  /* ── Login con wallet: pide firma del desafío ─────────────────── */
  async function loginWallet(){
    if(web3&&web3.available){
      setPhase('signing');
      setError('');
      const result = await Promise.race([
        web3.connect(),
        new Promise(resolve=>setTimeout(()=>resolve('__TOKAI_WALLET_TIMEOUT__'),15000))
      ]);
      if(result==='__TOKAI_WALLET_TIMEOUT__'){
        setPhase('input');
        toast&&toast({type:'warn',title:'MetaMask no respondió',msg:'Hacé clic en el ícono de MetaMask en la barra del navegador y aprobá la conexión, luego intentá de nuevo.'});
        return;
      }
      if(result && typeof result==='string'){
        /* Con backend: firmar el desafío abre la sesión de la cuenta vinculada (rol de la cuenta). */
        if(window.__API_URL__){
          /* MetaMask no siempre pone primera la cuenta activa: con varias, se elige antes de firmar. */
          let accs = [];
          try { accs = await window.ethereum.request({ method: 'eth_accounts' }); } catch(e) { accs = []; }
          if(accs && accs.length > 1){ setWalletChoices(accs); setPhase('pick'); return; }
          await walletSignIn(result);
          return;
        }
        /* Modo demo (sin backend): ingreso local como inversor. */
        setPhase('input');
        onLogin({method:'wallet', id:result, label:short(result), role:'investor', approved:true});
        return;
      }
      setPhase('input');
      const errMsg0 = (result && result.error) ? result.error : 'MetaMask rechazó o no completó la conexión.';
      setError(errMsg0);
      toast&&toast({type:'err',title:'No se pudo conectar',msg:errMsg0});
    } else {
      setError('MetaMask no está disponible o no se detectó en tu navegador. Si ya lo instalaste, desbloquealo, asegurate de permitir el acceso a este sitio y recargá la página. También podés descargarlo desde metamask.io.');
    }
  }

  /* Firma el desafío de login con la wallet elegida y abre la sesión de su cuenta. */
  async function walletSignIn(result){
    setPhase('signing'); setError(''); setWalletChoices(null);
    try {
      const r = await tokaiWalletSignedPost(result, '/auth/wallet/challenge', '/auth/wallet/login', { 'X-Auth-Fallback': 'true' });
      setPhase('input');
      if(r.ok){
        if(r.data.token) localStorage.setItem('tokai_jwt', r.data.token);
        onLogin(tokaiAuthFromAccount(r.data.user, 'wallet-session'));
        return;
      }
      if(r.data.code === 'wallet_not_linked'){ setUnlinkedWallet(result); return; }
      setError(r.data.error || 'No se pudo iniciar sesión con la wallet.');
    } catch(e) {
      setPhase('input');
      setError(tokaiWalletErrMsg(e));
    }
  }

/* ---------- StructuringHandshakeTimeline: Handshake 5 Pasos (TOKAI ↔ Emisor) ---------- */
function StructuringHandshakeTimeline({ project, go }) {
  if (!project) return null;
  var thesisState = project.thesis ? project.thesis.estado : (project.thesis_status || 'borrador');
  var isTokaiEnabled = project.project_enabled_by_tokai === true;
  var isEmissionEnabled = project.emission_enabled === true || project.emissionStatus === 'enabled';
  var isDeployed = project.token_deployed === true || (project.token && project.token !== '—' && !project.token.startsWith('0x0000000000000000000000000000000000000000'));

  var steps = [
    { num: 1, title: '1. Recepción', sub: 'Carga por Emisor', done: true, cur: false, statusText: 'Proyecto registrado y recibido por TOKAI', color: 'var(--emerald)' },
    { num: 2, title: '2. Estructuración', sub: 'Análisis de valor & tesis', done: thesisState === 'enviada' || thesisState === 'confirmada' || isTokaiEnabled, cur: thesisState === 'borrador' && !isTokaiEnabled, statusText: (thesisState === 'enviada' || thesisState === 'confirmada') ? 'Estructuración completada' : 'Laboratorio TOKAI analizando el activo', color: '#FFB23E' },
    { num: 3, title: '3. Conformidad', sub: 'Aceptación de Tesis', done: thesisState === 'confirmada', cur: thesisState === 'enviada', statusText: thesisState === 'confirmada' ? 'Conformidad otorgada por el Emisor' : 'Tesis lista para tu revisión', action: thesisState === 'enviada' ? { label: 'Revisar Tesis →', view: 'thesis-client' } : null, color: '#A78BFA' },
    { num: 4, title: '4. Gobernanza', sub: 'Habilitación TOKAI', done: isTokaiEnabled, cur: thesisState === 'confirmada' && !isTokaiEnabled, statusText: isTokaiEnabled ? 'Proyecto habilitado por TOKAI' : 'En revisión por el Comité de Gobernanza', color: '#4DA8FF' },
    { num: 5, title: '5. Emisión', sub: 'Despliegue On-Chain', done: isEmissionEnabled || isDeployed, cur: isTokaiEnabled && !isEmissionEnabled, statusText: (isEmissionEnabled || isDeployed) ? 'Token desplegado / circulante' : 'Esperando apertura de ronda', action: (isTokaiEnabled && !isEmissionEnabled) ? { label: 'Ir a Emisión →', view: 'admin' } : null, color: 'var(--emerald)' }
  ];

  return h('div', { className: 'card', style: { marginBottom: 16, border: '1px solid rgba(0,214,126,.25)' } },
    h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 } },
      h('div', {},
        h('div', { style: { fontWeight: 800, fontSize: 14, color: 'var(--txt)' } },
          '🔄 Canal de Handshake y Estructuración (TOKAI ↔ ' + (project.name || 'Emisor') + ')'
        ),
        h('div', { style: { fontSize: 11.5, color: 'var(--txt-dim)', marginTop: 2 } },
          'Seguimiento transparente del proceso de valor agregado, aprobación de tesis y habilitación de emisión.'
        )
      ),
      h('span', { className: 'badge ' + (isTokaiEnabled ? 'green' : 'amber'), style: { fontSize: 10, fontWeight: 700 } },
        isTokaiEnabled ? '🛡️ HABILITADO POR TOKAI' : '🔬 EN ESTRUCTURACIÓN POR TOKAI'
      )
    ),

    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 8, marginBottom: 12 } },
      steps.map(function(st, idx) {
        var isDone = st.done;
        var isCur = st.cur;
        var borderCol = isDone ? 'var(--emerald)' : isCur ? st.color : 'var(--line-solid)';
        var bgCol = isDone ? 'rgba(0,214,126,.08)' : isCur ? st.color + '15' : 'var(--black)';
        return h('div', { key: idx, style: { padding: '10px 8px', borderRadius: 9, border: '1.5px solid ' + borderCol, background: bgCol, display: 'flex', flexDirection: 'column', gap: 4 } },
          h('div', { style: { display: 'flex', alignItems: 'center', gap: 6 } },
            h('span', { style: { width: 18, height: 18, borderRadius: '50%', fontSize: 10, fontWeight: 800, display: 'flex', alignItems: 'center', justifyContent: 'center', background: isDone ? 'var(--emerald)' : isCur ? st.color : 'rgba(255,255,255,.1)', color: isDone ? '#000' : '#fff' } }, isDone ? '✓' : st.num),
            h('span', { style: { fontSize: 11, fontWeight: 700, color: isDone ? 'var(--emerald)' : isCur ? st.color : 'var(--txt-mute)' } }, st.title.split('. ')[1])
          ),
          h('div', { style: { fontSize: 9.5, color: 'var(--txt-mute)', lineHeight: 1.3 } }, st.sub),
          st.action && h('button', { className: 'btn btn-primary btn-sm', style: { fontSize: 9.5, padding: '3px 6px', marginTop: 4, background: st.color, borderColor: st.color }, onClick: function(){ if (go) go(st.action.view); } }, st.action.label)
        );
      })
    ),
    h('div', { style: { padding: '8px 12px', borderRadius: 8, background: 'rgba(255,255,255,.03)', fontSize: 12, color: 'var(--txt-dim)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' } },
      h('span', {}, 'Estado actual: ', h('strong', { style: { color: 'var(--txt)' } }, (steps.find(function(s){ return s.cur; }) || {}).statusText || (isTokaiEnabled ? 'Proyecto habilitado por TOKAI' : 'En revisión por Laboratorio TOKAI'))),
      h('span', { style: { fontFamily: 'var(--mono)', fontSize: 11, color: 'var(--emerald)' } }, 'Ronda ' + (project.ronda || 1) + ' / 6')
    )
  );
}

/* ---------- HomeEmisor: "¿Qué querés hacer?" ---------- */
function HomeEmisor({chain, auth, go, wallet, connectWallet}){
  const mine = getIssuerProjects(chain.projects||[], auth, wallet);
  const mainProject = mine[0]||null;

  /* Próxima acción según etapa */
  function nextAction(p) {
    if(!p) return {label:'Crear tu primer proyecto', view:'wizard', color:'var(--emerald)', urgent:true};
    const s = getProjectStage(p);
    if(s===1) return {label:'TOKAI está analizando tu proyecto', view:null, color:'#FFB23E', urgent:false};
    if(s===2) return {label:'Revisá la tesis de valor que TOKAI te envió', view:'thesis-client', color:'#FFB23E', urgent:true};
    if(s===3) return {label:'Revisá el reporte del modelo de negocio', view:'thesis-client', color:'#FFB23E', urgent:!!p.reportSentToClient};
    if(s===4) return {label:'TOKAI está configurando el contrato', view:null, color:'#9AA0A6', urgent:false};
    if(s===5) {
      if(!wallet||!wallet.addr) return {label:'Conectá tu wallet MetaMask para recibir la habilitación', view:null, color:'#FFB23E', urgent:true, walletNeeded:true};
      return {label:'TOKAI va a habilitar tu emisión pronto', view:null, color:'#9AA0A6', urgent:false};
    }
    if(s===6) return {label:'¡Podés emitir tokens! Andá a Emisión', view:'admin', color:'var(--emerald)', urgent:true};
    if(s===7) return {label:'Tu proyecto está activo y distribuyendo', view:'admin', color:'var(--emerald)', urgent:false};
    return {label:'Crear tu primer proyecto', view:'wizard', color:'var(--emerald)', urgent:true};
  }

  const next = nextAction(mainProject);

  return h('div',{},
    h('div',{className:'eyebrow'},'Hola'+(auth&&auth.label?', '+auth.label:'')),
    h('h1',{className:'page'},'Mi panel de emisor'),

    /* Wallet status */
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',
      padding:'10px 14px',borderRadius:10,marginBottom:16,
      background:wallet&&wallet.addr?'rgba(0,214,126,.06)':'rgba(255,178,62,.06)',
      border:'1px solid '+(wallet&&wallet.addr?'rgba(0,214,126,.2)':'rgba(255,178,62,.2)')}},
      h('div',{style:{display:'flex',alignItems:'center',gap:8}},
        h('div',{style:{width:8,height:8,borderRadius:'50%',background:wallet&&wallet.addr?'var(--emerald)':'#FFB23E'}}),
        wallet&&wallet.addr
          ? h('span',{style:{fontSize:12,color:'var(--txt-dim)'}},'Wallet conectada: ',h('span',{style:{fontFamily:'var(--mono)',fontSize:11,color:'var(--emerald)'}},'0x…'+wallet.addr.slice(-6)))
          : h('span',{style:{fontSize:12,color:'#FFB23E'}},'Wallet no conectada')),
      !wallet||!wallet.addr
        ? h('button',{className:'btn btn-ghost btn-sm',style:{borderColor:'rgba(255,178,62,.4)',color:'#FFB23E'},
            onClick:()=>{if(connectWallet)connectWallet();else toast&&toast({title:'Conectar',msg:'Usá el botón de wallet en el menú superior.'});}},
            '🦊 Conectar MetaMask')
        : mainProject && !mainProject.issuerWallet && h('button',{className:'btn btn-ghost btn-sm',
            onClick:async ()=>{if(chain.updateProject){const res = await chain.updateProject(mainProject.id,{issuerWallet:wallet.addr}); if(res&&res.ok===false) toast&&toast({type:'err',title:'Error',msg:res.reason}); else toast&&toast({title:'Wallet vinculada',msg:'Wallet asociada al proyecto.'});}},
            style:{fontSize:11}},'Vincular wallet al proyecto')),

    /* Structuring & Handshake Timeline */
    mainProject && h(StructuringHandshakeTimeline, { project: mainProject, go: go }),

    /* Progress bar del proyecto principal */
    mainProject && h('div',{className:'card',style:{marginBottom:14}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}},
        h('div',{},
          h('div',{style:{fontWeight:700,fontSize:14}},mainProject.name),
          h('div',{style:{fontSize:11,color:'var(--txt-mute)',marginTop:2}},mainProject.vertical+' · '+mainProject.symbol)),
        h('div',{style:{fontSize:11,fontWeight:700,padding:'3px 10px',borderRadius:20,
          background:next.urgent?'rgba(0,214,126,.12)':'rgba(255,255,255,.05)',
          color:next.urgent?'var(--emerald)':'var(--txt-mute)',
          border:'1px solid '+(next.urgent?'rgba(0,214,126,.25)':'rgba(255,255,255,.06)')}},
          'Etapa '+getProjectStage(mainProject)+'/7')),
      h(FlowProgress,{project:mainProject}),

      /* Próxima acción */
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',
        padding:'11px 13px',borderRadius:9,marginTop:10,
        background:next.urgent?'rgba(0,214,126,.06)':'rgba(255,255,255,.03)',
        border:'1px solid '+(next.urgent?'rgba(0,214,126,.2)':'rgba(255,255,255,.06)')}},
        h('div',{style:{fontSize:13,color:next.urgent?'var(--txt)':'var(--txt-dim)'}},
          next.urgent?'👉 ':' ',next.label),
        next.view && h('button',{className:'btn btn-primary btn-sm',onClick:()=>go(next.view)},'Ir →'))),

    /* Acciones rápidas */
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:mine.length>1?16:0}},
      [
        {k:'admin', label:'Mis proyectos', desc:'Emisión, yield, identidades', icon:'M3 7h18M3 12h18M3 17h18', color:'#4DA8FF'},
        {k:'admin', sub:'pitch', label:'Pitch y Documentos', desc:'Cargar flyer, PDF, fotos y video', icon:'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5', color:'#10B981'},
        {k:'thesis-client', label:'Tesis de valor', desc:'Revisar y confirmar', icon:'M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5', color:'#A78BFA'},
        mine.length===0 && {k:'wizard', label:'Crear proyecto', desc:'Tokenizá tu activo', icon:'M12 5v14M5 12h14', color:'var(--emerald)'},
        {k:'guide', label:'Cómo funciona', desc:'Guía del proceso', icon:'M12 17v.01M12 13a2 2 0 10-2-2', color:'#9AA0A6'},
      ].filter(Boolean).map(a=>h('button',{key:a.k+(a.sub||''),onClick:()=>a.sub?go(a.k,null,a.sub):go(a.k),
        style:{textAlign:'left',padding:'14px 16px',borderRadius:12,cursor:'pointer',
          border:'1px solid var(--line-solid)',background:'var(--panel)',
          display:'flex',gap:12,alignItems:'center',transition:'all .15s'},
        onMouseEnter:e=>{e.currentTarget.style.borderColor=a.color;e.currentTarget.style.background='rgba(255,255,255,.04)';},
        onMouseLeave:e=>{e.currentTarget.style.borderColor='var(--line-solid)';e.currentTarget.style.background='var(--panel)';}},
        h('div',{style:{width:36,height:36,borderRadius:9,background:a.color+'18',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},
          h('svg',{viewBox:'0 0 24 24',fill:'none',stroke:a.color,strokeWidth:2,style:{width:18,height:18}},h('path',{d:a.icon,strokeLinecap:'round',strokeLinejoin:'round'}))),
        h('div',{},
          h('div',{style:{fontSize:13,fontWeight:700,marginBottom:2}},a.label),
          h('div',{style:{fontSize:11,color:'var(--txt-mute)'}},a.desc))))),

    /* Proyectos adicionales */
    mine.length>1 && h('div',{},
      h('div',{style:{fontSize:11,color:'var(--txt-mute)',marginBottom:8,textTransform:'uppercase',letterSpacing:'.07em'}},'Tus proyectos ('+mine.length+')'),
      h('div',{style:{display:'flex',flexDirection:'column',gap:6}},
        mine.map((p,i)=>h('button',{key:p.id,onClick:()=>go('asset',p.id),
          style:{textAlign:'left',padding:'10px 13px',borderRadius:9,cursor:'pointer',
            border:'1px solid var(--line-solid)',background:'var(--panel)',
            display:'flex',justifyContent:'space-between',alignItems:'center'}},
          h('div',{},
            h('div',{style:{fontWeight:600,fontSize:12.5}},p.name),
            h('div',{style:{fontSize:10,color:'var(--txt-mute)',marginTop:1}},'Etapa '+getProjectStage(p)+'/7 · '+p.symbol)),
          h(FlowProgress,{project:p,compact:true})))))
  );
}

/* Etiquetas de régimen basadas en research regulatorio real (WebSearch/WebFetch sobre
   fuentes primarias u oficiales de cada regulador, 2026-09-21) — ver REGIME_COMPLIANCE_RULES

   Igual que REGIME_COMPLIANCE_RULES: esta copia es el FALLBACK offline/demo — la fuente
   única vive en tokai-backend/src/data/regulatoryCatalog.js (ver ADR en
   .context/architecture_log.md) e hydrateRegulatoryCatalog() la pisa en el boot si hay
   backend disponible. */

/* RG 1159/2026 + RG 1150/2026 (Argentina): Fideicomiso Financiero con Autorización
   Automática de Mediano Impacto Ampliado — sin revisión previa de CNV, abierto a
   inversores no calificados, tope de monto UVA 100.000.000 colocado en 12 meses.
   El wizard no calcula el tope automáticamente (valuationUsd es el valor del activo
   subyacente, no el monto de colocación de valores negociables, y no hay una fuente de
   UVA en vivo integrada) — el emisor autodeclara que está dentro del tope y TOKAI lo
   valida en la auditoría, igual que el resto de los checks regulatorios del wizard. */
const RG1159_TOPE_UVA = 100000000;
// RG 1145/2026 (BO 11/06/2026) crea el mismo tope de Mediano Impacto Ampliado que usa
// RG 1159 para Fideicomisos Financieros, pero para instrumentos emitidos directamente
// (sin fideicomiso, ej. Obligaciones Negociables) — ver docs/regulatorio/regulatorio_arg.md.
const RG1145_TOPE_UVA = RG1159_TOPE_UVA;

/* ── Hidratación del catálogo regulatorio desde el backend (fuente única, ver ADR en
   .context/architecture_log.md y tarea #47 en .context/tasks.md) ──────────────────────
   ISSUER_JURISDICTIONS y REGIME_COMPLIANCE_RULES de arriba quedan como fallback
   offline/demo. Si hay backend disponible (window.__API_URL__), se pisan con el
   catálogo real de tokai-backend/src/data/regulatoryCatalog.js — el mismo que ai.js usa
   para su prosa regulatoria — vía GET /api/v1/regulatory-catalog. Si no hay backend
   (demo/file:// local) o el fetch falla, sigue con el fallback de arriba: nunca bloquea
   el render ni el wizard.

   Nota de alcance conocida: como ambos catálogos son objetos top-level (`const`/
   `window.X`) leídos en cada render (no están en React state/context), la hidratación
   es una mutación in-place — cualquier componente montado ANTES de que el fetch
   resuelva sigue viendo el fallback hasta su próximo render (disparado por cualquier
   interacción normal del usuario). Dado que el catálogo real llega en general en
   milisegundos y el wizard/checklist se usan varios pasos después del boot, el impacto
   práctico es nulo — pero si algún día hace falta reactividad estricta, hay que migrar
   estos catálogos a un React Context, no seguir mutando el objeto global. */
(function hydrateRegulatoryCatalog(){
  if (!window.__API_URL__) return; // modo demo/offline — usar el fallback hardcodeado de arriba
  fetch(window.__API_URL__ + '/regulatory-catalog')
    .then(function(r){ return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
    .then(function(data){
      if (data && data.issuerJurisdictions) {
        Object.keys(ISSUER_JURISDICTIONS).forEach(function(k){ delete ISSUER_JURISDICTIONS[k]; });
        Object.assign(ISSUER_JURISDICTIONS, data.issuerJurisdictions);
      }
      if (data && data.regimeComplianceRules) {
        var hydrated = {};
        Object.keys(data.regimeComplianceRules).forEach(function(key){
          var rule = data.regimeComplianceRules[key];
          var items = (rule.items || []).map(function(it){
            if (it.label && typeof it.label === 'object' && typeof it.label.template === 'string') {
              var tmpl = it.label.template;
              return Object.assign({}, it, {
                label: function(ctx){
                  return tmpl.replace(/\{(\w+)\}/g, function(_, varName){
                    var v = ctx && ctx[varName];
                    return varName === 'topeUva' ? Number(v || 100000000).toLocaleString('es-AR') : (v != null ? v : '');
                  });
                },
              });
            }
            return it;
          });
          hydrated[key] = Object.assign({}, rule, { items: items });
        });
        window.REGIME_COMPLIANCE_RULES = hydrated;
      }
    })
    .catch(function(err){
      console.warn('[regulatory-catalog] no se pudo hidratar desde el backend, se mantiene el catálogo local:', err.message);
    });
})();

/* ---------- WizardCrear: alta de proyecto en lenguaje llano ---------- */

function WizardCrear({chain, toast, go}){
  const [step,setStep] = useState(0);
  const [adv,setAdv] = useState(false);
  const [sealing, setSealing] = useState(false);
  const [sealingFile, setSealingFile] = useState('');
  const [f,setF] = useState({
    name:'', kind:'inmueble', valuationUsd:'', tokens:'',
    coverImage:null, gallery:[],
    photoSeals: [], // hashes BFA de las fotos (SHA-256)
    audience:'calificados', // simple default → RG 1088
    // v3.3.0 — multi-standard
    tokenStandard: 'ERC-3643',
    adminAddress: '', operatorAddress: '', complianceAddress: '',
    // v3.4.0 — emisor multijurisdiccional (LATAM, EE.UU., MENA, Europa, Asia)
    issuerRegion: 'LATAM',
    issuerJurisdiction: 'AR',
    allowedInvestorIsos: [32],
    customLockupDays: '',
    customMaxHolders: '',
    kycProvider: 'sumsub',
    compositeEmission: false,
    // v3.11.0 — AR + oferta pública: elegir vía RG 1159 (Autorización Automática) o RG 1069 (Sandbox clásico)
    arRoute: null, arRouteAckTope: false, arRouteAckListado: false,
  });
  const set=(k,v)=>setF(s=>({...s,[k]:v}));
  // Régimen aplicable: en AR + público general hay dos vías posibles (RG 1159 automática
  // o RG 1069 clásica) que el emisor debe elegir explícitamente; el resto de jurisdicciones
  // y audiencias derivan directo del catálogo.
  function regimeFor(jurKey, audience, arRoute){
    const jur = ISSUER_JURISDICTIONS[jurKey]||ISSUER_JURISDICTIONS['AR'];
    if(jurKey==='AR' && audience==='todos'){
      if(arRoute==='rg1159') return jur.regimes.automatica_fideicomiso;
      if(arRoute==='rg1145') return jur.regimes.automatica_directa;
      if(arRoute==='rg1069') return jur.regimes.todos;
      return 'CNV · Elegí una vía de oferta pública (RG 1159, RG 1145 o RG 1069)';
    }
    return jur.regimes[audience]||jur.regimes['calificados'];
  }
  function readFile(file,cb){ const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(file); }

  useEffect(function(){
    if (f.issuerJurisdiction === 'AR' && f.audience === 'todos') {
      set('compositeEmission', true);
    } else {
      setF(function(s) {
        if (s.compositeEmission === undefined) {
          return Object.assign({}, s, { compositeEmission: false });
        }
        return s;
      });
    }
  }, [f.issuerJurisdiction, f.audience]);

  // Sellado BFA: calcula SHA-256 del ArrayBuffer de la imagen → hex → sello demo con delay dramático de carga
  async function sealPhoto(file, dataCb){
    setSealing(true);
    setSealingFile(file.name);
    
    const ab = await file.arrayBuffer();
    const hashBuf = await crypto.subtle.digest('SHA-256', ab);
    const hashHex = Array.from(new Uint8Array(hashBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    const seal = { name:file.name, hash:hashHex, ts:Date.now(), bfaTx:'0x'+hashHex.slice(0,16)+'…' };
    
    // Feedback visual del hashing on-chain
    await new Promise(r => setTimeout(r, 1600));
    
    const reader = new FileReader();
    reader.onload = ()=>{
      dataCb(reader.result, seal);
      setSealing(false);
      setSealingFile('');
    };
    reader.readAsDataURL(file);
  }

  const KINDS=[
    {k:'inmueble', label:'Un inmueble', sub:'Departamentos, local, mall, desarrollo', vertical:'inmobiliario', mech:'A'},
    {k:'credito', label:'Un pool de crédito', sub:'Préstamos, leasing, financiación', vertical:'rodados', mech:'B'},
    {k:'club', label:'Mi club / comunidad', sub:'Fan tokens, beneficios cerrados', vertical:'utility', mech:'C'},
  ];
  const kind = KINDS.find(x=>x.k===f.kind)||KINDS[0];
  const price = (f.valuationUsd&&f.tokens) ? (Number(f.valuationUsd)/Number(f.tokens)) : 0;

  const steps = [
    {t:'¿Quiénes pueden invertir?', valid:()=>{
      if(f.issuerJurisdiction==='AR' && f.audience==='todos'){
        if(!f.arRoute) return false;
        if((f.arRoute==='rg1159'||f.arRoute==='rg1145') && !(f.arRouteAckTope && f.arRouteAckListado)) return false;
      }
      return true;
    }},
    {t:'¿Qué querés tokenizar?', valid:()=>f.name.trim().length>2},
    {t:'¿Cuánto vale y en cuántas partes?', valid:()=>f.kind==='club'||(Number(f.valuationUsd)>0&&Number(f.tokens)>0)},
    {t:'Fotos del activo', valid:()=>true},
    {t:'Revisar y crear', valid:()=>true},
  ];
  const s = steps[step];
  const pct = Math.round(((step+1)/steps.length)*100);

  function crear(){
    const symbol = (f.name.replace(/[^A-Za-z]/g,'').slice(0,4).toUpperCase()||'TOK');
    const strategy = (window.TOKEN_STRATEGIES||{})[f.tokenStandard] || (window.TOKEN_STRATEGIES||{})['ERC-3643'] || {};
    const soulbound = f.kind==='club' || !!strategy.soulbound;
    const jurCfg = (ISSUER_JURISDICTIONS[f.issuerJurisdiction]||ISSUER_JURISDICTIONS['AR']);
    const regDerived = regimeFor(f.issuerJurisdiction, f.audience, f.arRoute) || strategy.regime || 'Regimen regulado';
    // isComposite = cualquier jurisdiccion en oferta publica con flag compositeEmission
    // isRg1069/isRg1159 = especificos de Argentina + publico general (solo afecta naming,
    // architecture key y trazabilidad — la eleccion de via la hace el emisor en el paso 4)
    const isRg1069 = f.issuerJurisdiction === 'AR' && f.audience === 'todos' && f.arRoute === 'rg1069';
    const isRg1159 = f.issuerJurisdiction === 'AR' && f.audience === 'todos' && f.arRoute === 'rg1159';
    const isRg1145 = f.issuerJurisdiction === 'AR' && f.audience === 'todos' && f.arRoute === 'rg1145';
    const isComposite = !!f.compositeEmission;
    // ADR-022 — key estructurada de régimen del emisor, persistida en projects.issuer_regime_key
    // (antes se perdía: issuerJurisdiction/issuerRegimeKey nunca llegaban al backend).
    const issuerRegimeKeyDerived = (f.issuerJurisdiction === 'AR' && f.audience === 'todos')
      ? (isRg1159 ? 'automatica_fideicomiso' : isRg1145 ? 'automatica_directa' : isRg1069 ? 'todos' : null)
      : (f.audience === 'todos' ? 'todos' : 'calificados');
    const emissionStack = isComposite ? [
      { stage: 1, key: isRg1069 ? 'pregat' : 'soulbound',
        symbol: 'PRE-' + symbol,
        standard: 'ERC-721',
        role: 'certificado_soulbound',
        label: isRg1069 ? 'Certificado soulbound de preventa' : 'Certificado soulbound · Etapa 1',
        status: 'operable', jurisdiction: f.issuerJurisdiction, regime: regDerived },
      { stage: 2, key: isRg1069 ? 'gat' : 'token',
        symbol: symbol,
        standard: 'ERC-3643',
        role: 'token_definitivo',
        label: isRg1069 ? 'Token definitivo regulado' : 'Token regulado · Etapa 2 (' + jurCfg.label + ')',
        status: 'pendiente_factory', jurisdiction: f.issuerJurisdiction, regime: regDerived }
    ] : [
      { stage: 1, key: 'primary', symbol: symbol, standard: f.tokenStandard || 'ERC-3643', role: 'emision_primaria', label: strategy.label || 'Instrumento primario', status: 'operable', jurisdiction: f.issuerJurisdiction, regime: regDerived }
    ];
    const cfg = {
      name:f.name.trim(), symbol, vertical:kind.vertical, assetType:kind.label,
      yieldMechanism:kind.mech,
      valuationUsd: Number(f.valuationUsd)||0,
      supplyMax: f.kind==='club'? 500 : (Number(f.tokens)||0),
      priceUsd: f.kind==='club'? 0 : Math.round(price),
      coverImage:f.coverImage, gallery:f.gallery, photoSeals:f.photoSeals||[],
      regime: regDerived,
      regimeLabel: regDerived,
      issuerJurisdiction: f.issuerJurisdiction,
      issuerRegimeKey: issuerRegimeKeyDerived,
      kycProvider: f.kycProvider || 'sumsub',
      jurisdictions: (Array.isArray(f.allowedInvestorIsos) && f.allowedInvestorIsos.length > 0) ? f.allowedInvestorIsos : [jurCfg.iso],
      lockupDays: f.customLockupDays !== '' ? Number(f.customLockupDays) : (f.audience==='todos'?0:(f.issuerJurisdiction==='US'?365:180)),
      soulbound,
      maxHolders: f.customMaxHolders !== '' ? Number(f.customMaxHolders) : (f.audience==='todos'?0:(f.issuerJurisdiction==='US'?2000:50)),
      status:'En estructuración', ronda:1, rondaLabel:'Ronda 1 · Clasificación',
      yieldAnnualPct: kind.mech==='C'?0:8, plusvaliaPct: kind.mech==='A'?15:0, payoutFreq:'trimestral',
      termMonths:48, yieldSource: kind.mech==='A'?'Renta del inmueble':kind.mech==='B'?'Cuotas del pool de crédito':'Sin flujo financiero (cerrado)',
      tranches:[], docs:[], tokenProfiles:[], proforma:{},
      // v3.3.0 — multi-standard
      tokenStandard: f.tokenStandard || 'ERC-3643',
      adminAddress:      f.adminAddress      || null,
      operatorAddress:   f.operatorAddress   || null,
      complianceAddress: f.complianceAddress || null,
      // v3.4.0 — JSONB universales (ADR-007)
      walletRoles: {
        admin:      f.adminAddress      || '',
        operator:   f.operatorAddress   || '',
        compliance: f.complianceAddress || '',
      },
      complianceRules: strategy.complianceRules || {},
      meta: {
        emissionStack: emissionStack,
        emissionArchitecture: isRg1069 ? 'composite_1069_pregat_to_gat' : isComposite ? 'composite_local_soulbound_to_token' : 'single_instrument',
        arRoute: (f.issuerJurisdiction === 'AR' && f.audience === 'todos') ? f.arRoute : null,
        arRoute1159Ack: isRg1159 ? { topeUva: RG1159_TOPE_UVA, ackTope: !!f.arRouteAckTope, ackListado: !!f.arRouteAckListado } : null,
        arRoute1145Ack: isRg1145 ? { topeUva: RG1145_TOPE_UVA, ackTope: !!f.arRouteAckTope, ackListado: !!f.arRouteAckListado } : null,
      },
      phaseState: { phase: 1, phase2_active: false, emission_stack: emissionStack },
    };
    if(chain.createProject){ chain.createProject(cfg); toast&&toast({title:'¡Proyecto creado!',msg:f.name+' quedó listo para configurar y emitir.'}); go('admin'); }
    else { toast&&toast({type:'err',title:'No disponible',msg:'createProject no está disponible en este modo.'}); }
  }

  return h('div',{style:{maxWidth:640}},
    h('style', {}, `
      @keyframes scanLine {
        0% { transform: translateY(-5px); opacity: 0.4; }
        50% { transform: translateY(85px); opacity: 1; }
        100% { transform: translateY(-5px); opacity: 0.4; }
      }
    `),
    h('button',{className:'btn btn-ghost btn-sm',style:{marginBottom:14},onClick:()=>step===0?go('home'):setStep(step-1)},'← '+(step===0?'Volver al inicio':'Atrás')),
    
    /* Stepper por Nodos con transiciones */
    h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '8px', marginBottom: '24px' } },
      steps.map((st, idx) => {
        const isDone = idx < step;

        return h('div', { key: idx, style: { display: 'flex', alignItems: 'center', gap: '8px', flex: idx < steps.length - 1 ? 1 : 'none' } },
          h('div', {
            style: {
              width: 24, height: 24, borderRadius: '50%',
              background: isDone ? 'var(--emerald)' : isCur ? 'rgba(0,214,126,.15)' : 'rgba(255,255,255,.05)',
              color: isDone ? 'var(--black)' : isCur ? 'var(--emerald)' : 'var(--txt-mute)',
              border: '1.5px solid ' + (isDone ? 'var(--emerald)' : isCur ? 'var(--emerald)' : 'var(--line-solid)'),
              display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 700,
              boxShadow: isCur ? '0 0 10px rgba(0,214,126,.3)' : 'none',

      h('div',{style:{display:'flex',flexDirection:'column',gap:10}},

            h('div',{style:{fontSize:11.5,color:isSel?'var(--txt-dim)':'var(--txt-mute)'}},K.sub)

/* ─── Llamada al proxy de IA (backend protegido) ─── */
async function callTokaiAgent(userMsg, projectContext){
  const context = `PROYECTO: ${projectContext.name||''} | Vertical: ${projectContext.vertical||''} | Régimen: ${projectContext.regime||''} | Mecanismo: ${projectContext.yieldMechanism||''} | Valuación: USD ${(projectContext.valuationUsd||0).toLocaleString()} | Desc: ${(projectContext.desc||'').slice(0,200)}`;
  // Key estructurada de REGIME_COMPLIANCE_RULES (fuente única regulatoria) — le da a la
  // IA el checklist de compliance real del régimen del proyecto, en vez de depender solo
  // del string libre `regime` de arriba. Ver resolveRegimeComplianceKey().
  const regimeComplianceKey = resolveRegimeComplianceKey(projectContext);
  const res = await fetch((window.__API_URL__||'')+'/ai/chat',{
    method:'POST',
    credentials:'include',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({mode:'tokai', messages:[{role:'user',content:userMsg}], context, ...(regimeComplianceKey?{regimeComplianceKey}:{})})
  });
  if(!res.ok) return 'Error al conectar con el agente.';
  const data = await res.json();
  return data.text || 'Sin respuesta.';
}

/* ─── Helpers de importación / exportación de Tesis de Valor ─── */
function downloadFile(filename, text, mimeType) {
  try {
    const blob = new Blob([text], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(e) {}
}

function parseJsonToBlocks(jsonText) {
  try {
    const data = JSON.parse(jsonText);
    if (Array.isArray(data)) return data;
    if (data.blocks && Array.isArray(data.blocks)) return data.blocks;
    if (data.thesis && Array.isArray(data.thesis.blocks)) return data.thesis.blocks;
  } catch(e) {}
  return null;
}

function parseMarkdownToBlocks(mdText) {
  if (!mdText || typeof mdText !== 'string') return null;
  const lines = mdText.split('\n');
  const blocks = [];
  let currentBlock = null;

  for (let line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;

    if (trimmed.startsWith('# ') || trimmed.startsWith('## ') || trimmed.startsWith('### ')) {
      if (currentBlock) blocks.push(currentBlock);
      const title = trimmed.replace(/^#+\s*/, '');
      currentBlock = {
        id: 'b' + Date.now() + Math.random().toString(36).slice(2, 6),
        tipo: 'texto',
        titulo: title,
        contenido: '',
        aiAssisted: false
      };
    } else if (currentBlock) {
      if (trimmed.startsWith('✓ ') || trimmed.startsWith('- [x]') || trimmed.startsWith('* [x]')) {
        if (currentBlock.tipo !== 'lista_si') {
          currentBlock.tipo = 'lista_si';
          currentBlock.items = [];
        }
        currentBlock.items.push(trimmed.replace(/^✓\s*|^-\s*\[x\]\s*|^\*\s*\[x\]\s*/i, ''));
      } else if (trimmed.startsWith('✗ ') || trimmed.startsWith('- [ ]') || trimmed.startsWith('* [ ]')) {
        if (currentBlock.tipo !== 'lista_no') {
          currentBlock.tipo = 'lista_no';
          currentBlock.items = [];
        }
        currentBlock.items.push(trimmed.replace(/^✗\s*|^-\s*\[ \]\s*|^\*\s*\[ \]\s*/i, ''));
      } else if (trimmed.includes(':') && (trimmed.startsWith('**') || trimmed.startsWith('- **') || !trimmed.includes(' '))) {
        if (currentBlock.tipo !== 'kv') {
          currentBlock.tipo = 'kv';
          currentBlock.pairs = [];
        }
        const clean = trimmed.replace(/^-\s*/, '');
        const parts = clean.split(':');
        const k = parts[0].replace(/\*\*/g, '').trim();
        const v = parts.slice(1).join(':').replace(/\*\*/g, '').trim();
        currentBlock.pairs.push([k, v]);
      } else if (trimmed.startsWith('- ') || trimmed.startsWith('* ')) {
        if (currentBlock.tipo !== 'lista_si' && currentBlock.tipo !== 'lista_no') {
          currentBlock.tipo = 'lista_si';
          currentBlock.items = [];
        }
        currentBlock.items.push(trimmed.replace(/^[-*]\s*/, ''));
      } else {
        if (currentBlock.tipo === 'texto' || currentBlock.tipo === 'alerta') {
          currentBlock.contenido = currentBlock.contenido ? currentBlock.contenido + '\n' + trimmed : trimmed;
        } else {
          currentBlock.contenido = (currentBlock.contenido || '') + '\n' + trimmed;
        }
      }
    } else {
      currentBlock = {
        id: 'b' + Date.now() + Math.random().toString(36).slice(2, 6),
        tipo: 'texto',
        titulo: 'Introducción',
        contenido: trimmed,
        aiAssisted: false
      };
    }
  }
  if (currentBlock) blocks.push(currentBlock);
  return blocks.length > 0 ? blocks : null;
}

/* ═══════════════════════════════════════════════════════════════════
