function ThesisFlexEditor({chain, toast, go, initialPid}){
  const projects = chain.projects||[];
  let defaultIdx = 0;
  if (initialPid != null) {
    const foundIdx = projects.findIndex(x => String(x.id) === String(initialPid));
    if (foundIdx !== -1) defaultIdx = foundIdx;
  }
  const [pid,setPid] = useState(defaultIdx);
  const p = projects[pid]||projects[0]||{};

  /* estado de los bloques */
  const initBlocks = ()=> p.thesis?.blocks || buildDefaultBlocks(p);
  const [blocks,setBlocks] = useState(initBlocks);
  const [thesisState,setThesisState] = useState(p.thesis?.estado||'borrador');

  /* Gate de gobernanza */
  const emEnabled = p.emissionEnabled?.[0] === true;
  const emPaused  = p.emissionPaused === true;
  const [pauseReason,setPauseReason] = useState('');
  const [showPause,setShowPause] = useState(false);

  /* IA */
  const [aiLoading,setAiLoading] = useState(null); // blockId o 'chat' o 'auto'
  const [aiSuggestion,setAiSuggestion] = useState(null); // {blockId, text}
  const [chatOpen,setChatOpen] = useState(false);
  const [chatHistory,setChatHistory] = useState([]);
  const [chatInput,setChatInput] = useState('');
  const [showAddBlock,setShowAddBlock] = useState(false);
  const [showExport,setShowExport] = useState(false);
  const [showImport,setShowImport] = useState(false);
  const [importMode,setImportMode] = useState('file'); // 'file' | 'project' | 'paste'
  const [importProjectIdx,setImportProjectIdx] = useState(0);
  const [importAction,setImportAction] = useState('replace'); // 'replace' | 'append'
  const [importPasteText,setImportPasteText] = useState('');

  /* sincronizar proyecto cuando cambia initialPid o al seleccionar */
  function syncProject(targetPid){
    const pr = projects[targetPid]||{};
    setBlocks(pr.thesis?.blocks||buildDefaultBlocks(pr));
    setThesisState(pr.thesis?.estado||'borrador');
    setChatHistory([]);
    setAiSuggestion(null);
  }

  useEffect(function(){
    if (initialPid != null) {
      const foundIdx = projects.findIndex(x => String(x.id) === String(initialPid));
      if (foundIdx !== -1 && foundIdx !== pid) {
        setPid(foundIdx);
        syncProject(foundIdx);
      }
    }
  }, [initialPid]);

  function save(newBlocks, newState){
    const b = newBlocks||blocks;
    const s = newState||thesisState;
    const thesisData = {blocks:b,estado:s,confirmedAt:null,confirmHash:null,revisionComment:''};
    if(chain.updateProject) chain.updateProject(pid, {thesis:thesisData});
    // Persistir tesis en backend
    const p2 = chain.projects&&chain.projects[pid];
    if(p2 && p2.id && typeof p2.id === 'string' && p2.id.length === 36){
      const apiUrl = window.__API_URL__ || '';
      if(apiUrl){
        const backendStatus = s === 'enviada' ? 'sent' : s === 'confirmada' ? 'confirmed' : 'draft';
        fetch(apiUrl + '/projects/' + p2.id + '/thesis', {
          method: 'PUT',
          credentials: 'include',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({thesis: thesisData, status: backendStatus})
        }).catch(function(){});
      }
    }
  }

  /* ─── operaciones de bloque ─── */
  function updBlock(id,patch){ setBlocks(bs=>bs.map(b=>b.id===id?{...b,...patch}:b)); }
  function addItem(id,field){ updBlock(id,{[field]:[...(blocks.find(b=>b.id===id)?.[field]||[]),'']}); }
  function updItem(id,field,i,v){ const b=blocks.find(x=>x.id===id); if(!b)return; const arr=[...(b[field]||[])]; arr[i]=v; updBlock(id,{[field]:arr}); }
  function delItem(id,field,i){ const b=blocks.find(x=>x.id===id); if(!b)return; updBlock(id,{[field]:(b[field]||[]).filter((_,j)=>j!==i)}); }
  function moveBlock(id,dir){ setBlocks(bs=>{ const i=bs.findIndex(b=>b.id===id); if(i<0)return bs; const ni=i+dir; if(ni<0||ni>=bs.length)return bs; const nb=[...bs]; [nb[i],nb[ni]]=[nb[ni],nb[i]]; return nb; }); }
  function delBlock(id){ setBlocks(bs=>bs.filter(b=>b.id!==id)); }
  function addBlock(tipo){ const id='b'+Date.now(); const nb={id,tipo,titulo:'Bloque nuevo',aiAssisted:false}; if(tipo==='texto')nb.contenido=''; else if(tipo==='lista_si'||tipo==='lista_no')nb.items=['']; else if(tipo==='kv')nb.pairs=[['','']]; else if(tipo==='mecanismo'){nb.mecanismo='A';nb.descripcion='';} else if(tipo==='alerta')nb.contenido=''; setBlocks(bs=>[...bs,nb]); setShowAddBlock(false); }
  function addKvRow(id){ const b=blocks.find(x=>x.id===id); updBlock(id,{pairs:[...(b?.pairs||[]),['','']]}); }
  function updKv(id,i,col,v){ const b=blocks.find(x=>x.id===id); const p=[...(b?.pairs||[])]; p[i]=[col===0?v:p[i][0],col===1?v:p[i][1]]; updBlock(id,{pairs:p}); }

  /* ─── IA: pre-completado automático ─── */
  async function autoComplete(){
    setAiLoading('auto');
    try{
      const prompt = `Generá un borrador completo de la Tesis de Valor para este proyecto de tokenización. Para cada bloque, devolvé un JSON con este formato exacto:
{"finalidad":"...","otorga":["...","..."],"noOtorga":["...","..."],"modelo":"...","flujo":"...","vehiculo":"...","fiduciario":"...","psav":"..."}
Solo el JSON, sin texto adicional.`;
      const res = await callTokaiAgent(prompt, p);
      try{
        const data = JSON.parse(res.replace(/```json|```/g,'').trim());
        setBlocks(bs=>bs.map(b=>{
          if(b.id==='b1') return {...b,contenido:data.finalidad||b.contenido,aiAssisted:true};
          if(b.id==='b2') return {...b,items:data.otorga||b.items,aiAssisted:true};
          if(b.id==='b3') return {...b,items:data.noOtorga||b.items,aiAssisted:true};
          if(b.id==='b4') return {...b,contenido:data.modelo||b.contenido,aiAssisted:true};
          if(b.id==='b6') return {...b,contenido:data.flujo||b.contenido,aiAssisted:true};
          if(b.id==='b7') return {...b,pairs:[['Vehículo emisor',data.vehiculo||''],['Fiduciario',data.fiduciario||''],['PSAV',data.psav||''],['Régimen',p.regime||'RG 1088']],aiAssisted:true};
          return b;
        }));
        toast&&toast({title:'IA pre-completó la tesis',msg:'Revisá cada campo y editá lo que necesites.'});
      } catch(e){
        toast&&toast({type:'err',title:'Error al parsear respuesta IA',msg:'La IA respondió en formato inesperado. Usá el chat para ayuda.'});
      }
    } finally { setAiLoading(null); }
  }

  /* ─── IA: sugerencia por campo ─── */
  async function suggestField(block){
    setAiLoading(block.id);
    try{
      const tipo = block.tipo;
      let prompt = `Para el bloque "${block.titulo}" de la tesis de valor de ${p.name}, `;
      if(tipo==='texto'||tipo==='alerta') prompt+=`redactá un texto institucional conciso (máximo 80 palabras) que complete este campo. Solo el texto, sin encabezado.`;
      else if(tipo==='lista_si') prompt+=`generá una lista de 3 a 5 derechos concretos que otorga el token. Devolvé solo los items separados por |`;
      else if(tipo==='lista_no') prompt+=`generá una lista de 3 a 5 exclusiones explícitas. Devolvé solo los items separados por |`;
      else if(tipo==='kv') prompt+=`completá los valores de: Vehículo emisor, Fiduciario, PSAV, Régimen. Devolvé como vehículo|fiduciario|PSAV|régimen`;
      const res = await callTokaiAgent(prompt, p);
      setAiSuggestion({blockId:block.id, text:res.trim(), tipo});
    } finally { setAiLoading(null); }
  }

  function acceptSuggestion(){
    if(!aiSuggestion) return;
    const {blockId,text,tipo} = aiSuggestion;
    if(tipo==='texto'||tipo==='alerta') updBlock(blockId,{contenido:text,aiAssisted:true});
    else if(tipo==='lista_si'||tipo==='lista_no') updBlock(blockId,{items:text.split('|').map(s=>s.trim()).filter(Boolean),aiAssisted:true});
    else if(tipo==='kv'){ const parts=text.split('|'); updBlock(blockId,{pairs:[['Vehículo emisor',parts[0]||''],['Fiduciario',parts[1]||''],['PSAV',parts[2]||''],['Régimen',parts[3]||'']],aiAssisted:true}); }
    setAiSuggestion(null);
    toast&&toast({title:'Sugerencia aplicada',msg:'Podés editarla directamente en el campo.'});
  }

  /* ─── IA: chat lateral ─── */
  async function sendChat(){
    if(!chatInput.trim())return;
    const msg = chatInput.trim();
    setChatInput('');
    const newHistory = [...chatHistory,{role:'user',content:msg}];
    setChatHistory(newHistory);
    setAiLoading('chat');
    try{
      const tesisSummary = blocks.map(b=>`${b.titulo}: ${b.contenido||b.items?.join(', ')||b.pairs?.map(([k,v])=>k+': '+v).join(', ')||''}`).join('\n');
      const prompt = `Estado actual de la tesis:\n${tesisSummary}\n\nPregunta de TOKAI: ${msg}`;
      const res = await callTokaiAgent(prompt, p);
      setChatHistory(h=>[...h,{role:'assistant',content:res}]);
    } finally { setAiLoading(null); }
  }

  function insertChatResponse(text){ addBlock('texto'); const id='b'+Date.now(); setTimeout(()=>updBlock(blocks[blocks.length-1]?.id||id,{contenido:text,titulo:'Desde agente TOKAI',aiAssisted:true}),50); setChatOpen(false); }

  /* ─── Exportar como Markdown ─── */
  function toMarkdown(){
    const lines=['# Tesis de Valor — '+p.name,''];
    blocks.forEach(b=>{
      lines.push('## '+b.titulo);
      if(b.tipo==='texto'||b.tipo==='alerta') lines.push(b.contenido||'');
      else if(b.tipo==='lista_si') (b.items||[]).forEach(i=>lines.push('✓ '+i));
      else if(b.tipo==='lista_no') (b.items||[]).forEach(i=>lines.push('✗ '+i));
      else if(b.tipo==='kv') (b.pairs||[]).forEach(([k,v])=>lines.push('**'+k+':** '+v));
      else if(b.tipo==='mecanismo') lines.push('Mecanismo '+b.mecanismo+': '+b.descripcion);
      lines.push('');
    });
    return lines.join('\n');
  }

  const isLocked = thesisState==='confirmada';
  const canSend = thesisState==='borrador' && blocks.some(b=>b.contenido||b.items?.length||b.pairs?.length);
  const fs = {width:'100%',padding:'8px 11px',borderRadius:8,border:'1px solid var(--line-solid)',background:'var(--black)',color:'var(--txt)',fontSize:12.5,boxSizing:'border-box',resize:'vertical',fontFamily:'inherit'};

        style:{padding:'7px 13px',borderRadius:9,cursor:'pointer',fontSize:12,fontWeight:600,border:'1.5px solid '+(pid===i?'var(--emerald)':'var(--line-solid)'),background:pid===i?'rgba(0,214,126,.08)':'var(--panel)',color:pid===i?'var(--emerald)':'var(--txt)'}},pr.name))),

    /* barra de acciones globales */
    h('div',{className:'card',style:{marginBottom:14,display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}},

      h(ThesisBadge,{estado:thesisState}),
      !isLocked && h('button',{className:'btn btn-ghost btn-sm',disabled:aiLoading==='auto',

        aiLoading==='auto'?'Generando…':'✦ Pre-completar con IA'),

        'Enviar al cliente →'),
      thesisState==='enviada' && h('span',{style:{fontSize:11,color:'#FFB23E',fontWeight:600}},'⏳ Esperando confirmación'),
      thesisState==='confirmada' && h('div',{style:{marginTop:4,padding:'14px 16px',borderRadius:12,background:'var(--black)',border:'1px solid var(--line-solid)'}},
        h('div',{style:{fontWeight:700,fontSize:13,marginBottom:10,color:'var(--txt)'}},'Gate de gobernanza · Llave 2'),
        h('div',{style:{display:'flex',gap:8,marginBottom:12}},
          h('div',{style:{display:'flex',alignItems:'center',gap:6,padding:'4px 10px',borderRadius:20,fontSize:11,fontWeight:700,
            background:emPaused?'rgba(255,92,92,.15)':emEnabled?'rgba(0,214,126,.15)':'rgba(154,160,166,.12)',
            color:emPaused?'#FF5C5C':emEnabled?'var(--emerald)':'#9AA0A6',border:'1px solid '+(emPaused?'rgba(255,92,92,.3)':emEnabled?'rgba(0,214,126,.3)':'rgba(154,160,166,.2)')}},
            h('span',{style:{width:7,height:7,borderRadius:'50%',background:'currentColor',display:'inline-block'}}),

            onClick:async()=>{const r=chain.enableEmission?await chain.enableEmission(pid,0):{ok:false};if(r&&r.ok)toast&&toast({title:'✅ Emisión habilitada',msg:'Serie 0 activa. El cliente puede mintear.'});else toast&&toast({type:'err',title:'Error',msg:(r&&r.reason)||'No se pudo habilitar'});}},'⚡ Habilitar serie 0'),

            reader.readAsText(file);
          }})

      importMode==='project' && h('div',{},
        h('div',{className:'field',style:{marginBottom:12}},
          h('label',{},'Seleccionar proyecto de origen'),

            projects.map((proj,i)=>h('option',{key:i,value:i,disabled:i===pid},proj.name+(i===pid?' (actual)':' ('+(proj.thesis?.blocks?.length||0)+' bloques)')))

      ),

      importMode==='paste' && h('div',{},
        h('textarea',{rows:6,value:importPasteText,onChange:e=>setImportPasteText(e.target.value),

        h('button',{className:'btn btn-primary btn-sm',onClick:()=>{

          } else {
            toast&&toast({type:'err',title:'Formato no válido',msg:'No se pudieron extraer bloques del texto pegado.'});
          }

      )
    ),

      h('textarea',{readOnly:true,rows:8,value:toMarkdown(),style:{...fs,fontFamily:'var(--mono)',fontSize:11,color:'var(--txt-dim)'}}),
      h('div',{style:{display:'flex',gap:8,marginTop:8,flexWrap:'wrap'}},
        h('button',{className:'btn btn-ghost btn-sm',onClick:()=>{navigator.clipboard&&navigator.clipboard.writeText(toMarkdown());toast&&toast({title:'Copiado',msg:'Tesis copiada como Markdown'});}},

        h('button',{className:'btn btn-ghost btn-sm',onClick:()=>downloadFile('tesis-'+(p.name||'proyecto').toLowerCase().replace(/\s+/g,'-')+'.md', toMarkdown(), 'text/markdown')},

        h('button',{className:'btn btn-ghost btn-sm',onClick:()=>downloadFile('tesis-'+(p.name||'proyecto').toLowerCase().replace(/\s+/g,'-')+'.json', JSON.stringify({blocks, estado: thesisState}, null, 2), 'application/json')},

    blocks.map((block,idx)=>h('div',{key:block.id,className:'card',style:{marginBottom:10,borderLeft:block.aiAssisted?'2px solid rgba(0,214,126,.4)':'2px solid transparent',position:'relative'}},

        h('input',{value:block.titulo,disabled:isLocked,onChange:e=>updBlock(block.id,{titulo:e.target.value}),
          style:{flex:1,background:'none',border:'none',color:'var(--txt)',fontWeight:700,fontSize:13,padding:0,fontFamily:'inherit'}}),
        block.aiAssisted && h('span',{style:{fontSize:9,color:'var(--emerald)',background:'rgba(0,214,126,.1)',padding:'2px 6px',borderRadius:6,flexShrink:0}},'✦ IA'),
        !isLocked && h('span',{style:{display:'flex',gap:4}},
          h('button',{onClick:()=>moveBlock(block.id,-1),disabled:idx===0,title:'Mover arriba',style:{background:'none',border:'none',color:'var(--txt-mute)',cursor:'pointer',padding:'2px 5px',fontSize:13}},'↑'),
          h('button',{onClick:()=>moveBlock(block.id,1),disabled:idx===blocks.length-1,title:'Mover abajo',style:{background:'none',border:'none',color:'var(--txt-mute)',cursor:'pointer',padding:'2px 5px',fontSize:13}},'↓'),
          h('button',{onClick:()=>suggestField(block),disabled:aiLoading===block.id,title:'Sugerí este campo con IA',style:{background:'rgba(0,214,126,.1)',border:'none',color:'var(--emerald)',cursor:'pointer',padding:'2px 7px',borderRadius:5,fontSize:11,fontWeight:600}},
            aiLoading===block.id?'…':'✦ IA'),
          h('button',{onClick:()=>delBlock(block.id),title:'Eliminar bloque',style:{background:'none',border:'none',color:'#FF5C5C',cursor:'pointer',padding:'2px 5px',fontSize:13}},'×'))),

      /* contenido por tipo */
      block.tipo==='texto' && h('textarea',{value:block.contenido||'',disabled:isLocked,rows:3,style:fs,placeholder:'Escribí el contenido o usá ✦ IA para una sugerencia…',onChange:e=>updBlock(block.id,{contenido:e.target.value})}),

      block.tipo==='alerta' && h('textarea',{value:block.contenido||'',disabled:isLocked,rows:2,
        style:{...fs,borderLeft:'3px solid #FFB23E',paddingLeft:10,color:'#FFB23E'},

        (block.items||[]).map((item,i)=>h('div',{key:i,style:{display:'flex',gap:6,marginBottom:5,alignItems:'center'}},
          h('span',{style:{color:block.tipo==='lista_si'?'var(--emerald)':'#FF5C5C',fontWeight:700,fontSize:14,flexShrink:0}},block.tipo==='lista_si'?'✓':'✗'),
          h('input',{value:item,disabled:isLocked,style:{...fs,padding:'6px 10px',flex:1},onChange:e=>updItem(block.id,'items',i,e.target.value)}),
          !isLocked&&h('button',{onClick:()=>delItem(block.id,'items',i),style:{background:'none',border:'none',color:'#FF5C5C',cursor:'pointer',fontSize:15,flexShrink:0}},'×'))),
        !isLocked&&h('button',{onClick:()=>addItem(block.id,'items'),style:{fontSize:11,color:block.tipo==='lista_si'?'var(--emerald)':'#FF5C5C',background:'none',border:'none',cursor:'pointer',marginTop:2}},'+  agregar')),

      block.tipo==='kv' && h('div',{style:{display:'grid',gridTemplateColumns:'1fr 2fr',gap:6}},
        (block.pairs||[]).map(([k,v],i)=>h(React.Fragment,{key:i},

          h('div',{style:{display:'flex',gap:4}},

      block.tipo==='mecanismo' && h('div',{},

function getDemoAiResponse(mode, userQuery) {
  const q = (userQuery || '').toLowerCase();
  if (mode === 'issuer') {
    if (q.includes('foto') || q.includes('imagen') || q.includes('flyer') || q.includes('document') || q.includes('adjunt') || q.includes('cargar') || q.includes('subir')) {
      return '**Para cargar imágenes, flyer y documentación en tu proyecto:**\n\n1. **Flyer, PDFs y Documentación de Inversores:** Dirigite a **Mis Proyectos** → opción **Pitch y Documentos** (o pestaña **Pitch y Documentos** en el panel de administración). Allí tenés la sección **⑤ Documentos para inversores** con los botones **"📎 Subir documento"** (PDF o imagen/flyer) y **"🔗 Agregar URL"**.\n2. **Fotos de Portada y Galería del Activo:** Podés cargarlas al crear el proyecto en el **Paso 3 del Wizard ("Fotos del activo")** o desde **Administración → Proyectos → Editar**.\n\n¿Querés que te guíe en algún otro paso del armado de tu proyecto?';
    }
    if (q.includes('proceso') || q.includes('etapa') || q.includes('ronda')) {
      return 'El proceso de tokenización consta de **7 etapas**:\n1. **Alta:** Creás el proyecto en el wizard.\n2. **Análisis TOKAI:** Evaluación en 6 rondas institucionales.\n3. **Tesis de valor:** TOKAI define el modelo y derechos del token.\n4. **Reporte:** Modelo de negocio y proyecciones.\n5. **Técnico:** Configuración del smart contract ERC-3643.\n6. **Habilitación:** Llave de gobernanza de emisión.\n7. **Distribución:** Emisión activa y pago de dividendos.';
    }
    if (q.includes('costo') || q.includes('precio') || q.includes('fee')) {
      return 'TOKAI opera bajo un esquema de estructuración transparente. Los fees de estructuración y emisión se determinan tras la evaluación del proyecto en la Ronda 1.\n\n¿Qué tipo de activo estás buscando tokenizar?';
    }
    return '**Hola.** Soy el asistente de TOKAI para emisores.\n\nPuedo orientarte sobre las 7 etapas del proceso, cómo subir el flyer o documentación de tu proyecto, revisar la tesis de valor o configurar tu wallet MetaMask para emitir.\n\n**¿En qué te puedo ayudar?**';
  } else {
    if (q.includes('derecho') || q.includes('token') || q.includes('otorg')) {
      return 'El token otorga **derechos económicos y financieros** programados en el contrato (ej. cobro de rentas o participación en el pool), no titularidad registral sobre el bien físico. Podés revisar el detalle exacto en la Tesis de Valor del proyecto.';
    }
    if (q.includes('cobro') || q.includes('rendimiento') || q.includes('yield')) {
      return 'El rendimiento se distribuye directamente on-chain en stablecoins (USDC/USDT) o moneda acordada. Podés reclamar tu renta acumulada desde tu portal de inversor en el botón **"Cobrar"**.';
    }
    return '**Hola.** Soy el asistente de inversión de TOKAI RWA.\n\nPuedo explicarte los derechos que otorga el token, los plazos de lock-up, la distribución de rentas y las garantías de compliance. ¿En qué te puedo ayudar?';
  }
}

/* ────────────────────────────────────────────────────────────────
   Motor compartido de chat (usado por ambos asistentes)
   ─────────────────────────────────────────────────────────────── */
async function sendToAI(mode, history, context, regimeComplianceKey) {
  const lastUserMsg = [...history].reverse().find(m => m.role === 'user')?.content || '';
  const apiUrl = window.__API_URL__;
  if (!apiUrl) {
    return getDemoAiResponse(mode, lastUserMsg);
  }
  try {
    const res = await fetch(apiUrl + '/ai/chat', {
      method: 'POST',
      credentials: 'include',
      headers: {
        'Content-Type': 'application/json',
        ...(localStorage.getItem('tokai_jwt') ? { 'Authorization': 'Bearer ' + localStorage.getItem('tokai_jwt') } : {})
      },
      body: JSON.stringify({
        mode: mode,
        messages: history.map(function(m){ return {role:m.role, content:String(m.content).slice(0,3000)}; }),
        context: (context||'').slice(0,1000),
        ...(regimeComplianceKey ? {regimeComplianceKey} : {})
      })
    });
    if (!res.ok) {
      return getDemoAiResponse(mode, lastUserMsg);
    }
    const data = await res.json();
    return data.text || getDemoAiResponse(mode, lastUserMsg);
  } catch (err) {
    return getDemoAiResponse(mode, lastUserMsg);
  }
}

/* ────────────────────────────────────────────────────────────────
   Componente base de chat (reutilizado por ambos asistentes)
   ─────────────────────────────────────────────────────────────── */
function AssistantChat({aiMode, projectCtx, regimeComplianceKey, greeting, quickReplies, headerLabel, headerSub, mode, onClose}) {
  const [msgs, setMsgs] = useState([{role:'assistant', content:greeting}]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const endRef = React.useRef(null);

  async function send(text) {
    const msg = (text||input).trim();
    if (!msg || loading) return;
    setInput('');
    const newMsgs = [...msgs, {role:'user', content:msg}];
    setMsgs(newMsgs);
    setLoading(true);
    try {
      const reply = await sendToAI(aiMode, newMsgs, projectCtx, regimeComplianceKey);
      setMsgs(function(m){ return [...m, {role:'assistant', content:reply}]; });
    } catch(e) {
      setMsgs(function(m){ return [...m, {role:'assistant', content:'Error de conexión. Intentá de nuevo.'}]; });
    } finally { setLoading(false); }
  }

  function renderMsg(text) {
    return text.split('\n').map(function(line,i){
      return h('p',{key:i,style:{margin:'2px 0',lineHeight:1.55}},
        line.split(/(\*\*[^*]+\*\*)/g).map(function(p,j){
          return p.startsWith('**') ? h('strong',{key:j,style:{color:'var(--txt)'}},p.slice(2,-2)) : h('span',{key:j},p);
        }));
    });
  }

  const isFloat = mode==='float';
  const containerStyle = isFloat
    ? {position:'fixed',bottom:80,right:20,width:'calc(100% - 40px)',maxWidth:370,height:'min(540px, calc(100vh - 120px))',background:'var(--panel)',borderRadius:16,border:'1px solid var(--line-solid)',boxShadow:'0 8px 40px rgba(0,0,0,.5)',zIndex:300,display:'flex',flexDirection:'column',overflow:'hidden'}
    : {display:'flex',flexDirection:'column',height:460,background:'var(--black)',borderRadius:12,border:'1px solid var(--line-solid)',marginTop:16};

  return h('div',{style:containerStyle},
    /* header */
    h('div',{style:{padding:'12px 14px',borderBottom:'1px solid var(--line-solid)',display:'flex',alignItems:'center',gap:10,background:'var(--panel)',flexShrink:0}},
      h('div',{style:{width:34,height:34,borderRadius:9,background:'rgba(0,214,126,.15)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0}},'🤖'),
      h('div',{style:{flex:1}},
        h('div',{style:{fontWeight:700,fontSize:13}},headerLabel),
        h('div',{style:{fontSize:10,color:'var(--emerald)'}},
          h('span',{style:{display:'inline-block',width:6,height:6,borderRadius:'50%',background:'var(--emerald)',marginRight:4}}),
          headerSub)),
      isFloat && onClose && h('button',{onClick:onClose,style:{background:'none',border:'none',color:'var(--txt-mute)',cursor:'pointer',fontSize:18,padding:0,flexShrink:0}},'×')),

    /* mensajes */
    h('div',{style:{flex:1,overflow:'auto',padding:'12px 10px',display:'flex',flexDirection:'column',gap:8}},
      msgs.map(function(m,i){
        return h('div',{key:i,style:{
          padding:'9px 11px',borderRadius:10,maxWidth:'90%',fontSize:12.5,
          alignSelf:m.role==='user'?'flex-end':'flex-start',
          background:m.role==='user'?'rgba(0,214,126,.12)':'var(--panel)',
          color:'var(--txt-dim)',
          border:m.role==='assistant'?'1px solid var(--line-solid)':'none'
        }}, renderMsg(m.content));
      }),
      loading && h('div',{style:{padding:'9px 11px',borderRadius:10,maxWidth:'60%',background:'var(--panel)',border:'1px solid var(--line-solid)',fontSize:12,color:'var(--txt-mute)'}},'✦ Pensando…'),
      h('div',{ref:endRef})),

    /* quick replies (solo al inicio) */
    msgs.length <= 1 && h('div',{style:{padding:'0 10px 8px',display:'flex',flexWrap:'wrap',gap:5,flexShrink:0}},
      quickReplies.map(function(q,i){
        return h('button',{key:i,onClick:function(){send(q);},
          style:{padding:'4px 9px',borderRadius:20,border:'1px solid var(--emerald)',background:'transparent',color:'var(--emerald)',fontSize:11,cursor:'pointer',fontWeight:500}},q);
      })),

    /* input */
    h('div',{style:{padding:'9px 10px',borderTop:'1px solid var(--line-solid)',display:'flex',gap:7,flexShrink:0}},
      h('input',{value:input,onChange:function(e){setInput(e.target.value);},
        onKeyDown:function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}},
        disabled:loading,
        placeholder:'Escribí tu consulta…',
        style:{flex:1,padding:'8px 11px',borderRadius:9,border:'1px solid var(--line-solid)',background:'var(--black)',color:'var(--txt)',fontSize:13}}),
      h('button',{onClick:function(){send();},disabled:loading||!input.trim(),
        className:'btn btn-primary btn-sm',
        style:{flexShrink:0,opacity:input.trim()&&!loading?1:.5}},loading?'…':'→'))
  );
}

   Centralizada acá para que EmissionChecklist y el contexto que se le manda a
   la IA (callTokaiAgent/sendToAI/generateReport) usen EXACTAMENTE la misma
   lógica — agregar una jurisdicción nueva es agregar una entrada al catálogo,
   nunca tocar esta función. */
function resolveRegimeComplianceKey(project) {
  var p = project || {};
  if (p.meta && p.meta.arRoute) return p.meta.arRoute;
  if (p.issuerJurisdiction && p.issuerJurisdiction !== 'AR') return p.issuerJurisdiction;
  return null;
}

/* ─── Contexto del proyecto para el backend (metadatos no sensibles) ─── */
function buildProjectContext(project, thesis) {
  var p = project || {};
  var thesisSummary = (thesis && thesis.blocks)
    ? thesis.blocks.map(function(b){ return b.titulo + ': ' + (b.contenido || (b.items&&b.items.join(', ')) || (b.pairs&&b.pairs.map(function(kv){return kv[0]+': '+kv[1];}).join(', ')) || b.descripcion || ''); }).join('\n')
    : '';
  var stage = typeof getProjectStage === 'function' ? getProjectStage(p) : 0;
  var stageLabels = ['','Alta del proyecto','Análisis TOKAI','Tesis de valor','Reporte del modelo','Configuración técnica','Emisión habilitada','En distribución'];
  return [
    'PROYECTO: ' + (p.name||'—') + ' (' + (p.symbol||'—') + ')',
    'Vertical: ' + (p.vertical||'—') + ' | Activo: ' + (p.assetType||'—'),
    'Régimen: ' + (p.regime||'—') + ' | Valuación: USD ' + ((p.valuationUsd||0).toLocaleString()),
    'Precio/token: USD ' + ((p.priceUsdCents||0)/100) + ' | Supply máx: ' + (p.maxSupply||'—'),
    'Mecanismo de yield: ' + (p.yieldMechanism||'—') + ' | Yield est: ' + (p.yieldAnnualPct||0) + '% anual',
    'Etapa actual del flujo: ' + stage + '/7 — ' + (stageLabels[stage]||'—'),
    thesisSummary ? 'TESIS DE VALOR:\n' + thesisSummary : 'Tesis: en estructuración.',
  ].join('\n');
}

   TOKAI Platform — Corazón de Emisión (views7)
   EmissionEngine: IA que traduce decisiones de negocio a parámetros
   de contrato. EmissionPreview (TOKAI) + EmissionStatus (emisor).
   ════════════════════════════════════════════════════════════════════ */

/* ─── Mapa determinístico (no necesita IA para casos estándar) ─── */
function buildParamsFromProject(p) {
  // Los parámetros de compliance (holders, lockup, jurisdicciones, categoría, soulbound) salen del
  // proyecto SETEADO, nunca de deducciones por régimen o nombre (antes: 50 holders / 180 días si el
  // régimen decía "1088", soulbound si el nombre decía "lepra"/"boca", Argentina [32] por defecto).
  // El mecanismo de yield sí se sugiere por vertical cuando el proyecto no lo trae: es editable.
  const isClub = /club|fan|acceso|soulbound|pre.gat/i.test((p.vertical||'')+(p.assetType||''));
  const isCredit = /cr.dito|pool|leasing|rodado|auto|prendario/i.test((p.vertical||'')+(p.assetType||''));
  const rules = p.complianceRules || {};
  const setMech = ['A','B','C'].includes(String(p.yieldMechanism||'').toUpperCase()) ? String(p.yieldMechanism).toUpperCase() : null;

  const params = {
    soulbound: Boolean(p.soulbound ?? p.isSoulbound ?? false),
    maxHolders: Number(p.maxHolders) > 0 ? Number(p.maxHolders) : 0,
    lockupSeconds: Number(p.lockupDays) > 0 ? Math.round(Number(p.lockupDays) * 86400) : 0,
    allowedJurisdictions: Array.isArray(p.jurisdictions) ? p.jurisdictions.map(Number).filter(Boolean) : [],
    minCategory: [1,2,3].includes(Number(rules.minCategory)) ? Number(rules.minCategory) : 0,
    yieldMechanism: setMech || (isClub ? 'C' : isCredit ? 'B' : 'A'),
    waterfallDistributor: isCredit,
    tranches: isCredit ? [
      {name:'Senior', couponTargetPct: p.yieldAnnualPct || 7},
      {name:'Mezzanine', couponTargetPct: Math.round((p.yieldAnnualPct||7)*2)},
      {name:'FirstLoss', couponTargetPct: 0}
    ] : [],
  };

  const warnings = [];
  if (params.allowedJurisdictions.length === 0) warnings.push('⚠ El proyecto no tiene jurisdicciones de inversores seteadas: el despliegue se va a rechazar hasta cargarlas.');
  if (p.issuerRegimeKey === 'calificados' && !params.minCategory) warnings.push('⚠ Régimen de inversores calificados sin categoría KYC mínima: seteala antes de desplegar.');
  if (params.soulbound && params.yieldMechanism === 'A') warnings.push('⚠ Soulbound + yield A es inconsistente: el token no puede pagar renta si no se puede transferir al nuevo dueño.');
  if (params.allowedJurisdictions.includes(840)) warnings.push('⚠ Jurisdicción USA (840) requiere cobertura Reg D/S confirmada antes de habilitar.');
  if ((p.maxSupply||0) < 10 && (p.priceUsd||0) > 100000) warnings.push('⚠ Supply muy bajo para el precio unitario. Revisá la fraccionabilidad.');

  const mechLabel = {A:'Renta periódica push (yield al holder)',B:'Waterfall de crédito (cuota → cascada)',C:'Ecosistema cerrado, sin flujo financiero'}[params.yieldMechanism];
  const lockDays = Math.round(params.lockupSeconds / 86400);
  const explanation = `El contrato ${params.soulbound ? 'emitirá certificados intransferibles (soulbound)' : 'emitirá tokens transferibles'} bajo ${p.regime || 'el régimen seteado del proyecto'}. ${params.maxHolders > 0 ? `Máximo ${params.maxHolders} holders.` : ''} ${lockDays > 0 ? `Lock-up de ${lockDays} días desde la primera adquisición.` : ''} ${params.minCategory ? `Categoría KYC mínima ${params.minCategory}.` : ''} Mecanismo de flujo: ${mechLabel}.`;

  return { contractType: params.waterfallDistributor ? 'TOKAIToken+Waterfall' : params.soulbound ? 'TOKAIToken+Soulbound' : 'TOKAIToken', params, warnings, explanation };
}

/* ─── Llamada IA al proxy seguro ─── */
async function callEmissionAI(prompt, projectContext) {
  const context = `PROYECTO: ${projectContext.name||''} | ${projectContext.vertical||''} | ${projectContext.regime||''} | supply=${projectContext.maxSupply||''} | price=USD${(projectContext.priceUsdCents||0)/100}`;
  const res = await fetch((window.__API_URL__||'')+'/ai/chat', {
    method: 'POST',
    credentials: 'include',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({mode:'emission', messages:[{role:'user',content:prompt}], context})
  });
  if(!res.ok) return {contractType:'TOKAIToken', params:{}, warnings:['Error al conectar con la IA'], explanation:''};
  const data = await res.json();
  const raw = data.text || '{}';
  try { return JSON.parse(raw.replace(/```json|```/g,'').trim()); }
  catch(e) { return {contractType:'TOKAIToken', params:{}, warnings:['Error al parsear respuesta IA'], explanation: raw.slice(0,200)}; }
}

/* Deploy con MetaMask enviado y sin registrar (plan de remediación, fase 1): muestra la etapa, el tx y
   un botón que retoma el MISMO deploy (lee el receipt y registra la evidencia). Nunca despliega de nuevo. */
const DEPLOY_STAGE_LABEL = { enviado: 'Enviado · esperando confirmación', confirmado: 'Confirmado on-chain · falta registrarlo' };
function PendingDeployNotice({chain, project, toast}){
  const [busy, setBusy] = useState(false);
  const [, setTick] = useState(0);
  const rec = project && project.id && chain && chain.pendingDeploy ? chain.pendingDeploy(project.id) : null;
  if (!rec || project.tokenDeployed) return null;
  async function recover(){
    setBusy(true);
    try {
      const out = await chain.recoverPendingDeploy(project);
      if (out.ok) toast && toast({ title: 'Despliegue registrado', msg: (project.symbol || 'Token') + (out.tokenAddr ? ' → ' + short(out.tokenAddr) : '') + (out.idempotent ? ' (ya estaba registrado)' : ''), hash: out.hash });
      else toast && toast({ type: out.uncertain ? 'warn' : 'err', title: 'Registro pendiente', msg: out.reason, hash: out.hash });
    } finally { setBusy(false); setTick(t => t + 1); }
  }
  return h('div',{className:'card',role:'status',style:{marginBottom:12,padding:'12px 14px',background:'rgba(255,178,62,.06)',border:'1px solid rgba(255,178,62,.35)'}},
    h('div',{style:{fontWeight:700,fontSize:13,color:'#FFB23E',marginBottom:4}},'⚠ Hay un despliegue sin registrar'),
    h('div',{style:{fontSize:12,color:'var(--txt-dim)',lineHeight:1.55,marginBottom:10}},
      'Etapa: ', h('strong',{},DEPLOY_STAGE_LABEL[rec.stage] || rec.stage),
      ' · tx ', h('span',{style:{fontFamily:'var(--mono)'}},short(rec.txHash)),
      '. No despliegues de nuevo: recuperá el registro de esta misma operación.'),
    h('button',{className:'btn btn-primary btn-sm',onClick:recover,disabled:busy},busy?'Recuperando…':'Recuperar registro'));
}

  async function handleAutoDeployFromPreview() {
    if (needsChecklistAck) {
      toast && toast({ type:'warn', title:'Checklist con pendientes', msg:'Confirmá que desplegás con los requisitos pendientes (casilla sobre el botón).' });
      return;
    }
    const checklist = {
      ok: deployChecks.length - pendingChecks.length,
      total: deployChecks.length,
      pending: pendingChecks.map(c => ({ id: String(c.id), label: String(c.label) })),
      acknowledged: pendingChecks.length === 0 || ackChecklist,
    };
    const finalParams = editParams || result?.params || {};
    const mergedProj = {
      ...p,
      soulbound: finalParams.soulbound,
      maxHolders: finalParams.maxHolders,
      lockupDays: Math.round((finalParams.lockupSeconds||0)/86400),
      // Sin defaults: si el editor no tiene un valor se conserva el del proyecto (el backend
      // rechaza el despliegue si falta algo obligatorio).
      jurisdictions: Array.isArray(finalParams.allowedJurisdictions) ? finalParams.allowedJurisdictions : (p.jurisdictions || []),
      complianceRules: { ...(p.complianceRules||{}), minCategory: Number(finalParams.minCategory) || Number((p.complianceRules||{}).minCategory) || 0 },
    };
    if (chain.updateProject) {
      await Promise.resolve(chain.updateProject(pid, {
        emissionParams: finalParams,
        contractType: result?.contractType,
        emissionStatus: 'configured',
        soulbound: mergedProj.soulbound,
        maxHolders: mergedProj.maxHolders,
        lockupDays: mergedProj.lockupDays,
        jurisdictions: mergedProj.jurisdictions,
        complianceRules: mergedProj.complianceRules,
        yieldMechanism: finalParams.yieldMechanism,
      }));
    }
    setDeployed(true);
    setDeployingLive(true);
    try {
      const fn = chain.autoDeployToken || chain.deployToken;
      if (!fn) { toast && toast({ title:'Parámetros guardados', msg:'Listo para desplegar.' }); return; }
      const out = await fn(mergedProj, { checklist });
      setLiveDeployOut(out);
      if (out && out.ok && out.warning) {
        toast && toast({ type:'warn', title:'Token desplegado — configuración incompleta', msg:out.warning, hash:out.hash });
      } else if (out && out.ok) {
        toast && toast({ title:'Token generado y desplegado', msg:`${p.symbol} → ${short(out.tokenAddr)} (${out.mode==='relayer'?'Relayer Desatendido':'On-Chain'})`, hash:out.hash });
      } else if (out && (out.onchainDeployed || out.uncertain)) {
        toast && toast({ type:'warn', title: out.onchainDeployed ? 'Token desplegado — registro pendiente' : 'Resultado del despliegue sin confirmar', msg:out.reason, hash:out.hash });
      } else {
        toast && toast({ type:'err', title:'Despliegue rechazado', msg:(out&&out.reason)||'Verificá que TOKAI haya habilitado el proyecto.' });
      }
    } finally {
      setDeployingLive(false);
    }
  }

              h('option',{value:'sharia_board'},'Junta Sharía (MENA CMA/DFSA)'),
              h('option',{value:'casp_custodio'},'Custodio / CASP (MiCA UE)'),
              h('option',{value:'registered_agent'},'Registered Agent / Broker (US Reg D)')),
            h('input',{placeholder:'Razón social / Entidad',value:newParty.legalName,onChange:e=>setNewParty(pt=>({...pt,legalName:e.target.value})),style:fs}),
            h('input',{placeholder:'País (AR/US/AE/EU)',value:newParty.jurisdiction,onChange:e=>setNewParty(pt=>({...pt,jurisdiction:e.target.value})),style:fs}),
            h('input',{placeholder:'CUIT / EIN / Tax ID',value:newParty.taxId,onChange:e=>setNewParty(pt=>({...pt,taxId:e.target.value})),style:fs}),
            h('button',{className:'btn btn-ghost btn-sm',onClick:addPartyItem},'+ Parte')))
      ),

      // checklist de pre-emisión: pendientes visibles y confirmación explícita antes del deploy
      !(p.tokenDeployed || p.tokenAddress) && pendingChecks.length > 0 && h('div',{className:'card',role:'region','aria-label':'Checklist de pre-emisión pendiente',style:{marginBottom:12,padding:'12px 14px',background:'rgba(255,178,62,.06)',border:'1px solid rgba(255,178,62,.35)'}},
        h('div',{style:{fontWeight:700,fontSize:13,color:'#FFB23E',marginBottom:6}},
          '⚠ Checklist de pre-emisión: '+(deployChecks.length-pendingChecks.length)+' de '+deployChecks.length+' completos'),
        h('ul',{style:{margin:'0 0 10px',paddingLeft:18,fontSize:12,color:'var(--txt-dim)'}},
          pendingChecks.map(c => h('li',{key:c.id},c.label))),
        h('label',{style:{display:'flex',gap:8,alignItems:'flex-start',fontSize:12,cursor:'pointer'}},
          h('input',{type:'checkbox',checked:ackChecklist,onChange:e=>setAckChecklist(e.target.checked),style:{marginTop:2}}),
          h('span',{},'Despliego con estos requisitos pendientes. Queda registrado en la evidencia y la auditoría del deploy.'))),

      h(PendingDeployNotice,{chain, project:p, toast}),

      // acciones
      h('div',{style:{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}},
        h('button',{className:'btn btn-ghost btn-sm',onClick:aiValidate,disabled:aiLoading},'✦ IA: validar parámetros'),
        h('button',{className:'btn btn-ghost btn-sm',style:{borderColor:'rgba(0,214,126,.4)',color:'var(--emerald)'},onClick:simulateDeploy,disabled:simulating},simulating?'Simulando…':'⚡ Simular deploy on-chain (Dry-Run)'),
        h('button',{className:'btn btn-ghost btn-sm',onClick:deployDemo},'💾 Guardar configuración'),
        // Con token ya desplegado no se ofrece redesplegar (el backend lo rechazaría con 409):
        // se muestra el estado y el contrato.
        (p.tokenDeployed || p.tokenAddress)
          ? h('span',{className:'badge green',style:{padding:'8px 12px',fontSize:11},title:'El token de este proyecto ya está desplegado: la evidencia es inmutable.'},
              '✓ Token desplegado' + (p.tokenAddress ? ' · ' + String(p.tokenAddress).slice(0,6) + '…' + String(p.tokenAddress).slice(-4) : ''))
          : h('button',{className:'btn btn-primary',onClick:handleAutoDeployFromPreview,disabled:deployingLive||needsChecklistAck||!!(chain.pendingDeploy&&p.id&&chain.pendingDeploy(p.id)),title:needsChecklistAck?'Confirmá los requisitos pendientes del checklist para habilitar el despliegue':undefined},
              deployingLive?'⏳ Desplegando y configurando módulos…':'🚀 Generar y Desplegar Token (Desatendido)')
      ),

      liveDeployOut && liveDeployOut.ok && h('div',{className:'card',style:{marginTop:12,background:'rgba(0,214,126,.06)',border:'1px solid rgba(0,214,126,.3)',padding:'12px 14px',fontSize:12}},
        h('div',{style:{fontWeight:800,color:'var(--emerald)',marginBottom:4}},'✓ Token Generado y Configurado ('+(liveDeployOut.mode==='relayer'?'Relayer Desatendido TOKAI':'On-Chain')+')'),
        h('div',{style:{fontFamily:'var(--mono)',fontSize:11,color:'var(--txt-dim)'}},'Token: '+liveDeployOut.tokenAddr+(liveDeployOut.complianceAddr?' · Registry: '+liveDeployOut.complianceAddr:''))
      ),

      // Resultado de simulación Dry-Run
      simResult && h('div',{className:'card',style:{marginTop:14,background:'rgba(0,214,126,.04)',border:'1px solid rgba(0,214,126,.25)',padding:'14px 16px'}},
        h('div',{style:{fontSize:12,fontWeight:800,color:'var(--emerald)',marginBottom:8,display:'flex',alignItems:'center',gap:6}},'✓ Simulación On-Chain Exitosa (eth_call 200 OK)'),

          h('div',{},h('span',{style:{color:'var(--txt-mute)'}},'Costo Gas Est (POL): '),h('strong',{style:{fontFamily:'var(--mono)'}},simResult.gasEstPol)),
          h('div',{},h('span',{style:{color:'var(--txt-mute)'}},'Costo Estimado (USD): '),h('strong',{style:{fontFamily:'var(--mono)'}},simResult.gasEstUsd)),
          h('div',{},h('span',{style:{color:'var(--txt-mute)'}},'Factory Destino: '),h('span',{style:{fontFamily:'var(--mono)',fontSize:10}},simResult.factoryAddress)),
          h('div',{},h('span',{style:{color:'var(--txt-mute)'}},'Checksum Payload: '),h('span',{style:{fontFamily:'var(--mono)',fontSize:10}},simResult.payloadChecksum))
        )

    )
  );
}

/* ════════════════════════════════════════════════════════════════════
   EmissionStatus — panel del emisor: estado del contrato en su panel
   ════════════════════════════════════════════════════════════════════ */
function EmissionStatus({chain, project, toast, wallet}) {
  const [pid, setPid] = useState(0);
  const p = project || (chain.projects && chain.projects[pid]) || {};
  const status = p.emissionStatus;
  const enabled = p.emissionEnabled && p.emissionEnabled[0];
  const paused  = p.emissionPaused;
  const params  = p.emissionParams;
  const [deploying, setDeploying] = useState(false);
  const [deployResult, setDeployResult] = useState(null);

  async function handleDeploy(preferRelayer) {
    const fn = preferRelayer && chain.autoDeployToken ? chain.autoDeployToken : chain.deployToken;
    if (!fn) return;
    // El emisor solo despliega con el checklist de pre-emisión completo (los pendientes los decide TOKAI).
    const checks = computeEmissionChecks(p).checks;
    const pending = checks.filter(c => !c.ok);
    if (pending.length > 0) {
      toast && toast({ type:'warn', title:'Checklist de pre-emisión incompleto', msg:'Faltan '+pending.length+' requisito(s): '+pending.map(c=>c.label).join(' · ')+'. Coordiná con TOKAI.' });
      return;
    }
    const checklist = { ok: checks.length, total: checks.length, pending: [], acknowledged: false };
    setDeploying(true);
    setDeployResult(null);
    try {
      const result = await fn(p, { checklist });
      setDeployResult(result);
      if (result.ok && result.warning) {
        toast && toast({ type:'warn', title: 'Token desplegado — configuración incompleta', msg: result.warning, hash: result.hash });
      } else if (result.ok) {
        toast && toast({ title: 'Token desplegado', msg: `${p.symbol} en ${result.tokenAddr.slice(0,10)}… · gas: ${result.gasPOL ? (result.mode === 'relayer' ? result.gasPOL : result.gasPOL + ' POL') : 'no disponible'}` });
      } else if (result.onchainDeployed || result.uncertain) {
        toast && toast({ type:'warn', title: result.onchainDeployed ? 'Token desplegado — registro pendiente' : 'Resultado del despliegue sin confirmar', msg: result.reason, hash: result.hash });
      } else {
        toast && toast({ type:'err', title: 'Error al desplegar', msg: result.reason || 'Transacción revertida' });
      }
    } catch(e) {
      toast && toast({ type:'err', title: 'Error inesperado', msg: e.message });
    } finally { setDeploying(false); }
  }

  // Selector de proyecto si hay más de uno
  const projectSelector = (chain.projects||[]).length > 1 && h('div',{style:{marginBottom:14}},
    h('select',{value:pid,onChange:e=>setPid(+e.target.value),style:{padding:'7px 12px',borderRadius:8,border:'1px solid var(--line-solid)',background:'var(--black)',color:'var(--txt)',fontSize:12.5,width:'100%'}},
      (chain.projects||[]).map((x,i)=>h('option',{key:i,value:i},`${x.symbol} — ${x.name}`)))
  );

  // ── Tarjeta de deploy (Estrategia A) — Ronda 5 sin token desplegado ──────────
  if (p.ronda >= 5 && !p.tokenDeployed) {
    return h('div',{},
      projectSelector,
      h('div',{style:{
        background:'linear-gradient(135deg,rgba(0,214,126,.07) 0%,rgba(77,168,255,.07) 100%)',
        border:'1.5px solid rgba(0,214,126,.35)',
        borderRadius:16, padding:'28px 24px', marginBottom:16,
      }},
        h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:16}},
          h('div',{style:{width:44,height:44,borderRadius:12,background:'rgba(0,214,126,.15)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,flexShrink:0}},'🚀'),
          h('div',{},
            h('div',{style:{fontWeight:800,fontSize:15,color:'var(--txt)',marginBottom:2}},'Estructuración Aprobada por TOKAI'),
            h('span',{style:{fontSize:10.5,fontWeight:700,padding:'2px 8px',borderRadius:20,background:'rgba(0,214,126,.15)',color:'var(--emerald)'}},'RONDA 5 · LISTO PARA DEPLOY'))),

        h('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10,marginBottom:18}},
          [['Símbolo',p.symbol||'—'],['Supply máx',(p.maxSupply||0).toLocaleString()],['Estándar',p.tokenStandard||'ERC-3643']].map(([k,v],i)=>
            h('div',{key:i,style:{padding:'10px 12px',borderRadius:9,background:'rgba(255,255,255,.04)',border:'1px solid var(--line-solid)'}},
              h('div',{style:{fontSize:10,color:'var(--txt-mute)',marginBottom:3}},k),
              h('div',{style:{fontWeight:700,fontSize:13}},v)))),

        h(PendingDeployNotice,{chain, project:p, toast}),

        deployResult && deployResult.ok && h('div',{style:{marginBottom:14,padding:'10px 14px',borderRadius:9,background:'rgba(0,214,126,.08)',border:'1px solid rgba(0,214,126,.25)',fontSize:12}},
          h('div',{style:{fontWeight:700,color:'var(--emerald)',marginBottom:4}},'✓ Token desplegado'),
          h('div',{style:{color:'var(--txt-dim)',fontFamily:'JetBrains Mono,monospace',fontSize:11,wordBreak:'break-all'}},deployResult.tokenAddr),
          deployResult.mode !== 'relayer' && h('div',{style:{marginTop:4,color:'var(--txt-mute)',fontSize:11}},'Gas pagado: ' + (deployResult.gasPOL ? deployResult.gasPOL + ' POL' : 'no disponible')),
          deployResult.warning && h('div',{style:{marginTop:8,padding:'8px 10px',borderRadius:7,background:'rgba(255,178,62,.1)',border:'1px solid rgba(255,178,62,.25)',color:'#FFB23E',fontSize:11,lineHeight:1.5}},
            '⚠ ',deployResult.warning)),

        deployResult && !deployResult.ok && h('div',{style:{marginBottom:14,padding:'10px 14px',borderRadius:9,background:'rgba(255,92,92,.08)',border:'1px solid rgba(255,92,92,.2)',fontSize:12,color:'#FF5C5C'}},
          '⚠ ',deployResult.reason),

        !deployResult?.ok && h('div',{},
          !enabled && h('div',{style:{
            background:'rgba(255,178,62,.04)',
            border:'1px solid rgba(255,178,62,.2)',
            padding:'12px 14px',
            borderRadius:10,
            marginBottom:14,
            fontSize:12.5,
            color:'#FFB23E',
            lineHeight:1.5
          }},
            '⚠️ Para poder desplegar el contrato del token en la red, TOKAI debe completar el checklist de 7 requisitos pre-emisión y habilitar el gate de la serie desde su panel de supervisión.'
          ),
          h('p',{style:{fontSize:12,color:'var(--txt-dim)',lineHeight:1.6,marginBottom:14}},
            'Hacé clic para desplegar el contrato ' + (p.tokenStandard || 'ERC-3643') + ' en Polygon PoS vía TokenFactory.',
            h('br'),
            'MetaMask te pedirá confirmar la transacción y pagar el gas en POL.',
            h('br'),
            h('span',{style:{color:'var(--txt-mute)',fontSize:11}},'El contrato se registra en TOKAI y el proyecto avanza a la Ronda 6 (Emisión activa).')),
          h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
            h('button',{
              className:'btn btn-primary',
              style:{
                width:'100%', padding:'11px', fontSize:13.5, fontWeight:700,
                opacity: (!enabled || deploying) ? 0.5 : 1,
                cursor: (!enabled || deploying) ? 'not-allowed' : 'pointer'
              },
              onClick: enabled ? ()=>handleDeploy(true) : undefined,
              disabled: !enabled || deploying,
            }, deploying ? '⏳ Desplegando…' : !enabled ? '⏳ Esperando Habilitación TOKAI' : '🚀 Generar Token Desatendido (Relayer)'),
            h('button',{
              className:'btn btn-ghost',
              style:{
                width:'100%', padding:'11px', fontSize:13, fontWeight:700,
                borderColor:'rgba(0,214,126,.35)', color:'var(--emerald)',
                opacity: (!enabled || deploying) ? 0.5 : 1,
                cursor: (!enabled || deploying) ? 'not-allowed' : 'pointer'
              },
              onClick: enabled ? ()=>handleDeploy(false) : undefined,
              disabled: !enabled || deploying,
            }, deploying ? '⏳ Firmando…' : '🦊 Desplegar con MetaMask'))
      ))
    );
  }

  const isDeployed = !!(p.tokenDeployed || p.tokenAddress);
  if (!status && !params && !isDeployed) return h('div',{},
    projectSelector,
    h('div',{style:{padding:'14px 16px',borderRadius:10,background:'rgba(255,255,255,.03)',border:'1px solid var(--line-solid)',fontSize:12.5,color:'var(--txt-mute)'}},
      '📋 TOKAI está preparando los parámetros del contrato para tu proyecto. Te notificaremos cuando estés listo para emitir.'));

  const MECH = {A:'Renta periódica',B:'Waterfall de crédito',C:'Sin yield (acceso/certificado)'};

  return h('div',{},
    projectSelector,
    h('div',{className:'card'},
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},
      h('div',{style:{fontWeight:700,fontSize:13}},'Estado de emisión'),
      h('span',{style:{fontSize:11,fontWeight:700,padding:'3px 10px',borderRadius:20,
        background:paused?'rgba(255,92,92,.15)':enabled?'rgba(0,214,126,.15)':'rgba(154,160,166,.12)',
        color:paused?'#FF5C5C':enabled?'var(--emerald)':'#9AA0A6'}},
        paused?'⏸ Pausada':enabled?'⚡ Habilitada':'⏳ Configurada — esperando habilitación')),

    (params || isDeployed) && h('div',{style:{display:'grid',gap:6}},
      [
        ...(isDeployed ? [['Token', p.tokenAddress ? String(p.tokenAddress).slice(0,8)+'…'+String(p.tokenAddress).slice(-6) : 'Desplegado']] : []),
        ['Tipo de contrato', p.contractType || 'TOKAIToken'],
        ['Certificados/tokens', p.soulbound ? 'Soulbound (intransferibles)' : 'Transferibles (mercado OTC)'],
        ['Inversores máx.', p.maxHolders || 'Sin límite'],
        ['Lock-up', p.lockupDays ? p.lockupDays+' días' : 'Sin lock-up'],
        ['Mecanismo de flujo', MECH[p.yieldMechanism] || '—'],
      ].map(([k,v],i,arr)=>h('div',{key:i,style:{display:'flex',justifyContent:'space-between',fontSize:12,padding:'5px 0',borderBottom:i<arr.length-1?'1px solid rgba(255,255,255,.04)':'none'}},
        h('span',{style:{color:'var(--txt-mute)'}},k),h('span',{style:{fontWeight:600,color:'var(--txt)'}},String(v))))),

    !enabled && !paused && h('div',{style:{marginTop:10,fontSize:12,color:'var(--txt-mute)',lineHeight:1.5}},
      'Cuando TOKAI active la emisión, podrás emitir tokens directamente desde tu panel. Los inversores con KYC aprobado podrán suscribir.'),

    enabled && !paused && h('div',{style:{marginTop:10,padding:'10px 12px',borderRadius:8,background:'rgba(0,214,126,.06)',border:'1px solid rgba(0,214,126,.2)',fontSize:12,color:'var(--txt-dim)'}},
      '✓ Podés emitir. Andá a la pestaña "Emisión" en el panel de administración para mintear tokens a inversores verificados.')
    )  // cierre h('div',{className:'card'})
  );   // cierre h('div',{})
}


/* ════════════════════════════════════════════════════════════════════
   MÓDULO E · ReportExporter
   Genera el Reporte del Modelo de Negocio e importa desde Claude.ai
   ════════════════════════════════════════════════════════════════════ */
function ReportExporter({chain, toast}) {
  const projects = chain.projects||[];
  const [pid, setPid] = useState(0);
  const p = projects[pid]||projects[0]||{};
  const [mode, setMode] = useState('export'); // 'export' | 'import' | 'preview'
  const [generating, setGenerating] = useState(false);
  const [reportMd, setReportMd] = useState(p.businessReport||'');
  const [importText, setImportText] = useState('');
  const [copied, setCopied] = useState(false);

  /* Genera el reporte via IA */
  async function generateReport() {
    setGenerating(true);
    try {
      const ctx = [
        `Proyecto: ${p.name} (${p.symbol})`,
        `Vertical: ${p.vertical} | Activo: ${p.assetType||'—'}`,
        `Valuación: USD ${(p.valuationUsd||0).toLocaleString()} | Precio token: USD ${(p.priceUsdCents||0)/100}`,
        `Supply máx: ${p.maxSupply||'—'} tokens | Régimen: ${p.regime||'—'}`,
        `Mecanismo: ${p.yieldMechanism||'A'} | Yield est: ${p.yieldAnnualPct||0}% anual`,
        `Descripción: ${p.desc||'—'}`,
        p.pitch?.porque ? `Pitch del emisor: ${p.pitch.porque.slice(0,300)}` : '',
        p.thesis?.blocks ? `Tesis de valor: ${p.thesis.blocks.map(b=>b.titulo+': '+(b.contenido||b.items?.join(', ')||'')).join(' | ').slice(0,400)}` : '',
      ].filter(Boolean).join('\n');

      const prompt = `Generá el Reporte del Modelo de Negocio del Token para este proyecto.

El reporte debe cubrir:
1. RESUMEN EJECUTIVO — qué es el token, qué problema resuelve, por qué tokenizar vs. instrumentos tradicionales
2. NATURALEZA JURÍDICA DEL TOKEN — clasificación (security/utility/híbrido), Howey Test, régimen aplicable (CNV RG 1069/1088), encuadre legal
3. MODELO DE NEGOCIO — activo subyacente, cómo genera valor, quién opera, cuál es la cadena de valor
4. ESTRUCTURA FINANCIERA — proyección de flujos (3 escenarios: pesimista/base/optimista), yield estimado, métricas clave (NOI/cap rate si inmobiliario, LTV/mora si crédito), waterfall si aplica
5. MECANISMO DE DISTRIBUCIÓN — cómo y cuándo cobra el holder (Mecanismo A/B/C), frecuencia, moneda, canal de pago
6. ESTRUCTURA TÉCNICA — estándar de token (ERC-3643), compliance (soulbound, lock-up, geo-blocking), vehículo legal (fideicomiso/SPV)
7. RIESGOS Y MITIGACIONES — mínimo 4 riesgos concretos del proyecto con su mitigación propuesta
8. HOJA DE RUTA — próximos hitos hasta la emisión

Formato: Markdown con encabezados claros. Usá tablas para datos financieros. Tono institucional, rioplatense. Las proyecciones van con supuestos explícitos — nunca garantizás retornos.`;

      const regimeComplianceKey = resolveRegimeComplianceKey(p);
      const res = await fetch((window.__API_URL__||'')+'/ai/chat', {
        method:'POST',
        credentials:'include',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({mode:'report', messages:[{role:'user',content:ctx}], context:ctx.slice(0,800), ...(regimeComplianceKey?{regimeComplianceKey}:{})})
      });
      if(!res.ok){ toast&&toast({type:'err',title:'Error',msg:'No se pudo conectar con la IA.'}); setGenerating(false); return; }
      const data = await res.json();
      const report = data.text||'Error al generar el reporte.';
      setReportMd(report);
      setMode('preview');
      if(chain.updateProject) chain.updateProject(pid, {businessReport: report});
      toast&&toast({title:'Reporte generado', msg:'Revisá, editá si necesitás, y enviá al cliente.'});
    } catch(e) {
      toast&&toast({type:'err', title:'Error', msg:'No se pudo conectar con la IA.'});
    } finally { setGenerating(false); }
  }

  /* Importar reporte generado en Claude.ai (pegado manual) */
  function importReport() {
    if(!importText.trim()) return;
    setReportMd(importText.trim());
    if(chain.updateProject) chain.updateProject(pid, {businessReport: importText.trim()});
    setMode('preview');
    setImportText('');
    toast&&toast({title:'Reporte importado', msg:'El reporte quedó vinculado al proyecto.'});
  }

  /* Copiar prompt listo para pegar en Claude.ai */
  function copyClaudePrompt() {
    const ctx = `Proyecto: ${p.name} | ${p.vertical} | USD ${(p.valuationUsd||0).toLocaleString()} | ${p.regime||''} | ${p.desc||''}`;
    const prompt = `Actuá como TOKAI RWA. Generá el Reporte del Modelo de Negocio del Token para este proyecto:\n\n${ctx}\n\nCubrí: naturaleza jurídica, modelo de negocio, estructura financiera (3 escenarios), mecanismo de distribución, estructura técnica, riesgos y hoja de ruta. Formato Markdown con tablas. Rioplatense institucional.`;
    navigator.clipboard&&navigator.clipboard.writeText(prompt);
    setCopied(true);
    setTimeout(()=>setCopied(false), 2500);
  }

  const ta = {width:'100%', padding:'11px 13px', borderRadius:10, border:'1px solid var(--line-solid)',
    background:'var(--black)', color:'var(--txt)', fontSize:12, fontFamily:'var(--mono)',
    resize:'vertical', boxSizing:'border-box', lineHeight:1.6};

  return h('div',{},
    h('div',{className:'eyebrow'},'Panel TOKAI · Reporte'),
    h('h1',{className:'page'},'Reporte del Modelo de Negocio'),
    h('p',{className:'page-sub'},'Generá o importá el reporte de análisis. Este documento se vincula al proyecto y sustenta la Tesis de Valor que el cliente confirma.'),

    /* selector proyecto */
    projects.length>1 && h('div',{style:{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}},
      projects.map((pr,i)=>h('button',{key:i,onClick:()=>{setPid(i);setReportMd(pr.businessReport||'');setMode('export');},
        style:{padding:'7px 13px',borderRadius:9,cursor:'pointer',fontSize:12,fontWeight:600,
          border:'1.5px solid '+(i===pid?'var(--emerald)':'var(--line-solid)'),
          background:i===pid?'rgba(0,214,126,.08)':'var(--panel)',
          color:i===pid?'var(--emerald)':'var(--txt)'}},pr.name))),

    /* tabs */
    h('div',{className:'role-switch',style:{marginBottom:16,width:'fit-content'}},
      [['export','Generar con IA'],['import','Importar desde Claude.ai'],['preview','Ver reporte']].map(([k,l])=>
        h('button',{key:k,className:'role-btn '+(mode===k?'active':''),onClick:()=>setMode(k)},l))),

    /* TAB: Generar con IA embebida */
    mode==='export' && h('div',{},
      h('div',{className:'card',style:{marginBottom:14}},
        h('div',{style:{fontWeight:700,fontSize:13,marginBottom:10}},'Generación automática (IA embebida)'),
        h('p',{style:{fontSize:12.5,color:'var(--txt-dim)',lineHeight:1.6,marginBottom:14}},'La IA de la plataforma genera el reporte usando el knowledge base completo de TOKAI + los datos del proyecto. Revisá y editá el resultado antes de enviarlo al cliente.'),

        placeholder:'# Reporte del Modelo de Negocio — [Nombre del Proyecto]\n\n## 1. Resumen ejecutivo\n...',
        style:ta}),
      h('div',{style:{display:'flex',gap:10,marginTop:12}},
        h('button',{className:'btn btn-primary',disabled:!importText.trim(),onClick:importReport},'Importar reporte'),
        h('button',{className:'btn btn-ghost btn-sm',onClick:()=>setMode('export')},'Cancelar'))),

            h('div',{style:{display:'flex',gap:8}},
              h('button',{className:'btn btn-ghost btn-sm',onClick:()=>{navigator.clipboard&&navigator.clipboard.writeText(reportMd);toast&&toast({title:'Copiado',msg:'Reporte copiado como Markdown'});}},
                'Copiar MD'),
              h('button',{className:'btn btn-primary btn-sm',
                onClick:()=>{if(chain.updateProject)chain.updateProject(pid,{businessReport:reportMd,reportSentToClient:true});toast&&toast({title:'Reporte enviado al cliente',msg:'El cliente puede revisarlo en su panel.'});},
              },'Enviar al cliente →')))),
        h('div',{style:{padding:'20px',borderRadius:12,background:'var(--black)',border:'1px solid var(--line-solid)',whiteSpace:'pre-wrap',fontSize:12.5,color:'var(--txt-dim)',lineHeight:1.7,fontFamily:'inherit',maxHeight:600,overflow:'auto'}},
          reportMd),
        h('textarea',{value:reportMd,rows:3,onChange:e=>{setReportMd(e.target.value);if(chain.updateProject)chain.updateProject(pid,{businessReport:e.target.value});},
          placeholder:'Editá el reporte si necesitás ajustes…',
          style:{...ta,marginTop:10}}))
      : h('div',{style:{textAlign:'center',padding:'32px',color:'var(--txt-mute)',fontSize:13}},
        'Todavía no hay reporte para este proyecto. Generalo con IA o importalo desde Claude.ai.')
    )
  );
}


/* Requisitos de pre-emisión de un proyecto. Fuente única para EmissionChecklist y para el
   despliegue del Motor de Emisión (que los informa al backend y exige reconocer los pendientes).
   ov: ediciones manuales aún sin guardar ({ docLegal, regimeManual }). */
function computeEmissionChecks(p, ov) {
  p = p || {}; ov = ov || {};
  const regimeKey  = resolveRegimeComplianceKey(p);
  const regimeRule = (typeof REGIME_COMPLIANCE_RULES !== 'undefined' && regimeKey) ? REGIME_COMPLIANCE_RULES[regimeKey] : null;
  const regimeAck  = regimeRule ? (p?.meta?.[regimeRule.ackSource] || {}) : {};
  const docLegal   = ov.docLegal !== undefined ? !!ov.docLegal : !!(p.docLegalConfirmado || (p.checklist && p.checklist.docLegalConfirmado));
  const regimeManual = {};
  if (regimeRule) regimeRule.items.filter(it=>it.type==='manual').forEach(it => {
    regimeManual[it.field] = (ov.regimeManual && ov.regimeManual[it.field] !== undefined)
      ? !!ov.regimeManual[it.field]
      : !!(p[it.field] || (p.checklist && p.checklist[it.field]));
  });

  /* Helpers del módulo KYC — disponibles globalmente desde views_kyc.js */
  const kycMode      = typeof resolveKycMode !== 'undefined' ? resolveKycMode(p) : 'psav';
  const psavOk       = typeof isPsavActive   !== 'undefined' ? isPsavActive(p)   : !!(p.psav && p.psavActivated);
  const activePsav   = typeof getActivePsav  !== 'undefined' ? getActivePsav(p)  : null;
  const psavLabel    = psavOk
    ? '✓ ' + (activePsav ? activePsav.name : p.psav||'PSAV') + ' activo · ' + (activePsav ? activePsav.categoryLabel : '')
    : kycMode === 'issuer'
      ? '✓ Modo emisor (soulbound sin régimen CNV) — no requiere PSAV'
      : '⚠ Sin PSAV activo — ir a Panel TOKAI → PSAV';
  const psavReqOk    = psavOk || kycMode === 'issuer';

  /* Evaluación automática de los 7 requisitos */
  const checks = [
    {
      id:'wizard',
      label:'Proyecto creado (wizard completado)',
      ok: !!(p.name && p.valuationUsd && p.maxSupply),
      auto: true,
      detail: p.name ? p.name+' · '+p.symbol+' · USD '+(p.valuationUsd||0).toLocaleString() : 'Pendiente',
    },
    {
      id:'tesis',
      label:'Tesis de valor confirmada por el cliente',
      ok: p.thesis?.estado === 'confirmada',
      auto: true,
      detail: p.thesis?.estado === 'confirmada' ? '✓ Confirmada el '+new Date(p.thesis.confirmedAt||0).toLocaleDateString('es-AR')
            : p.thesis?.estado === 'enviada'    ? '⏳ Enviada — esperando confirmación del cliente'
            : 'Pendiente',
    },
    {
      id:'reporte',
      label:'Reporte del modelo de negocio generado',
      ok: !!(p.businessReport),
      auto: true,
      detail: p.reportSentToClient ? '✓ Enviado al cliente' : p.businessReport ? '✓ Generado' : 'Pendiente',
    },
    {
      id:'params',
      label:'Parámetros técnicos del contrato configurados',
      ok: !!(p.emissionParams || p.emissionStatus === 'configured'),
      auto: true,
      detail: p.contractType ? p.contractType+(p.emissionParams?.yieldMechanism ? ' · Mec '+p.emissionParams.yieldMechanism : '') : 'Pendiente',
    },
    {
      id:'wallet',
      label:'Wallet del emisor vinculada (MetaMask)',
      ok: !!(p.issuerWallet),
      auto: true,
      detail: p.issuerWallet ? '0x…'+p.issuerWallet.slice(-6) : 'Pendiente — el emisor debe conectar MetaMask',
    },
    {
      id:'psav',
      label: kycMode === 'issuer' ? 'KYC: modo emisor (soulbound · sin PSAV)' : 'PSAV activado por TOKAI',
      ok:   psavReqOk,
      auto: true,
      detail: psavLabel,
      link: !psavReqOk ? 'psav' : null,  // sugiere ir al tab PSAV
    },
    {
      id:'docs',
      label:'Documentación legal cargada y aprobada',
      ok: docLegal || !!(p.pitch?.docs?.length > 0),
      auto: false,
      detail: p.pitch?.docs?.length > 0 ? p.pitch.docs.length+' documento(s) cargado(s)'
            : docLegal ? '✓ Aprobada manualmente por TOKAI'
            : 'Pendiente — cargar en Pitch del proyecto',
    },
    ...(regimeRule ? regimeRule.items.map(it => {
      const ok = it.type === 'wizard-ack' ? !!regimeAck[it.ackKey] : !!regimeManual[it.field];
      const label = typeof it.label === 'function' ? it.label({topeUva: regimeAck.topeUva}) : it.label;
      return {
        id: 'regime-'+it.id,
        label,
        ok,
        auto: it.type === 'wizard-ack',
        detail: ok ? '✓ '+it.okDetail : it.pendingDetail,
      };
    }) : []),
  ];
  return { checks, regimeRule, regimeAck, kycMode, psavOk, activePsav };
}

/* ════════════════════════════════════════════════════════════════════
   MÓDULO B · EmissionChecklist — requisitos de pre-emisión
   Req 6 (PSAV): lee isPsavActive(project) en lugar de input manual.
   Para soulbound/issuer-mode: el req 6 se cumple automáticamente.
   ════════════════════════════════════════════════════════════════════ */
function EmissionChecklist({chain, toast, pid:pidProp}) {
  const projects = chain.projects||[];
  let defaultIdx = 0;
  if (pidProp != null) {
    const foundIdx = projects.findIndex(x => x.id === pidProp || String(x.id) === String(pidProp));
    if (foundIdx !== -1) defaultIdx = foundIdx;
    else if (typeof pidProp === 'number' && pidProp < projects.length) defaultIdx = pidProp;
  }
  const [pid, setPid] = useState(defaultIdx);
  const p = projects[pid]||projects[0]||{};

  /* Único campo manual "fijo": fiduciario + docs. */
  const [fiduciario, setFiduciario] = useState(p.fiduciario || (p.checklist && p.checklist.fiduciario) || '');
  const [docLegal, setDocLegal]     = useState(!!(p.docLegalConfirmado || (p.checklist && p.checklist.docLegalConfirmado)));
  const [saved, setSaved]           = useState(false);

  /* Reglas de compliance adicionales del régimen del proyecto — dato, no lógica
     (ver window.REGIME_COMPLIANCE_RULES, ADR-020). Una resolución nueva se suma ahí,
     no acá: evita que la plataforma quede atada a un solo régimen/jurisdicción. */
  const regimeKey  = resolveRegimeComplianceKey(p); // misma lógica que callTokaiAgent/generateReport — ver resolveRegimeComplianceKey()
  const regimeRule = (typeof REGIME_COMPLIANCE_RULES !== 'undefined' && regimeKey) ? REGIME_COMPLIANCE_RULES[regimeKey] : null;
  const regimeAck  = regimeRule ? (p?.meta?.[regimeRule.ackSource] || {}) : {};
  const regimeManualItems = regimeRule ? regimeRule.items.filter(it=>it.type==='manual') : [];
  const [regimeManual, setRegimeManual] = useState(() => {
    const init = {};
    regimeManualItems.forEach(it => { init[it.field] = !!(p[it.field] || (p.checklist && p.checklist[it.field])); });
    return init;
  });

  useEffect(() => {
    setFiduciario(p.fiduciario || (p.checklist && p.checklist.fiduciario) || '');
    setDocLegal(!!(p.docLegalConfirmado || (p.checklist && p.checklist.docLegalConfirmado)));
    const nextManual = {};
    regimeManualItems.forEach(it => { nextManual[it.field] = !!(p[it.field] || (p.checklist && p.checklist[it.field])); });
    setRegimeManual(nextManual);
  }, [p && p.id]);

  const { checks, kycMode, psavOk, activePsav } = computeEmissionChecks(p, { docLegal, regimeManual });

  const allOk    = checks.every(c=>c.ok);
  const okCount  = checks.filter(c=>c.ok).length;
  const psavCheck = checks.find(c=>c.id==='psav');

  async function saveManual() {
    const targetId = p && p.id != null ? p.id : pid;
    if(chain.updateProject) {
      const mergedChecklist = Object.assign({}, p.checklist || {}, { fiduciario, docLegalConfirmado: docLegal }, regimeManual);
      const res = await chain.updateProject(targetId, { fiduciario, docLegalConfirmado: docLegal, ...regimeManual, checklist: mergedChecklist });
      if (res && res.ok === false) {
        toast && toast({ type:'err', title:'Error al guardar checklist', msg: res.reason || 'No se pudo guardar en el servidor.' });
        return;
      }
    }
    setSaved(true); setTimeout(()=>setSaved(false), 2000);
    toast&&toast({title:'Guardado', msg:'Checklist actualizado.'});
  }

  const fs = {width:'100%',padding:'8px 11px',borderRadius:8,border:'1px solid var(--line-solid)',background:'var(--black)',color:'var(--txt)',fontSize:12.5,boxSizing:'border-box'};

  return h('div',{},
    h('div',{className:'eyebrow'},'Panel TOKAI · Pre-emisión'),
    h('h1',{className:'page'},'Checklist de requisitos'),
    h('p',{className:'page-sub'},checks.length+' requisitos de pre-emisión'+(regimeRule?' ('+regimeRule.items.length+' propios de '+regimeRule.regimeLabel+')':'')+'. Los automáticos se verifican en tiempo real y el PSAV se gestiona desde su panel. Si al desplegar queda alguno pendiente, el Motor de Emisión pide confirmarlo explícitamente y lo registra en la auditoría del deploy.'),

    projects.length>1 && h('div',{style:{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}},
      projects.map((pr,i)=>h('button',{key:i,onClick:()=>setPid(i),
        style:{padding:'6px 12px',borderRadius:9,cursor:'pointer',fontSize:12,fontWeight:600,
          border:'1.5px solid '+(i===pid?'var(--emerald)':'var(--line-solid)'),
          background:i===pid?'rgba(0,214,126,.08)':'var(--panel)',color:i===pid?'var(--emerald)':'var(--txt)'}},pr.name))),

    /* Barra de progreso */
    h('div',{className:'card',style:{marginBottom:14}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}},
        h('div',{},
          h('div',{style:{fontWeight:700,fontSize:13}},p.name||'Proyecto'),
          kycMode === 'issuer'
            ? h('span',{style:{fontSize:10,padding:'2px 8px',borderRadius:10,background:'rgba(0,214,126,.12)',color:'var(--emerald)',border:'1px solid rgba(0,214,126,.25)',marginTop:4,display:'inline-block'}},'KYC modo Emisor (soulbound)')
            : activePsav ? h('span',{style:{fontSize:10,padding:'2px 8px',borderRadius:10,background:(activePsav.color||'#4DA8FF')+'18',color:(activePsav.color||'#4DA8FF'),border:'1px solid '+(activePsav.color||'#4DA8FF')+'30',marginTop:4,display:'inline-block'}},psavOk?'● '+activePsav.name+' activo':'PSAV no activado')
            : null),
        h('div',{style:{fontWeight:800,fontSize:18,color:allOk?'var(--emerald)':'#FFB23E'}},okCount+'/'+checks.length)),
      h('div',{style:{height:6,borderRadius:3,background:'rgba(255,255,255,.08)'}},
        h('div',{style:{height:'100%',borderRadius:3,width:Math.round((okCount/checks.length)*100)+'%',
          background:allOk?'var(--emerald)':'linear-gradient(90deg,#FFB23E,var(--emerald))',transition:'width .4s'}}))),

    /* Lista de requisitos */
    h('div',{style:{display:'flex',flexDirection:'column',gap:8,marginBottom:16}},
      checks.map((c,i)=>h('div',{key:c.id,style:{
        padding:'12px 14px',borderRadius:10,
        background:c.ok?'rgba(0,214,126,.05)':'rgba(255,255,255,.03)',
        border:'1px solid '+(c.ok?'rgba(0,214,126,.25)':'rgba(255,255,255,.07)'),
        display:'flex',gap:12,alignItems:'flex-start'
      }},
        h('div',{style:{width:24,height:24,borderRadius:'50%',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',
          background:c.ok?'var(--emerald)':'rgba(255,255,255,.08)',
          fontSize:12,fontWeight:700,color:c.ok?'#0A0A0A':'rgba(255,255,255,.3)',marginTop:1}},c.ok?'✓':i+1),
        h('div',{style:{flex:1}},
          h('div',{style:{fontSize:13,fontWeight:600,color:c.ok?'var(--txt)':'var(--txt-dim)',marginBottom:2}},c.label),
          h('div',{style:{fontSize:11,color:c.ok?'var(--emerald)':'var(--txt-mute)'}},c.detail),
          c.id==='psav'&&h('span',{style:{fontSize:9,color:'var(--txt-mute)',textTransform:'uppercase',letterSpacing:'.06em'}},'Automático · gestionar en Panel TOKAI → PSAV'),
          !c.auto&&c.id!=='psav'&&h('span',{style:{fontSize:9,color:'var(--txt-mute)',textTransform:'uppercase',letterSpacing:'.06em'}},'Manual · TOKAI'))))),

    /* Campo manual: solo fiduciario + docs */
    h('div',{className:'card',style:{marginBottom:14}},
      h('div',{style:{fontWeight:700,fontSize:13,marginBottom:12}},'Completar manualmente'),
      h('div',{style:{marginBottom:10}},
        h('label',{style:{fontSize:11,color:'var(--txt-mute)',display:'block',marginBottom:4}},'Fiduciario confirmado'),
        h('input',{value:fiduciario,onChange:e=>setFiduciario(e.target.value),placeholder:'Ej: Allaria Ledesma',style:fs})),
      h('label',{style:{display:'flex',gap:10,alignItems:'center',cursor:'pointer',marginBottom:12,fontSize:13,color:'var(--txt-dim)'}},
        h('input',{type:'checkbox',checked:docLegal,onChange:e=>setDocLegal(e.target.checked),style:{width:16,height:16,accentColor:'var(--emerald)'}}),
        'Documentación legal revisada y aprobada por TOKAI'),
      regimeManualItems.map(it => h('label',{key:it.field,style:{display:'flex',gap:10,alignItems:'center',cursor:'pointer',marginBottom:12,fontSize:13,color:'var(--txt-dim)'}},
        h('input',{type:'checkbox',checked:!!regimeManual[it.field],
          onChange:e=>setRegimeManual(prev=>({...prev,[it.field]:e.target.checked})),
          style:{width:16,height:16,accentColor:'var(--emerald)'}}),
        (typeof it.label==='function' ? it.label({topeUva:regimeAck.topeUva}) : it.label))),
      h('div',{style:{padding:'10px 12px',borderRadius:8,background:'rgba(77,168,255,.06)',border:'1px solid rgba(77,168,255,.15)',fontSize:11.5,color:'var(--txt-dim)',marginBottom:12}},
        '🔒 El PSAV ya no se confirma aquí. Ir a ',h('b',{},'Panel TOKAI → PSAV'),' para seleccionar y activar el proveedor de KYC de este proyecto.'),
      h('button',{className:'btn btn-ghost btn-sm',onClick:saveManual},saved?'✓ Guardado':'Guardar')),

    /* Gate */
    allOk
      ? h('div',{style:{padding:'16px',borderRadius:12,background:'rgba(0,214,126,.06)',border:'1px solid rgba(0,214,126,.3)'}},
          h('div',{style:{fontWeight:700,fontSize:14,color:'var(--emerald)',marginBottom:6}},'✅ Todos los requisitos cumplidos'),
          h('div',{style:{fontSize:12.5,color:'var(--txt-dim)',marginBottom:12}},'Podés activar el gate de emisión. El cliente podrá mintear tokens a inversores con KYC.'),
          h('div',{style:{fontSize:11,color:'var(--txt-mute)'}},'→ Ir al Motor de Emisión y hacer click en "⚡ Habilitar serie 0"'))
      : h('div',{style:{padding:'14px',borderRadius:10,background:'rgba(255,178,62,.06)',border:'1px solid rgba(255,178,62,.25)',fontSize:12.5,color:'var(--txt-dim)'}},
          '⏳ Faltan '+(checks.length-okCount)+' requisito(s). Completalos para habilitar la emisión.')
  );
}

/* Definición de las 7 etapas del flujo */
const FLOW_STAGES = [
  { id:1, key:'alta',        label:'Alta del proyecto',      short:'Alta',       icon:'M12 5v14M5 12h14',                                     desc:'El emisor crea el proyecto en el wizard de 5 pasos.' },

/* Calcula la etapa actual de un proyecto */
function getProjectStage(p) {
  if (!p) return 0;
  // Etapa 7: en distribución activa
  if (p.emissionEnabled?.[0] && (p.totalSupply||0) > 0) return 7;
  // Etapa 6: gate habilitado
  if (p.emissionEnabled?.[0]) return 6;
  // Etapa 5: contrato configurado
  if (p.emissionStatus === 'configured' || p.emissionParams) return 5;
  // Etapa 4: reporte del modelo generado
  if (p.businessReport || p.reportSentToClient) return 4;
  // Etapa 3: tesis confirmada o en proceso
  if (p.thesis?.estado === 'confirmada') return 3;
  if (p.thesis?.estado === 'enviada' || p.thesis?.estado === 'borrador') return 3;
  // Etapa 2: TOKAI tomó el proyecto (ronda >= 2)
  if (p.ronda >= 2) return 2;
  // Etapa 1: proyecto creado
  if (p.name) return 1;
  return 0;
}

/* ─── FlowProgress: stepper horizontal ─── */
function FlowProgress({project, compact=false}) {
  const currentStage = getProjectStage(project);
  const [expanded, setExpanded] = useState(false);

  const stageColor = (id) => {
    if (id < currentStage) return 'var(--emerald)';
    if (id === currentStage) return '#4DA8FF';
    return 'rgba(255,255,255,.15)';
  };

  if (!project) return null;

  /* Versión compacta: una línea con el estado actual */
  if (compact) {
    const cur = FLOW_STAGES[currentStage-1] || FLOW_STAGES[0];
    const pct = Math.round((currentStage/7)*100);
    return h('div',{style:{marginBottom:14}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}},

  return h('div',{style:{marginBottom:20}},

      FLOW_STAGES.map((stage, idx) => h('div',{key:stage.id,style:{display:'flex',alignItems:'center',flex:idx<6?1:'none'}},

        h('div',{style:{position:'relative',flexShrink:0},title:stage.label},
          h('div',{style:{
            width: stage.id===currentStage ? 32 : 24,
            height: stage.id===currentStage ? 32 : 24,
            borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center',
            background: stage.id < currentStage ? 'var(--emerald)' : stage.id===currentStage ? 'rgba(77,168,255,.2)' : 'rgba(255,255,255,.06)',
            border: '2px solid '+ stageColor(stage.id),
            transition:'all .2s', cursor:'default', zIndex:1, position:'relative'
          }},
            stage.id < currentStage
              ? h('svg',{viewBox:'0 0 24 24',fill:'none',stroke:'#0A0A0A',strokeWidth:3,style:{width:12,height:12}},h('path',{d:'M5 12l5 5L19 7',strokeLinecap:'round',strokeLinejoin:'round'}))
              : h('span',{style:{fontSize:stage.id===currentStage?11:9,fontWeight:700,color:stageColor(stage.id)}},stage.id))),
        /* línea conectora */
        idx < 6 && h('div',{style:{
          flex:1, height:2,
          background: stage.id < currentStage ? 'var(--emerald)' : 'rgba(255,255,255,.08)',
          transition:'background .3s'
        }})
      ))),

    /* etiquetas */
    h('div',{style:{display:'flex',gap:0}},
      FLOW_STAGES.map((stage,idx)=>h('div',{key:stage.id,style:{
        flex:idx<6?1:'none', textAlign:'center',
        fontSize:9, lineHeight:1.3, paddingRight:idx<6?0:0,
        color: stage.id === currentStage ? '#4DA8FF' : stage.id < currentStage ? 'var(--emerald)' : 'rgba(255,255,255,.3)',
        fontWeight: stage.id === currentStage ? 700 : 400,
        cursor:'pointer', transition:'color .2s'
      }, onClick:()=>setExpanded(e=>e===stage.id?null:stage.id)},stage.short))),

    /* descripción expandible de la etapa actual o la que se clickeó */
    (expanded || currentStage) && h('div',{style:{
      marginTop:10, padding:'10px 14px', borderRadius:9,
      background:'rgba(77,168,255,.06)', border:'1px solid rgba(77,168,255,.2)',

}
