/* ─── Helper global: descarga CSV client-side ─── */
function downloadCsv(filename, header, rows){
  var esc = function(v){ v = v==null?'':String(v); return /[",\n;]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  var csv = [header.map(esc).join(',')].concat(rows.map(function(r){ return r.map(esc).join(','); })).join('\r\n');
  var blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}

/* ════════════════════════════════════════════════════════════════════
   InvestorOnboardingCard — KYC real + suscripción con fondeo offline
   Consume POST /kyc, GET /kyc/status y POST /invest del backend.
   Visible solo con API configurada y proyecto real (UUID).
   ════════════════════════════════════════════════════════════════════ */
function InvestorOnboardingCard({project, wallet, toast}){
  var API = window.__API_URL__ || '';
  var walletAddr = /^0x[0-9a-fA-F]{40}$/.test((wallet&&wallet.addr)||'') ? wallet.addr : null;
  var [email,setEmail] = useState('');
  var [kycStatus,setKycStatus] = useState(null); // null|none|pending|approved|rejected
  var [busy,setBusy] = useState(false);
  var [qty,setQty] = useState(10);
  var [method,setMethod] = useState('usdc_polygon');
  var [reference,setReference] = useState('');
  var [cuit,setCuit] = useState('');
  var [cbuCvu,setCbuCvu] = useState('');
  var [order,setOrder] = useState(null);
  var priceUsd = (project.priceUsdCents||0)/100;
  var emailOk = /^[^@]+@[^@]+\.[^@]+$/.test(email.trim());
  var selMethod = PAYMENT_METHODS.find(function(m){ return m.id===method; }) || PAYMENT_METHODS[0];
  // RG 1166/2026: transferencia y Mercado Pago exigen CUIT + CBU/CVU del titular
  // para acreditar/rescatar fondos — cripto (usdc_polygon, ripio, lemon, binance) no.
  var isBankMethod = method==='transferencia' || method==='mercadopago';
  var cuitOk = /^\d{11}$/.test(cuit.replace(/\D/g,''));
  var cbuCvuOk = /^\d{22}$/.test(cbuCvu.replace(/\D/g,''));

  function checkStatus(){
    if(!API||!emailOk) return;
    var url = API+'/kyc/status?email='+encodeURIComponent(email.trim().toLowerCase())+(walletAddr?'&wallet='+walletAddr:'');
    fetch(url).then(function(r){ return r.ok?r.json():Promise.reject(); })
      .then(function(d){ setKycStatus(d.status); })
      .catch(function(){});
  }
  function startKyc(){
    if(!API||!emailOk){ toast&&toast({type:'err',title:'Email requerido',msg:'Ingresá un email válido.'}); return; }
    setBusy(true);
    var body = { email: email.trim().toLowerCase() };
    if(walletAddr) body.wallet_address = walletAddr;
    fetch(API+'/kyc', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){ return r.ok?r.json():r.json().then(function(e){ return Promise.reject(e); }); })
      .then(function(d){ setKycStatus(d.status); toast&&toast({title:'Verificación iniciada',msg:d.message||'Solicitud registrada.'}); })
      .catch(function(e){ toast&&toast({type:'err',title:'Error',msg:(e&&e.error)||'No se pudo iniciar la verificación.'}); })
      .finally(function(){ setBusy(false); });
  }
  function subscribe(){
    if(!API||!emailOk){ toast&&toast({type:'err',title:'Email requerido',msg:'Ingresá un email válido.'}); return; }
    if(!(Number(qty)>0)){ toast&&toast({type:'err',title:'Cantidad inválida',msg:'Ingresá una cantidad mayor a cero.'}); return; }
    if(isBankMethod && (!cuitOk||!cbuCvuOk)){ toast&&toast({type:'err',title:'Datos bancarios requeridos',msg:'Transferencia y Mercado Pago exigen CUIT y CBU/CVU del titular (RG 1166/2026).'}); return; }
    setBusy(true);
    var body = { projectId: project.id, email: email.trim().toLowerCase(), qty: Number(qty), method: method };
    if(walletAddr) body.wallet_address = walletAddr;
    if(reference.trim()) body.reference = reference.trim();
    if(isBankMethod){ body.cuit = cuit.replace(/\D/g,''); body.cbu_cvu = cbuCvu.replace(/\D/g,''); }
    fetch(API+'/invest', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){ return r.ok?r.json():r.json().then(function(e){ return Promise.reject(e); }); })
      .then(function(d){ setOrder(d); toast&&toast({title:'Orden registrada',msg:d.message||'TOKAI confirmará tu fondeo.'}); })
      .catch(function(e){ toast&&toast({type:'err',title:'Error',msg:(e&&e.error)||'No se pudo registrar la orden.'}); })
      .finally(function(){ setBusy(false); });
  }

  var inp = {width:'100%',padding:'9px 12px',borderRadius:8,border:'1px solid var(--line-solid)',background:'var(--black)',color:'var(--txt)',fontSize:12.5,boxSizing:'border-box'};
  var kycBadge = kycStatus==='approved' ? {t:'KYC APROBADO',bg:'rgba(0,214,126,.15)',c:'var(--emerald)'}
    : kycStatus==='pending' ? {t:'KYC EN REVISIÓN',bg:'rgba(255,178,62,.15)',c:'#FFB23E'}
    : kycStatus==='rejected' ? {t:'KYC RECHAZADO',bg:'rgba(255,92,92,.15)',c:'#FF5C5C'}
    : null;

  return h('div',{className:'card',style:{marginBottom:18,border:'1.5px solid rgba(0,214,126,.25)'}},
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,flexWrap:'wrap',gap:8}},
      h('div',{},
        h('div',{style:{fontWeight:700,fontSize:14}},'Suscripción real · '+project.symbol),
        h('div',{style:{fontSize:11,color:'var(--txt-mute)'}},'Verificación KYC + fondeo offline (RG 1088). TOKAI confirma y habilita tu wallet en la whitelist on-chain.')),
      kycBadge&&h('span',{style:{padding:'3px 10px',borderRadius:9,fontSize:10,fontWeight:800,background:kycBadge.bg,color:kycBadge.c}},kycBadge.t)),
    order
      ? h('div',{style:{padding:'16px',borderRadius:10,background:'rgba(0,214,126,.06)',border:'1px solid rgba(0,214,126,.3)'}},
          h('div',{style:{fontWeight:700,fontSize:14,color:'var(--emerald)',marginBottom:6}},'✅ Orden '+order.id.slice(0,8)+'… registrada'),
          h('div',{style:{fontSize:12.5,color:'var(--txt-dim)',lineHeight:1.6,marginBottom:8}},
            'Total estimado: '+(order.amount_usd?'USD '+order.amount_usd:'a confirmar')+'. Ahora realizá el fondeo:'),
          selMethod.steps.map(function(s,i){ return h('div',{key:i,style:{fontSize:12,color:'var(--txt-dim)',marginBottom:4}},'  '+(i+1)+'. '+s); }),
          h('div',{style:{fontSize:11,color:'var(--txt-mute)',marginTop:8}},'Cuando TOKAI acredite los fondos, tu wallet queda en la whitelist para recibir los tokens.'))
      : h('div',{},
          h('div',{style:{display:'grid',gridTemplateColumns:'2fr 1fr',gap:10,marginBottom:10}},
            h('div',{},
              h('label',{style:{fontSize:11,color:'var(--txt-mute)',display:'block',marginBottom:4}},'Tu email *'),
              h('input',{style:inp,type:'email',value:email,placeholder:'inversor@email.com',
                onChange:function(e){ setEmail(e.target.value); setKycStatus(null); },
                onBlur:checkStatus})),
            h('div',{},
              h('label',{style:{fontSize:11,color:'var(--txt-mute)',display:'block',marginBottom:4}},'Wallet'),
              h('div',{style:Object.assign({},inp,{color:walletAddr?'var(--emerald)':'var(--txt-mute)',fontFamily:'var(--mono)',fontSize:11,paddingTop:11})},
                walletAddr?short(walletAddr):'— conectá MetaMask —'))),
          (kycStatus===null||kycStatus==='none'||kycStatus==='rejected')&&h('button',{className:'btn btn-ghost btn-sm',style:{marginBottom:12},disabled:busy||!emailOk,onClick:startKyc},
            busy?'…':'① Iniciar verificación KYC'),
          h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:10}},
            h('div',{},
              h('label',{style:{fontSize:11,color:'var(--txt-mute)',display:'block',marginBottom:4}},'Cantidad de tokens'),
              h('input',{style:inp,type:'number',min:1,value:qty,onChange:function(e){ setQty(e.target.value); }})),
            h('div',{},
              h('label',{style:{fontSize:11,color:'var(--txt-mute)',display:'block',marginBottom:4}},'Método de fondeo'),
              h('select',{style:inp,value:method,onChange:function(e){ setMethod(e.target.value); }},
                PAYMENT_METHODS.map(function(m){ return h('option',{key:m.id,value:m.id},m.label); }))),
            h('div',{},
              h('label',{style:{fontSize:11,color:'var(--txt-mute)',display:'block',marginBottom:4}},'Total estimado'),
              h('div',{style:Object.assign({},inp,{fontWeight:700,color:'var(--emerald)'})},priceUsd?'USD '+fmt(priceUsd*Number(qty||0)):'—'))),
          isBankMethod&&h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}},
            h('div',{},
              h('label',{style:{fontSize:11,color:'var(--txt-mute)',display:'block',marginBottom:4}},'CUIT del titular *'),
              h('input',{style:Object.assign({},inp,cuit&&!cuitOk?{borderColor:'#FF5C5C'}:{}),value:cuit,placeholder:'20-XXXXXXXX-X',
                onChange:function(e){ setCuit(e.target.value); }})),
            h('div',{},
              h('label',{style:{fontSize:11,color:'var(--txt-mute)',display:'block',marginBottom:4}},'CBU / CVU del titular *'),
              h('input',{style:Object.assign({},inp,cbuCvu&&!cbuCvuOk?{borderColor:'#FF5C5C'}:{}),value:cbuCvu,placeholder:'22 dígitos',
                onChange:function(e){ setCbuCvu(e.target.value); }}))),
          isBankMethod&&h('div',{style:{fontSize:10.5,color:'var(--txt-mute)',marginBottom:10,lineHeight:1.5}},
            'Requerido por RG 1166/2026: los fondos solo pueden acreditarse desde una cuenta a la vista o CVU asociado a tu propio CUIT.'),
          h('div',{style:{marginBottom:12}},
            h('label',{style:{fontSize:11,color:'var(--txt-mute)',display:'block',marginBottom:4}},'Referencia / comprobante (opcional)'),
            h('input',{style:inp,value:reference,placeholder:'Hash de tx, ID de transferencia…',onChange:function(e){ setReference(e.target.value); }})),
          h('button',{className:'btn btn-primary',style:{width:'100%'},disabled:busy||!emailOk||(isBankMethod&&(!cuitOk||!cbuCvuOk)),onClick:subscribe},
            busy?'Enviando…':'② Registrar orden de suscripción →')));
}

/* ─── useGeofencingBlocklist: blocklist global de TOKAI, persistida ──────
   Antes vivía solo en memoria de useChain() (se perdía al recargar) y no
   existía en absoluto en modo Real — useChainWeb3 (tokai-web3.js) no
   implementa blockedJurisdictions, así que chain.blockedJurisdictions.includes
   revienta con "Cannot read properties of undefined" en modo Real. Esta capa
   es independiente de chain/useChainWeb3 e igual en demo y en real. */
/**
 * Hook que expone la lista de jurisdicciones bloqueadas por TOKAI.
 * En modo demo (sin __API_URL__) retorna [840] como fallback.
 * En modo real carga desde GET /geofencing y actualiza si cambia el backend.
 * @returns {number[]} Códigos ISO 3166-1 numéricos de jurisdicciones bloqueadas
 */
function useGeofencingBlocklist(){
  var [blocked, setBlocked] = useState([840]); // fallback razonable si no hay API
  useEffect(function(){
    var API = window.__API_URL__;
    if(!API) return; // demo sin backend: se mantiene el fallback
    var cancelled = false;
    fetch(API + '/geofencing')
      .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
      .then(function(d){ if(!cancelled) setBlocked(d.blockedJurisdictions || []); })
      .catch(function(){});
    return function(){ cancelled = true; };
  }, []);
  return blocked;
}

function InvestView({chain,wallet,projectId,toast}){
  const userJur = (chain.identities[wallet.addr]?.jur) || wallet.jur;
  const blockedJurisdictions = useGeofencingBlocklist();
  const globallyBlocked = blockedJurisdictions.includes(userJur);
  // Todos los hooks de este componente se declaran acá arriba, antes de
  // cualquier return condicional: deben llamarse siempre en el mismo orden en
  // cada render de esta instancia, incluso cuando isGeofenced cambia (ej. al
  // cambiar de wallet/jurisdicción sin desmontar el componente) — de lo
  // contrario React tira "Rendered fewer hooks than expected" (error #300).
  const [onChainDisallowed,setOnChainDisallowed] = useState(false);
  const [pid,setPid]=useState(projectId!=null?projectId:(chain.projects[0]?chain.projects[0].id:0));
  const [step,setStep]=useState(0); // 0 select, 1 kyc, 2 fund, 3 buy, 4 done
  const [amount,setAmount]=useState(1);
  const gate=useGate();
  const p=chain.projects.find(x=>String(x.id)===String(pid))||chain.projects[0]||{symbol:'—',regime:'—',jurisdictions:[],priceUsdCents:0};
  const rpid=p.id;
  const id=chain.identities[wallet.addr];
  const verified=id&&id.verified;
  const myBal=chain.bal(rpid,wallet.addr);

  // Sincronización de geofencing: además del blocklist global de gobernanza
  // TOKAI, se consulta el allowlist on-chain del token específico
  // (TOKAIToken.isJurisdictionAllowed). Bloquea si cualquiera de las dos capas
  // lo hace — nunca se confía solo en el chequeo del cliente para el gate real.
  useEffect(function(){
    let cancelled = false;
    if (p.token && userJur != null && chain.isJurisdictionAllowedOnChain) {
      chain.isJurisdictionAllowedOnChain(p.token, userJur).then(function(allowed){
        if (!cancelled) setOnChainDisallowed(allowed === false);
      });
    } else { setOnChainDisallowed(false); }
    return function(){ cancelled = true; };
  }, [p.token, userJur]);
  const isGeofenced = globallyBlocked || onChainDisallowed;

  useEffect(()=>{ if(projectId!=null) setPid(projectId); },[projectId]);
  /* Si los proyectos llegan del backend después del primer render, seleccionar el primero */
  useEffect(()=>{ if(chain.projects.length && !chain.projects.some(x=>String(x.id)===String(pid))) setPid(chain.projects[0].id); },[chain.projects]);

  // determine current step from state, checking if projectId is explicitly passed
  useEffect(()=>{
    if (projectId != null) {
      setStep(verified ? (myBal > 0 ? 4 : 2) : 1);
    } else {
      setStep(verified ? (myBal > 0 ? 4 : 2) : 0);
    }
  },[verified, pid, projectId]);

  if (wallet.role !== 'admin' && isGeofenced) {
    return h(GeofencingRestrictedScreen, {userJur, toast, onBack: function(){ window.location.hash = '#/dash'; }});
  }

  const steps=['Proyecto','Verificación KYC','Fondeo','Suscripción'];
  function doKyc(jur,cat){
    chain.registerIdentity(wallet.addr,jur,cat);
    toast({title:'KYC verificado',msg:`${JUR[jur]} · ${CAT[cat]} registrado en IdentityRegistry`,hash:txHash()});
    setStep(2);
  }
  function doBuy(){
    const checks=chain.canTransfer(rpid,null,wallet.addr,amount).checks;
    gate.run(checks,(ok)=>{
      if(ok){
        const r=chain.mint(rpid,wallet.addr,amount);
        if(r.ok){toast({title:'Suscripción exitosa',msg:`${amount} ${p.symbol} emitidos a tu wallet`,hash:txHash()});setStep(4);}
      } else {
        toast({type:'err',title:'Suscripción bloqueada',msg:'El contrato rechazó la operación por compliance'});
      }
    });
  }

  return h('div',{},
    h('div',{className:'eyebrow'},'Portal del inversor'),
    h('h1',{className:'page'},'Suscribir tokens'),
    h('p',{className:'page-sub'},'Flujo completo de onboarding: seleccioná el proyecto, verificá tu identidad una sola vez, fondeá tu wallet y suscribí. El motor de compliance valida cada paso.'),
    /* Suscripción real (KYC + fondeo offline) — solo con backend y proyecto real */
    window.__API_URL__&&p&&typeof p.id==='string'&&p.id.length===36&&h(InvestorOnboardingCard,{project:p,wallet,toast}),
    // stepper
    h('div',{className:'stepper'},steps.map((s,i)=>h('div',{key:i,className:'step '+(step>i?'done':step===i?'active':'')},
      h('div',{className:'step-bar'}),
      h('div',{className:'step-label'},h('span',{className:'step-num'},step>i?'✓':i+1),s)))),

    h('div',{className:'row'},
      h('div',{style:{flex:'1 1 60%'}},
        // STEP 0: select project
        /* Sin proyectos en colocación: explicarlo en vez de mostrar un selector vacío */
        step===0&&chain.projects.length===0&&h('div',{className:'card',role:'status',style:{textAlign:'center',padding:'36px 24px'}},
          h('div',{'aria-hidden':'true',style:{fontSize:26,color:'var(--emerald)',marginBottom:10}},'◈'),
          h('h3',{style:{fontSize:16,fontWeight:700,marginBottom:8}},'Todavía no hay proyectos abiertos a suscripción'),
          h('p',{style:{fontSize:13,color:'var(--txt-dim)',lineHeight:1.6,maxWidth:440,margin:'0 auto'}},'Cuando TOKAI habilite la colocación de un proyecto, aparece acá. Mientras tanto podés vincular tu wallet en «Mi cartera» y consultar la «Guía de uso».')),
        step===0&&chain.projects.length>0&&h('div',{className:'card'},
          h('h3',{style:{fontSize:15,fontWeight:700,marginBottom:14}},'Elegí un proyecto'),
          h('div',{className:'field'},h('label',{},'Proyecto'),
            h('select',{value:String(pid),onChange:e=>setPid(e.target.value)},
              chain.projects.map(x=>h('option',{key:x.id,value:String(x.id)},`${x.name} (${x.symbol})`)))),
          h('div',{style:{marginTop:8}},
            h('div',{className:'kv'},h('span',{className:'k'},'Régimen'),h('span',{className:'v'},p.regime)),
            h('div',{className:'kv'},h('span',{className:'k'},'Precio por token'),h('span',{className:'v'},p.priceUsdCents?fmtUsd(p.priceUsdCents):'—')),
            h('div',{className:'kv'},h('span',{className:'k'},'Jurisdicciones'),h('span',{className:'v'},p.jurisdictions.map(j=>JUR[j].split(' ')[0]).join(' '))),
            h('div',{className:'kv'},h('span',{className:'k'},'Transferibilidad'),h('span',{className:'v'},p.soulbound?'Soulbound':p.lockupDays?`Lock-up ${p.lockupDays}d`:'Libre (KYC)'))),
          h('button',{className:'btn btn-primary',style:{marginTop:16,width:'100%'},onClick:()=>setStep(verified?2:1)},'Continuar',h(Icon,{d:I.arrow,style:{width:15,height:15}}))
        ),
        // STEP 1: KYC — modo detectado automáticamente (PSAV / Emisor / Demo)
        step===1&&h('div',{},
          h(KycGate,{project:p, walletAddr:wallet.addr, chain, toast,
            onComplete:()=>setStep(2)})
        ),
        // STEP 2: Fund
        step===2&&h('div',{className:'card'},
          h('h3',{style:{fontSize:15,fontWeight:700,marginBottom:6}},'Fondeá tu wallet'),
          h('p',{className:'muted',style:{fontSize:12.5,marginBottom:16}},'Múltiples rieles de fondeo. El capital se convierte a stablecoin (USDC) custodiada en PSAV Categoría 4 con proof-of-reserves auditable.'),
          h('div',{className:'grid',style:{gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:16}},
            ['Transferencia bancaria','Stablecoin (USDC)','Tarjeta déb/créd','Mercado Pago'].map(m=>
              h('div',{key:m,className:'card',style:{padding:'13px',textAlign:'center',fontSize:12.5,fontWeight:600,cursor:'pointer'},
                onClick:()=>{toast({title:'Wallet fondeada',msg:m+' acreditado en USDC'});setStep(3);}},
                h(Icon,{d:I.wallet,style:{width:18,height:18,margin:'0 auto 7px',color:'var(--emerald)'}}),m))),
        ),
        // STEP 3: Buy
        step===3&&h('div',{className:'card'},
          h('h3',{style:{fontSize:15,fontWeight:700,marginBottom:14}},'Suscribir '+p.symbol),
          h('div',{className:'field'},h('label',{},'Cantidad de tokens'),
            h('input',{type:'number',min:1,value:amount,onChange:e=>setAmount(Math.max(1,+e.target.value||1))}),
            p.priceUsdCents&&h('div',{className:'hint'},'Total: '+fmtUsd(p.priceUsdCents*amount))),
          h('button',{className:'btn btn-primary',style:{width:'100%'},disabled:gate.running,onClick:doBuy},
            gate.running?'Verificando compliance…':'Suscribir '+amount+' '+p.symbol),
        ),
        // STEP 4: Done
        step===4&&h('div',{className:'card',style:{textAlign:'center',padding:'36px 24px'}},
          h('div',{className:'check-icon pass',style:{width:54,height:54,margin:'0 auto 16px',borderRadius:14}},h(Icon,{d:I.check,style:{width:28,height:28}})),
          h('h3',{style:{fontSize:18,fontWeight:800,marginBottom:6}},'Sos holder de '+p.symbol),
          h('p',{className:'muted',style:{fontSize:13,marginBottom:18}},'Tenés '+myBal+' '+p.symbol+' en tu wallet. Podés ver tu posición, reclamar yield y operar en el mercado secundario.'),

/* ── Helper para filtrar proyectos por emisor (aislamiento multi-tenant emisor) ── */
function getIssuerProjects(projects, auth, wallet) {
  if (!projects || !Array.isArray(projects)) return [];
  // Admins y Supervisión TOKAI ven la totalidad del catálogo
  if (auth && (auth.isAdmin || auth.role === 'admin' || auth.role === 'tokai')) return projects;
  
  const email = (auth && auth.email) || '';
  const userId = (auth && (auth.sub || auth.user_id || auth.id)) || '';
  const walletAddr = (wallet && wallet.addr) ? wallet.addr.toLowerCase() : '';

  const matched = projects.filter(p => {
    if (email && p.issuer_email && p.issuer_email.toLowerCase() === email.toLowerCase()) return true;
    if (userId && (p.ownerId || p.owner_id || p.issuer_id) && String(p.ownerId || p.owner_id || p.issuer_id) === String(userId)) return true;
    if (walletAddr && p.issuerWallet && p.issuerWallet.toLowerCase() === walletAddr) return true;
    return false;
  });

  if (matched.length > 0) return matched;

  return [];
}

/* Toast para errores de POST /admin/invest/:id/auto-mint (ADR-024). Distingue los casos en que el
   mint YA ocurrió o pudo ocurrir (advertencia: no reintentar) de los rechazos sin tx on-chain. */
function autoMintErrorToast(d){
  d = d || {};
  const hash = (d.execution && d.execution.mintTxHash) || (d.details && d.details.mintTxHash) || undefined;
  if (d.code === 'mint_onchain_not_persisted')
    return { type:'warn', title:'Mint ejecutado — registro pendiente', msg:(d.error||'')+' TOKAI debe reconciliar la orden con el tx hash.', hash };
  if (d.code === 'auto_mint_pending_reconciliation')
    return { type:'warn', title:'Auto-mint bloqueado hasta reconciliar', msg:d.error||'Hay un auto-mint previo sin resultado registrado.' };
  if (d.code === 'mint_tx_unconfirmed')
    return { type:'warn', title:'Mint enviado sin confirmar', msg:d.error||'Verificá el tx hash antes de reintentar.', hash };
  if (d.code === 'emission_not_enabled')
    return { type:'err', title:'Emisión deshabilitada on-chain', msg:d.error||'TOKAI debe completar la configuración y habilitar la emisión.' };
  if (d.code === 'not_eligible' && Array.isArray(d.reasons) && d.reasons.length)
    return { type:'err', title:'Orden no elegible', msg:d.reasons.map(r=>r.message||r.code).join(' · ') };
  return { type:'err', title:'Auto-Mint bloqueado', msg:(d.error||'Verificá KYC/elegibilidad o configuración del Relayer')+(d.retrySafe?' (podés reintentar).':'') };
}

function AdminMint({chain,toast,auth}){
  const [pid,setPid]=useState(chain.projects[0]?chain.projects[0].id:0);
  const [mode,setMode]=useState('custom'); // 'order' | 'custom' | 'demo'
  const [target,setTarget]=useState(DEMO_WALLETS[1].addr);
  const [customWallet,setCustomWallet]=useState('');
  // Sin preselección: jurisdicción y categoría del inversor se setean explícitamente (no hardcodear AR).
  const [customJur,setCustomJur]=useState('');
  const [customCat,setCustomCat]=useState('');
  const [amount,setAmount]=useState(10);
  const [investOrders,setInvestOrders]=useState([]);
  const [selectedOrderId,setSelectedOrderId]=useState('');
  const [autoMinting,setAutoMinting]=useState(false);
  const gate=useGate();
  /* Comparación por String: los proyectos reales usan UUID, los demo id numérico */
  const p=chain.projects.find(x=>String(x.id)===String(pid))||chain.projects[0]||{symbol:'—',id:pid};
  const rpid=p.id;
  const API = window.__API_URL__ || '';

  useEffect(()=>{
    if(!API || !rpid || String(rpid).length !== 36) { setInvestOrders([]); return; }
    const url = (auth && (auth.isAdmin || auth.role === 'tokai' || auth.role === 'admin'))
      ? (API + '/admin/invest')
      : (API + '/projects/' + rpid + '/investors');
    fetch(url, { credentials:'include' })
      .then(r=>r.ok?r.json():Promise.reject())
      .then(d=>{
        const list = d.orders || d.data || [];
        const rows = list.filter(o=>String(o.project_id)===String(rpid) && o.status!=='completed' && o.status!=='rejected');
        setInvestOrders(rows);
        if(rows[0]) { setSelectedOrderId(rows[0].id); setMode('order'); }
      })
      .catch(()=>{ setInvestOrders([]); });
  }, [rpid]);

  function ensureKyc(addr, jurOverride, catOverride){
    const w=DEMO_WALLETS.find(x=>x.addr===addr);
    const jur = jurOverride || (w ? w.jur : null);
    const cat = catOverride || (w ? w.cat : null);
    if(!jur || !cat) return false;
    if((!w || w.role!=='admin') && !chain.identities[addr]) {
      chain.registerIdentity(addr, Number(jur), Number(cat));
    }
  }

  async function runAutoMintOrder(){
    if(!API || !selectedOrderId) return;
    setAutoMinting(true);
    try {
      const res = await fetch(`${API}/admin/invest/${selectedOrderId}/auto-mint`, {
        method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body:JSON.stringify({})
      });
      const d = await res.json().catch(()=>({}));
      if(res.ok && d.ok){
        toast({title:'Auto-Mint Desatendido Exitoso',msg:`Orden completada: ${d.execution?.amountUnits||''} ${p.symbol} → ${short(d.execution?.wallet||'')}`,hash:d.execution?.mintTxHash});
        setInvestOrders(prev=>prev.filter(x=>x.id!==selectedOrderId));
        if(chain.refresh) chain.refresh();
      } else {
        const t = autoMintErrorToast(d);
        toast(t);
      }
    } catch(e){
      // El backend pudo haber minteado igual; su marcador anti doble mint bloquea un reintento ciego.
      toast({type:'warn',title:'Resultado sin confirmar',msg:'Se cortó la conexión con el backend. Revisá el estado de la orden antes de reintentar ('+e.message+').'});
    } finally { setAutoMinting(false); }
  }

  function mint(){
    const dest = mode==='custom' ? customWallet.trim() : target;
    if(!/^0x[0-9a-fA-F]{40}$/.test(dest)){
      toast({type:'err',title:'Wallet inválida',msg:'Ingresá una dirección EVM válida (0x + 40 caracteres hex).'});
      return;
    }
    const w=DEMO_WALLETS.find(x=>x.addr===dest);
    if(mode==='custom' && (!customJur || !customCat)){
      toast({type:'err',title:'Faltan datos del inversor',msg:'Seteá la jurisdicción (ISO) y la categoría KYC antes de emitir.'});
      return;
    }
    if(mode==='demo' && w && w.label.includes('sin KYC')){}
    else ensureKyc(dest, mode==='custom'?customJur:undefined, mode==='custom'?customCat:undefined);

    const checks=chain.canTransfer(rpid,null,dest,amount).checks;
    gate.run(checks, async (ok)=>{
      if(ok){
        const r = await Promise.resolve(chain.mint(rpid,dest,amount));
        if(r && r.ok) toast({title:'Emisión ejecutada',msg:`${amount} ${p.symbol} → ${short(dest)}`,hash:r.hash||txHash()});
        else toast({type:'err',title:'Error en mint',msg:(r&&r.reason)||'No se pudo ejecutar mint'});
      }
      else toast({type:'err',title:'Emisión bloqueada',msg:'Compliance multijurisdiccional rechazó al destinatario'});
    });
  }
  return h('div',{className:'row'},
    h('div',{style:{flex:'1 1 55%'}},h('div',{className:'card'},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:8}},
        h('h3',{style:{fontSize:15,fontWeight:700,margin:0}},'Emisión primaria parametrizable (Mint)'),
        h('div',{style:{display:'flex',gap:4}},
          [['custom','Wallet Seteable'],['order','Orden Suscripción']].map(([k,lbl])=>
            h('button',{key:k,className:'btn btn-sm '+(mode===k?'btn-primary':'btn-ghost'),style:{fontSize:11,padding:'4px 9px'},onClick:()=>setMode(k)},lbl)))),
      h('div',{className:'field'},h('label',{},'Proyecto ('+(p.tokenStandard||'ERC-3643')+' · '+(ISSUER_JURISDICTIONS[p.issuerJurisdiction]?.label||'Multijurisdiccional')+')'),
        h('select',{value:String(pid),onChange:e=>setPid(e.target.value)},chain.projects.map(x=>h('option',{key:x.id,value:String(x.id)},`${x.name} (${x.symbol})`)))),
      mode==='order' ? h('div',{},
        investOrders.length===0
          ? h('div',{style:{padding:'12px',borderRadius:8,background:'rgba(255,255,255,.03)',fontSize:12,color:'var(--txt-mute)',marginBottom:12}},
              'No hay órdenes de suscripción pendientes para este proyecto. Usá "Wallet Seteable" o creá una suscripción.')
          : h('div',{},
              h('div',{className:'field'},h('label',{},'Orden de Suscripción (Fondeo + KYC)'),
                h('select',{value:selectedOrderId,onChange:e=>setSelectedOrderId(e.target.value)},
                  investOrders.map(o=>h('option',{key:o.id,value:o.id},`${o.email} · ${o.qty} ${p.symbol} · ${short(o.wallet_address)} [${o.status}]`)))),
              h('button',{className:'btn btn-primary',style:{width:'100%'},disabled:autoMinting||!selectedOrderId,onClick:runAutoMintOrder},
                autoMinting?'⏳ Ejecutando Relayer On-Chain…':'⚡ Auto-Mintear Orden (Desatendido — KYC + Identity + Mint)')))
      : mode==='custom' ? h('div',{},
          h('div',{className:'field'},h('label',{},'Dirección de Wallet Destino (0x…)'),
            h('input',{type:'text',placeholder:'0x71C...89A',value:customWallet,onChange:e=>setCustomWallet(e.target.value),style:{fontFamily:'var(--mono)'}})),
          h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
            h('div',{className:'field'},h('label',{},'Jurisdicción del Inversor (ISO)'),
              h('select',{value:customJur,required:true,'aria-invalid':!customJur,onChange:e=>setCustomJur(e.target.value?+e.target.value:'')},
                h('option',{value:''},'Elegí la jurisdicción…'),
                Object.entries(JUR).map(([iso,lbl])=>h('option',{key:iso,value:iso},`${lbl} (ISO ${iso})`)))),
            h('div',{className:'field'},h('label',{},'Categoría KYC'),
              h('select',{value:customCat,required:true,'aria-invalid':!customCat,onChange:e=>setCustomCat(e.target.value?+e.target.value:'')},
                h('option',{value:''},'Elegí la categoría…'),
                Object.entries(CAT).map(([c,lbl])=>h('option',{key:c,value:c},`Cat ${c} · ${lbl}`))))),
          h('div',{className:'field'},h('label',{},'Cantidad de tokens a emitir'),
            h('input',{type:'number',min:1,value:amount,onChange:e=>setAmount(+e.target.value)})),
          h('button',{className:'btn btn-primary',style:{width:'100%'},disabled:gate.running,onClick:mint},
            gate.running?'Verificando Compliance…':'🚀 Registrar Identidad y Emitir Tokens'))
      : h('div',{},
          h('div',{className:'field'},h('label',{},'Wallet destino (Demo)'),h('select',{value:target,onChange:e=>setTarget(e.target.value)},DEMO_WALLETS.filter(w=>w.role!=='admin').map(w=>h('option',{key:w.addr,value:w.addr},w.label)))),
          h('div',{className:'field'},h('label',{},'Cantidad'),h('input',{type:'number',min:1,value:amount,onChange:e=>setAmount(+e.target.value)})),
          h('button',{className:'btn btn-primary',style:{width:'100%'},disabled:gate.running,onClick:mint},gate.running?'Verificando…':'Emitir tokens (Demo)'),
          h('p',{className:'muted',style:{fontSize:11.5,marginTop:12,lineHeight:1.5}},'Probá con "Inversor · EEUU" en un proyecto solo-ARG para ver el geo-blocking, o "Inversor sin KYC" para ver el rechazo por identidad.'))
    )),
    h('div',{style:{flex:'1 1 45%'}},h(ComplianceGate,{checks:gate.checks,running:gate.running,verdict:gate.verdict,title:'Validación de emisión multijurisdiccional'}))
  );
}

      yp&&h('div',{style:{marginTop:14}},h('div',{className:'kv'},h('span',{className:'k'},'Acumulado/token'),h('span',{className:'v',style:{color:'var(--emerald)'}},'USD '+fmt(yp.perToken))))

function MarketView({chain,wallet,toast,initialPid}){
  const initPid = initialPid!=null ? initialPid : (chain.projects[0]?chain.projects[0].id:0);
  const [pid,setPid]=useState(initPid);
  const [amount,setAmount]=useState(1);
  const [price,setPrice]=useState(3100);
  const gate=useGate();
  const p=chain.projects.find(x=>String(x.id)===String(pid))||chain.projects[0]||{soulbound:false,symbol:'—',id:0,jurisdictions:[]};
  const rpid=p.id;
  const myBal=chain.bal(rpid,wallet.addr);
  const openOrders=chain.orders.filter(o=>o.active&&o.pid===rpid);

  /* Historial simulado de transacciones ejecutadas — SOLO en modo demo. Con backend no se muestran
     operaciones ficticias a un inversor real (el historial arranca vacío). */
  const [tradeHistory,setTradeHistory]=useState(window.__API_URL__ ? [] : [
    {id:1,pid:0,buyer:'0xA1b2C3d4E5f6A1b2C3d4E5f6A1b2C3d4E5f6A1b2',seller:'0xB4c5D6e7F8a9B4c5D6e7F8a9B4c5D6e7F8a9B4c5',amount:10,price:3100,ts:Date.now()-86400000*3},
    {id:2,pid:0,buyer:'0xC7d8E9f0A1b2C7d8E9f0A1b2C7d8E9f0A1b2C7d8',seller:'0xD0e1F2a3B4c5D0e1F2a3B4c5D0e1F2a3B4c5D0e1',amount:5,price:3150,ts:Date.now()-86400000},
    {id:3,pid:1,buyer:'0xE3f4A5b6C7d8E3f4A5b6C7d8E3f4A5b6C7d8E3f4',seller:'0xF6a7B8c9D0e1F6a7B8c9D0e1F6a7B8c9D0e1F6a7',amount:2,price:450,ts:Date.now()-3600000*5},
  ]);
  const historial=tradeHistory.filter(t=>String(t.pid)===String(rpid));

  function create(){
    if(p.soulbound){toast({type:'err',title:'Token soulbound',msg:'Este proyecto no admite mercado secundario por diseño'});return;}
    const r=chain.createOrder(rpid,wallet.addr,amount,price);
    if(r.ok)toast({title:'Orden publicada',msg:`${amount} ${p.symbol} @ USD ${fmt(price)}`,hash:txHash()});
    else toast({type:'err',title:'No se pudo publicar',msg:r.reason});
  }
  function fill(o){
    const checks=chain.canTransfer(o.pid,o.seller,wallet.addr,o.amount).checks;
    gate.run(checks,(ok)=>{
      if(ok){
        const r=chain.fillOrder(o.id,wallet.addr);
        if(r.ok){
          toast({title:'Orden ejecutada',msg:`Compraste ${o.amount} ${p.symbol}`,hash:txHash()});
          setTradeHistory(prev=>[{id:Date.now(),pid:o.pid,buyer:wallet.addr,seller:o.seller,amount:o.amount,price:o.price,ts:Date.now()},...prev].slice(0,50));
        } else toast({type:'err',title:'Bloqueada',msg:r.reason});
      } else toast({type:'err',title:'Compra bloqueada',msg:'No cumplís compliance para recibir este token'});
    });
  }

  return h('div',{},
    h('div',{className:'eyebrow'},'Mercado secundario permisionado'),
    h('h1',{className:'page'},'Mercado OTC'),
    h('p',{className:'page-sub'},'Order book permisionado — sin AMM, sin slippage, sin impermanent loss. Cada operación pasa por el contrato del token, que re-valida KYC, jurisdicción y lock-up. Compatible con RG 1069/1088: "impedir transferencias no permitidas".'),
    chain.projects.length===0
      ? h('div',{role:'status',className:'card',style:{padding:'14px 16px',fontSize:13,color:'var(--txt-dim)',marginBottom:12}},'Todavía no hay proyectos en colocación. Cuando TOKAI habilite uno, vas a poder operarlo acá.')
      : h('div',{className:'field',style:{maxWidth:340}},h('label',{},'Proyecto'),h('select',{value:String(pid),onChange:e=>{setPid(e.target.value);gate.reset();}},chain.projects.map(x=>h('option',{key:x.id,value:String(x.id)},`${x.name} (${x.symbol})`)))),
    p.soulbound&&h('div',{className:'card',style:{borderColor:'rgba(255,178,62,.3)',marginBottom:16}},
      h('div',{style:{display:'flex',gap:11,alignItems:'center'}},h(Icon,{d:I.lock,style:{width:18,height:18,color:'var(--amber)'}}),
        h('div',{},h('b',{style:{color:'var(--amber)'}},'Token soulbound'),h('div',{className:'muted',style:{fontSize:12.5}},'Este proyecto está diseñado como ecosistema cerrado (Howey-safe). No tiene mercado secundario — los certificados son intransferibles.')))),
    !p.soulbound&&h('div',{className:'row'},
      /* Panel izquierdo: publicar + compliance gate */
      h('div',{style:{flex:'1 1 38%',display:'flex',flexDirection:'column',gap:16}},
        h('div',{className:'card'},
          h('h3',{style:{fontSize:14,fontWeight:700,marginBottom:14}},'Publicar orden de venta'),
          h('div',{className:'field'},h('label',{},'Cantidad ('+myBal+' disponibles)'),h('input',{type:'number',min:1,max:myBal,value:amount,onChange:e=>setAmount(+e.target.value)})),
          h('div',{className:'field'},h('label',{},'Precio por token (USD)'),h('input',{type:'number',value:price,onChange:e=>setPrice(+e.target.value)})),
          h('button',{className:'btn btn-primary',style:{width:'100%'},disabled:myBal<1,onClick:create},myBal<1?'No tenés tokens':'Publicar orden')),
        h(ComplianceGate,{checks:gate.checks,running:gate.running,verdict:gate.verdict,title:'Validación de la operación'})
      ),
      /* Panel derecho: order book + historial */
      h('div',{style:{flex:'1 1 62%',display:'flex',flexDirection:'column',gap:16}},
        h('div',{className:'card',style:{padding:0,overflowX:'auto'}},
          h('div',{style:{padding:'16px 20px',borderBottom:'1px solid var(--line-solid)',display:'flex',alignItems:'center',gap:10}},
            h('h3',{style:{fontSize:14,fontWeight:700,margin:0}},'Órdenes abiertas · '+p.symbol),
            openOrders.length>0&&h('span',{style:{fontSize:10,color:'var(--txt-mute)',padding:'2px 8px',borderRadius:10,background:'rgba(255,255,255,.04)'}},openOrders.length+' activas')),
          openOrders.length===0
            ?h('div',{className:'empty'},h(Icon,{d:I.market}),h('div',{},'No hay órdenes abiertas'),h('div',{style:{fontSize:12,marginTop:4}},'Publicá la primera desde el panel izquierdo'))
            :h('table',{},
              h('thead',{},h('tr',{},['Orden','Cantidad','Precio','Total','Vendedor','Compliance','Acción'].map(x=>h('th',{key:x},x)))),
              h('tbody',{},openOrders.map(o=>{
                /* Validación pasiva de compliance para cada orden */
                const ct=chain.canTransfer(o.pid,o.seller,wallet.addr,o.amount);
                const isOwn=o.seller===wallet.addr;
                const blocked=!ct.allowed&&!isOwn;
                const blockReason=ct.reason;
                return h('tr',{key:o.id},
                  h('td',{className:'mono'},'#'+o.id),
                  h('td',{},o.amount+' '+p.symbol),
                  h('td',{className:'mono'},'USD '+fmt(o.price)),
                  h('td',{className:'mono',style:{color:'var(--emerald)'}},'USD '+fmt(o.price*o.amount)),
                  h('td',{className:'mono',style:{fontSize:11}},short(o.seller)),
                  h('td',{},isOwn
                    ?h('span',{style:{fontSize:10,color:'var(--txt-mute)'}},'-')
                    :blocked
                      ?h('span',{title:blockReason||'Restricción compliance',style:{display:'inline-flex',alignItems:'center',gap:3,fontSize:10,padding:'2px 8px',borderRadius:12,background:'rgba(255,178,62,.1)',color:'var(--amber)',cursor:'help'}},
                          '⚠ '+(blockReason?blockReason.slice(0,20)+'…':'Bloqueado'))
                      :h('span',{style:{fontSize:10,padding:'2px 8px',borderRadius:12,background:'rgba(0,214,126,.08)',color:'var(--emerald)'}},'✓ Apto')),
                  h('td',{},isOwn
                    ?h('button',{className:'btn btn-danger btn-sm',onClick:()=>{chain.cancelOrder(o.id,wallet.addr);toast({type:'warn',title:'Orden cancelada',msg:'#'+o.id});}},'Cancelar')
                    :h('button',{className:'btn btn-primary btn-sm',
                        disabled:gate.running||blocked,
                        title:blocked?(blockReason||'No cumplís compliance para esta operación'):undefined,
                        style:blocked?{opacity:.45,cursor:'not-allowed'}:{},
                        onClick:blocked?undefined:()=>fill(o)},
                        blocked?'No habilitado':'Comprar')));
              })))
        ),
        /* Historial de transacciones ejecutadas */
        historial.length>0&&h('div',{className:'card',style:{padding:0,overflowX:'auto'}},
          h('div',{style:{padding:'12px 20px',borderBottom:'1px solid var(--line-solid)',display:'flex',alignItems:'center',gap:8}},
            h('h3',{style:{fontSize:13,fontWeight:700,margin:0}},'Historial de transacciones · '+p.symbol),
            h('span',{style:{fontSize:10,color:'var(--txt-mute)',padding:'2px 7px',borderRadius:10,background:'rgba(255,255,255,.04)'}},historial.length+' trades')),
          h('table',{},
            h('thead',{},h('tr',{},['Cant.','Precio','Total USD','Comprador','Vendedor','Fecha'].map(x=>h('th',{key:x},x)))),
            h('tbody',{},historial.map(t=>h('tr',{key:t.id},
              h('td',{},t.amount+' '+p.symbol),
              h('td',{className:'mono'},'USD '+fmt(t.price)),
              h('td',{className:'mono',style:{color:'var(--emerald)'}},'USD '+fmt(t.price*t.amount)),
              h('td',{className:'mono',style:{fontSize:10}},short(t.buyer)),
              h('td',{className:'mono',style:{fontSize:10}},short(t.seller)),
              h('td',{style:{fontSize:11,color:'var(--txt-mute)'}},new Date(t.ts).toLocaleDateString('es-AR'))
            )))
          )
        )
      )
    )
  );
}

/* ════════════════════════════════════════════════════════════════════
   AdminPitch — el emisor carga su contenido persuasivo
   Aparece en tab "Pitch ✦" del AdminView
   ════════════════════════════════════════════════════════════════════ */
function AdminPitch({chain, toast, initialPid}){
  const projects = chain.projects||[];
  const defaultIdx = (initialPid != null) ? projects.findIndex(x => x.id === initialPid || String(x.id) === String(initialPid)) : 0;
  const [pid,setPid] = useState(defaultIdx >= 0 ? defaultIdx : 0);
  const p = projects[pid]||projects[0]||{};

  // Estado del pitch (se guarda en el proyecto vía updateProject)
  const initPitch = ()=> p.pitch || {
    headline:'', porque:'', bullets:['','',''],
    videoUrl:'', docs:[], scenarios:null
  };
  const [f,setF] = useState(initPitch);
  const [showImport,setShowImport] = useState(false);
  const [importProjectIdx,setImportProjectIdx] = useState(0);
  const upd = (k,v) => setF(s=>({...s,[k]:v}));

  // Cambio de proyecto
  function syncPid(i){ setPid(i); setF(projects[i]?.pitch||{headline:'',porque:'',bullets:['','',''],videoUrl:'',docs:[],scenarios:null}); }

  function addBullet(){ upd('bullets',[...f.bullets,'']); }
  function setBullet(i,v){ const b=[...f.bullets]; b[i]=v; upd('bullets',b); }
  function delBullet(i){ upd('bullets',f.bullets.filter((_,j)=>j!==i)); }

  // Documentos
  function addDoc(name,tipo,url){ upd('docs',[...f.docs,{name,tipo,url,id:Date.now()}]); }
  function delDoc(id){ upd('docs',f.docs.filter(d=>d.id!==id)); }

  function readDocFile(file){
    const reader=new FileReader();
    reader.onload=()=>addDoc(file.name, file.type.includes('pdf')?'pdf':'imagen', reader.result);
    reader.readAsDataURL(file);
  }

  async function save(){
    const targetId = p.id != null ? p.id : pid;
    if(chain.updateProject){
      const res = await chain.updateProject(targetId,{pitch:{...f}});
      if(res && res.ok === false){
        toast&&toast({type:'err',title:'Error al guardar pitch',msg:res.reason||'No se pudo guardar en el servidor.'});
        return;
      }
    }
    toast&&toast({title:'Pitch guardado',msg:'Los inversores verán este contenido en la ficha del proyecto.'});
  }

  const fs = {width:'100%',padding:'9px 12px',borderRadius:9,border:'1px solid var(--line-solid)',background:'var(--black)',color:'var(--txt)',fontSize:13,boxSizing:'border-box',fontFamily:'inherit'};
  const DOC_ICONS = {pdf:'📄',imagen:'🖼️',term_sheet:'📋',memoria:'📝',render:'🏗️',otro:'📎'};

  return h('div',{},
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:10}},
      h('div',{},
        h('div',{className:'eyebrow'},'Contenido para inversores'),
        h('h1',{className:'page',style:{margin:0}},'Pitch del proyecto')
      ),
      h('div',{style:{display:'flex',gap:8}},
        h('button',{className:'btn btn-ghost btn-sm',onClick:()=>setShowImport(!showImport)},'📥 Importar Pitch'),
        h('button',{className:'btn btn-ghost btn-sm',onClick:()=>{ if(typeof go==='function') go('admin',null,'projects'); }},'← Volver a Proyectos'),
        projects[pid]&&h('button',{className:'btn btn-primary btn-sm',onClick:()=>{ if(typeof go==='function') go('asset',projects[pid].id); }},'Ver Ficha del Inversor 👁️')
      )
    ),
    h('p',{className:'page-sub'},'Este contenido aparece en la ficha del proyecto cuando el inversor hace click en el CTA del widget. Es tu espacio para convencer. TOKAI no edita esto — es tu voz como emisor.'),

    // selector de proyecto
    projects.length>1 && h('div',{style:{display:'flex',gap:8,marginBottom:20,flexWrap:'wrap'}},
      projects.map((pr,i)=>h('button',{key:i,onClick:()=>syncPid(i),
        style:{padding:'7px 13px',borderRadius:9,cursor:'pointer',fontSize:12,fontWeight:600,
          border:'1.5px solid '+(i===pid?'var(--emerald)':'var(--line-solid)'),
          background:i===pid?'rgba(0,214,126,.08)':'var(--panel)',
          color:i===pid?'var(--emerald)':'var(--txt)'}},pr.name))),

    /* importación de pitch */
    showImport && h('div',{className:'card',style:{marginBottom:16,border:'1px solid var(--emerald)',background:'rgba(0,214,126,.02)'}},
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}},
        h('div',{style:{fontWeight:700,fontSize:14,color:'var(--emerald)',display:'flex',alignItems:'center',gap:6}},'📥 Importar Pitch'),
        h('button',{className:'btn btn-ghost btn-sm',onClick:()=>setShowImport(false)},'✕ Cerrar')
      ),
      h('div',{style:{display:'flex',gap:12,flexWrap:'wrap',alignItems:'flex-end'}},
        h('div',{style:{flex:1,minWidth:220}},
          h('label',{style:{fontSize:11.5,fontWeight:600,color:'var(--txt-mute)',display:'block',marginBottom:6}},'Copiar pitch de otro proyecto'),
          h('select',{value:importProjectIdx,onChange:e=>setImportProjectIdx(+e.target.value),style:{width:'100%',padding:'8px 11px',borderRadius:8,background:'var(--black)',color:'var(--txt)',border:'1px solid var(--line-solid)'}},
            projects.map((proj,i)=>h('option',{key:i,value:i,disabled:i===pid},proj.name+(i===pid?' (actual)':'')))
          )
        ),
        h('button',{className:'btn btn-primary btn-sm',onClick:()=>{
          const srcProj = projects[importProjectIdx];
          if(!srcProj || !srcProj.pitch){
            toast&&toast({type:'err',title:'Sin pitch',msg:'El proyecto seleccionado no posee un pitch configurado.'});
            return;
          }
          const copied = JSON.parse(JSON.stringify(srcProj.pitch));
          setF(copied);
          setShowImport(false);
          toast&&toast({title:'Pitch importado',msg:`Se importaron los datos de pitch de ${srcProj.name}`});
        }},'Importar desde proyecto'),
        h('label',{className:'btn btn-ghost btn-sm',style:{cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6,padding:'8px 14px',border:'1px dashed var(--emerald)',color:'var(--emerald)'}},
          '📂 Archivo .json',
          h('input',{type:'file',accept:'.json',style:{display:'none'},onChange:e=>{
            const file = e.target.files && e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(evt){
              try {
                const data = JSON.parse(evt.target.result);
                const pitchData = data.pitch || data;
                if(pitchData.headline || pitchData.porque || pitchData.bullets){
                  setF(s=>({...s, ...pitchData}));
                  setShowImport(false);
                  toast&&toast({title:'Pitch cargado',msg:`Se importaron los datos desde ${file.name}`});
                } else {
                  toast&&toast({type:'err',title:'Error',msg:'El JSON no contiene campos de pitch válidos.'});
                }
              } catch(err) {
                toast&&toast({type:'err',title:'Error JSON',msg:'No se pudo leer el archivo JSON.'});
              }
            };
            reader.readAsText(file);
          }})
        )
      )
    ),

    h('div',{style:{display:'grid',gap:14}},

      // 1. Headline
      h('div',{className:'card'},
        h('div',{style:{fontWeight:700,fontSize:13,color:'var(--emerald)',marginBottom:8}},'① Título del pitch'),
        h('div',{style:{fontSize:11.5,color:'var(--txt-mute)',marginBottom:8}},'Una frase que resume por qué vale la pena invertir. Máximo 80 caracteres.'),
        h('input',{value:f.headline,maxLength:80,placeholder:'Ej.: El primer complejo tokenizado del corredor productivo de Mendoza',style:fs,onChange:e=>upd('headline',e.target.value)}),
        h('div',{style:{fontSize:10,color:'var(--txt-mute)',textAlign:'right',marginTop:4}},(f.headline||'').length+'/80')),

      // 2. Por qué invertir
      h('div',{className:'card'},
        h('div',{style:{fontWeight:700,fontSize:13,color:'var(--emerald)',marginBottom:8}},'② Por qué invertir'),
        h('div',{style:{fontSize:11.5,color:'var(--txt-mute)',marginBottom:8}},'Describí el activo, el contexto, la oportunidad y los diferenciales. Máximo 1.500 caracteres.'),
        h('textarea',{value:f.porque,rows:6,maxLength:1500,placeholder:'Ej.: El complejo Grand Alyson se encuentra en la intersección de Ruta Nacional 7 y Acceso Este, el corredor de mayor crecimiento inmobiliario de Mendoza...',style:{...fs,resize:'vertical'},onChange:e=>upd('porque',e.target.value)}),
        h('div',{style:{fontSize:10,color:'var(--txt-mute)',textAlign:'right',marginTop:4}},(f.porque||'').length+'/1500')),

      // 3. Puntos clave
      h('div',{className:'card'},
        h('div',{style:{fontWeight:700,fontSize:13,color:'var(--emerald)',marginBottom:8}},'③ Puntos clave'),
        h('div',{style:{fontSize:11.5,color:'var(--txt-mute)',marginBottom:12}},'De 3 a 6 razones concretas para invertir. Frases cortas, datos si tenés.'),
        h('div',{style:{display:'flex',flexDirection:'column',gap:7}},
          f.bullets.map((b,i)=>h('div',{key:i,style:{display:'flex',gap:7,alignItems:'center'}},
            h('span',{style:{color:'var(--emerald)',fontWeight:700,fontSize:14,flexShrink:0}},'✦'),
            h('input',{value:b,placeholder:'Ej.: Ubicación premium: 8.000 vehículos diarios frente al complejo',style:{...fs,flex:1},onChange:e=>setBullet(i,e.target.value)}),
            f.bullets.length>3&&h('button',{onClick:()=>delBullet(i),style:{background:'none',border:'none',color:'#FF5C5C',cursor:'pointer',fontSize:16,flexShrink:0}},'×')))),
        f.bullets.length<6&&h('button',{onClick:addBullet,style:{marginTop:8,fontSize:12,color:'var(--emerald)',background:'none',border:'none',cursor:'pointer'}},'+  agregar punto')),

      // 4. Video
      h('div',{className:'card'},
        h('div',{style:{fontWeight:700,fontSize:13,color:'var(--emerald)',marginBottom:8}},'④ Video de presentación (opcional)'),
        h('div',{style:{fontSize:11.5,color:'var(--txt-mute)',marginBottom:8}},'URL de YouTube o Vimeo. El video se embebe en la ficha del proyecto.'),
        h('input',{value:f.videoUrl,placeholder:'https://www.youtube.com/watch?v=...',style:fs,onChange:e=>upd('videoUrl',e.target.value)}),
        f.videoUrl && h('div',{style:{marginTop:12,fontSize:12,color:'var(--txt-mute)'}},
          '✓ Video configurado: ',h('span',{style:{color:'var(--emerald)',fontFamily:'var(--mono)',fontSize:11}},f.videoUrl.slice(0,60)+'...'))),

      // 5. Documentos
      h('div',{className:'card'},
        h('div',{style:{fontWeight:700,fontSize:13,color:'var(--emerald)',marginBottom:8}},'⑤ Documentos para inversores'),
        h('div',{style:{fontSize:11.5,color:'var(--txt-mute)',marginBottom:12}},'Subí documentos clave: term sheet, memoria descriptiva, renders, contratos. PDF o imagen.'),
        f.docs.length>0&&h('div',{style:{display:'flex',flexDirection:'column',gap:6,marginBottom:12}},
          f.docs.map(doc=>h('div',{key:doc.id,style:{display:'flex',gap:10,alignItems:'center',padding:'8px 12px',borderRadius:9,background:'rgba(255,255,255,.03)',border:'1px solid var(--line-solid)'}},
            h('span',{style:{fontSize:18}},(DOC_ICONS[doc.tipo]||DOC_ICONS.otro)),
            h('span',{style:{fontSize:12.5,flex:1,color:'var(--txt-dim)'}},(doc.name||doc.tipo)),
            h('button',{onClick:()=>delDoc(doc.id),style:{background:'none',border:'none',color:'#FF5C5C',cursor:'pointer',fontSize:13,flexShrink:0}},'× Quitar')))),
        h('div',{style:{display:'flex',gap:10,flexWrap:'wrap'}},
          h('label',{style:{padding:'8px 14px',borderRadius:9,border:'1px dashed var(--line-solid)',cursor:'pointer',fontSize:12,color:'var(--txt-mute)',display:'flex',gap:6,alignItems:'center'}},
            '📎 Subir documento',
            h('input',{type:'file',accept:'.pdf,image/*',multiple:true,style:{display:'none'},onChange:e=>[...e.target.files].forEach(f2=>readDocFile(f2))})),
          h('button',{onClick:()=>{ const url=prompt('URL del documento (PDF público):'); if(url) addDoc('Documento externo','otro',url); },style:{padding:'8px 14px',borderRadius:9,border:'1px dashed var(--line-solid)',background:'none',cursor:'pointer',fontSize:12,color:'var(--txt-mute)'}},
            '🔗 Agregar URL'))),

      // guardar
      h('div',{style:{display:'flex',gap:10,alignItems:'center'}},
        h('button',{className:'btn btn-primary',onClick:save},'Guardar pitch'),
        h('div',{style:{fontSize:12,color:'var(--txt-mute)'}},'Visible para inversores en la ficha del proyecto.'))
    )
  );
}


/* ════════════════════════════════════════════════════════════════════
   TOKAI Platform — Vistas nuevas (ficha de activo, cartera, dashboard TOKAI)
   Incorpora lo mejor de Reental (ficha + simulador), MiActivo (multi-token
   por perfil), Tutellus (acceso por nivel) — y el diferencial TOKAI:
   la capa de supervisión del estructurador que ningún competidor tiene.
   ════════════════════════════════════════════════════════════════════ */

/* ─────────────────────── FICHA DE ACTIVO ─────────────────────── */
/* Inspirada en la ficha de Reental: ubicación, rentabilidad, plazo,
   proyección económica, simulador. Pero con honestidad de liquidez
   (mercado permisionado) y el régimen regulatorio al frente.          */
function AssetDetail({chain,wallet,pid,toast,go}){
  const _matched = chain.projects.find(x=>String(x.id)===String(pid));
  const _raw = _matched || (pid == null ? chain.projects[0] : null);
  if (!_raw) {
    return h('div',{className:'card',style:{maxWidth:520,margin:'40px auto',textAlign:'center',padding:32}},
      h('h3',{style:{fontSize:16,fontWeight:700,marginBottom:8}},'Proyecto no disponible'),
      h('p',{className:'muted',style:{fontSize:13,marginBottom:18}},'No tenés acceso a este proyecto o no existe.'),
      h('button',{className:'btn btn-primary btn-sm',onClick:()=>go('dash')},'← Volver a Proyectos'));
  }
  // normalización defensiva: en modo live los proyectos vienen de la cadena sin
  // metadata de ficha. Rellenamos con defaults seguros para no romper el render.
  const p = Object.assign({
    name:'—', symbol:'—', vertical:'—', location:'—', assetType:'—', status:'On-chain',
    banner:'linear-gradient(135deg,#0d2847,#1a4d8f)', soulbound:false, regime:'—',
    termMonths:0, yieldAnnualPct:0, plusvaliaPct:0, payoutFreq:'No aplica',
    priceUsdCents:0, valuationUsd:0, maxSupply:0, totalSupply:0, raised:0, lockupDays:0,
    jurisdictions:[], docs:[], tranches:[], tokenProfiles:[], proforma:null,
    ronda:1, rondaLabel:'Clasificación', yieldMechanism:'A',
    yieldSource:'—'
  }, _raw);
  const userJur = (chain.identities[wallet.addr]?.jur) || wallet.jur;
  const blockedJurisdictions = useGeofencingBlocklist();
  const globallyBlocked = blockedJurisdictions.includes(userJur);
  // Sincronización de geofencing: además del blocklist global de gobernanza
  // TOKAI, se consulta el allowlist on-chain de este token específico. Bloquea
  // si cualquiera de las dos capas lo hace.
  const [onChainDisallowed,setOnChainDisallowed] = useState(false);
  useEffect(function(){
    let cancelled = false;
    if (p.token && userJur != null && chain.isJurisdictionAllowedOnChain) {
      chain.isJurisdictionAllowedOnChain(p.token, userJur).then(function(allowed){

/* ─────────────────────── CARTERA DEL INVERSOR ─────────────────────── */
/* Lo que Reental hace bien: vista consolidada de todas las posiciones,
   histórico de rentas, reinversión. Aquí con el balance real on-chain.  */
/* ── «Mi cartera» › Wallet de acceso (ADR-026) ─────────────────────────────────
   Vincula la wallet a la cuenta (firma de un desafío con la sesión de email abierta). Desde ahí
   «Con wallet» abre la sesión de esta cuenta. Solo con backend y sesión real. */
function WalletLinkCard({toast}){
  const API = window.__API_URL__;
  const [account,setAccount] = useState(null);   // null = cargando · false = sin sesión de backend
  const [busy,setBusy] = useState(false);
  const [err,setErr] = useState('');
  const [confirmUnlink,setConfirmUnlink] = useState(false);
  /* Paso previo a firmar: las cuentas que la wallet comparte con el sitio y la elegida. MetaMask no
     siempre pone primera la cuenta activa, así que nunca se firma con la primera sin mostrarla. */
  const [choices,setChoices] = useState(null);
  const [picked,setPicked] = useState('');

  useEffect(()=>{
    if(!API){ setAccount(false); return; }
    fetch(API + '/auth/me', { credentials: 'include' })
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(d => setAccount(d && d.id ? d : false))
      .catch(() => setAccount(false));
  },[]);

  async function chooseAccount(){
    setBusy(true); setErr('');
    try {
      if (!window.ethereum) throw new Error('no_wallet');
      const accs = await window.ethereum.request({ method: 'eth_requestAccounts' });
      if (!accs || !accs.length) throw new Error('no_wallet');
      setChoices(accs);
      setPicked(accs.length === 1 ? accs[0] : '');
    } catch(e) {
      setErr(tokaiWalletErrMsg(e));
    } finally { setBusy(false); }
  }

  async function link(){
    if(!picked) return;
    setBusy(true); setErr('');
    try {
      const address = picked;
      const r = await tokaiWalletSignedPost(address, '/auth/wallet/link/challenge', '/auth/wallet/link');
      if(!r.ok){
        setErr(r.data.code === 'wallet_in_use' ? 'Esa wallet ya está vinculada a otra cuenta. Elegí otra en tu wallet.' : (r.data.error || 'No se pudo vincular la wallet.'));
        return;
      }
      setAccount(Object.assign({}, account, { wallet_address: r.data.wallet_address }));
      setChoices(null); setPicked('');
      toast && toast({ title: 'Wallet vinculada', msg: short(r.data.wallet_address) + ' · ya podés entrar con «Con wallet»' });
    } catch(e) {
      setErr(tokaiWalletErrMsg(e));
    } finally { setBusy(false); }
  }

  async function unlink(){
    setBusy(true); setErr('');
    try {
      const r = await fetch(API + '/auth/wallet/link', { method: 'DELETE', credentials: 'include' });
      if(!r.ok) throw new Error(String(r.status));
      setAccount(Object.assign({}, account, { wallet_address: null }));
      setConfirmUnlink(false);
      toast && toast({ title: 'Wallet desvinculada', msg: 'Para entrar usá «Con email».' });
    } catch(e) {
      setErr('No se pudo desvincular. Intentá de nuevo.');
    } finally { setBusy(false); }
  }

  if(!account) return null; // demo, sin sesión o cargando: nada que vincular
  const linked = account.wallet_address;
  return h('div',{className:'card',style:{padding:'14px 16px',marginBottom:16,display:'flex',justifyContent:'space-between',alignItems:'center',gap:12,flexWrap:'wrap'}},
    h('div',{style:{minWidth:220,flex:1}},
      h('div',{style:{fontWeight:800,fontSize:13,marginBottom:3}},'Wallet de acceso'),
      h('div',{style:{fontSize:12,color:'var(--txt-dim)',lineHeight:1.5}},
        linked
          ? h('span',{},'Vinculada: ',h('span',{style:{fontFamily:'var(--mono)',color:'var(--emerald)'}},short(linked)),'. Podés entrar con «Con wallet».')
          : 'Vinculá tu wallet para entrar firmando con ella, sin código por email. La firma no mueve fondos.'),
      !linked && choices && h('fieldset',{style:{border:0,padding:0,margin:'10px 0 0'}},
        h('legend',{style:{fontSize:12,fontWeight:700,marginBottom:6}},
          choices.length > 1 ? 'Elegí la wallet que querés vincular' : 'Vas a vincular esta wallet'),
        choices.map(a => h('label',{key:a,style:{display:'flex',alignItems:'center',gap:8,fontSize:12,padding:'4px 0',cursor:'pointer'}},
          h('input',{type:'radio',name:'wallet-link-pick',value:a,checked:picked===a,onChange:()=>setPicked(a),disabled:busy}),
          h('span',{style:{fontFamily:'var(--mono)',color:picked===a?'var(--emerald)':'var(--txt)'}},short(a))))),
      err&&h('div',{role:'alert',style:{color:'#FF5C5C',fontSize:12,marginTop:6}},err)),
    !linked
      ? (choices
          ? h('div',{style:{display:'flex',gap:6}},
              h('button',{className:'btn btn-ghost btn-sm',onClick:()=>{ setChoices(null); setPicked(''); setErr(''); },disabled:busy},'Cancelar'),
              h('button',{className:'btn btn-primary btn-sm',onClick:link,disabled:busy||!picked},
                busy ? 'Esperando firma…' : (picked ? 'Firmar con ' + short(picked) : 'Elegí una wallet')))
          : h('button',{className:'btn btn-primary btn-sm',onClick:chooseAccount,disabled:busy},busy?'Abriendo tu wallet…':'Vincular wallet'))
      : confirmUnlink
        ? h('div',{style:{display:'flex',gap:6}},
            h('button',{className:'btn btn-ghost btn-sm',onClick:()=>setConfirmUnlink(false),disabled:busy},'Cancelar'),
            h('button',{className:'btn btn-primary btn-sm',onClick:unlink,disabled:busy},busy?'Desvinculando…':'Confirmar desvincular'))
        : h('button',{className:'btn btn-ghost btn-sm',onClick:()=>setConfirmUnlink(true)},'Desvincular'));
}

    {code: 600, name: 'Paraguay', flag: '🇵🇾', desc: 'Sujeto a la CNV Paraguay (Ley 5810/17 de Mercado de Capitales).'},

    {code: 344, name: 'Hong Kong', flag: '🇭🇰', desc: 'Sujeto a la SFC (Securities and Futures Commission) — circular 26EC23, trading secundario de productos tokenizados.'},
    {code: 702, name: 'Singapur', flag: '🇸🇬', desc: 'Sujeto al MAS (Securities and Futures Act) — Capital Markets Product.'}
  ];

  var API = window.__API_URL__ || '';
  var [blocked, setBlocked] = useState([840]);
  var [synced, setSynced] = useState(false);
  var [savingCode, setSavingCode] = useState(null);

  function load(){
    if(!API){ setSynced(true); return; }
    fetch(API + '/geofencing')
      .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
      .then(function(d){ setBlocked(d.blockedJurisdictions || []); setSynced(true); })
      .catch(function(){ setSynced(true); });
  }
  useEffect(function(){ load(); }, []);

  function toggle(c){
    var isBlocked = blocked.includes(c.code);
    var next = isBlocked ? blocked.filter(function(x){ return x !== c.code; }) : blocked.concat([c.code]);

    if(!API){
      setBlocked(next);

      return;

    setSavingCode(c.code);
    fetch(API + '/geofencing/admin', {
      method: 'PATCH', credentials: 'include', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ blockedJurisdictions: next })
    })
      .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
      .then(function(d){
        setBlocked(d.blockedJurisdictions || next);
        toast({
          title: isBlocked ? 'Acceso Habilitado' : 'Acceso Restringido',
          msg: c.name + ' ahora se encuentra ' + (isBlocked ? 'habilitado' : 'bloqueado') + ' preventivamente.'
        });
      })
      .catch(function(){ toast({ type:'err', title:'Error', msg:'No se pudo actualizar la restricción de ' + c.name + '.' }); })
      .finally(function(){ setSavingCode(null); });
  }

  return h('div', {className:'card', style:{padding:24}},
    h('h2', {style:{fontSize:17, fontWeight:700, marginBottom:8}}, 'Gobernanza de Geofencing'),
    h('p', {className:'muted', style:{fontSize:13, lineHeight:1.5, marginBottom:API?8:20}},
      'Restringí el acceso de inversores de forma preventiva según su origen geográfico. Cuando un país se encuentra restringido, los inversores asociados a esa jurisdicción no podrán suscribir capital ni acceder al detalle de los activos tokenizados, previniendo ofertas públicas accidentales.'
    ),
    API && h('p', {style:{fontSize:11.5, color: synced ? 'var(--txt-mute)' : '#FFB23E', marginBottom:20}},
      synced ? 'Sincronizado con TOKAI — persiste entre sesiones.' : 'Sincronizando con TOKAI…'),
    h('div', {style:{display:'grid', gap:12}},
      countries.map(c => {
        const isBlocked = blocked.includes(c.code);
        const isSaving = savingCode === c.code;
        return h('div', {key:c.code, className:'card', style:{display:'flex', alignItems:'center', justifyContent:'space-between', padding:'16px 20px', border:'1px solid '+(isBlocked ? 'rgba(255, 92, 92, 0.25)' : 'rgba(0, 214, 126, 0.25)'), background:isBlocked ? 'rgba(255, 92, 92, 0.03)' : 'rgba(0, 214, 126, 0.03)'}},
          h('div', {style:{display:'flex', alignItems:'center', gap:14}},
            h('span', {style:{fontSize:32}}, c.flag),
            h('div', {},
              h('div', {style:{fontWeight:700, display:'flex', alignItems:'center', gap:8}},
                c.name,
                h('span', {style:{fontSize:11, fontFamily:'var(--mono)', color:'var(--txt-mute)'}}, '(ISO '+c.code+')'),
                isBlocked && h('span', {className:'badge red', style:{fontSize:9}}, 'Restringido')
              ),
              h('div', {className:'muted', style:{fontSize:11.5, marginTop:4}}, c.desc)
            )
          ),
          h('button', {
            className: 'btn ' + (isBlocked ? 'btn-primary' : 'btn-ghost'),
            style: isBlocked ? {background:'var(--red)', border:'none'} : {},
            'aria-pressed': isBlocked,
            disabled: isSaving,
            onClick: function(){ toggle(c); }
          }, isSaving ? 'Guardando…' : (isBlocked ? 'Habilitar acceso' : 'Restringir acceso'))
        );
      })
    )
  );
}
